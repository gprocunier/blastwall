<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="610" viewBox="0 0 1280 610" role="img" aria-labelledby="v3-stable-preflight-decision-title v3-stable-preflight-decision-desc">
<title id="v3-stable-preflight-decision-title">Stable-v3 Preflight Decision</title>
<desc id="v3-stable-preflight-decision-desc">Every candidate takes the same verification path; named failures stop launch before runtime work.</desc>
<defs>
<marker id="arrow-default" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ee0000" /></marker>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4d4d4d" /></marker>
<marker id="arrow-success" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3d7317" /></marker>
<marker id="arrow-warning" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f0ab00" /></marker>
</defs>
<style>
svg { background: #ffffff; font-family: 'Red Hat Text', 'Helvetica Neue', Arial, sans-serif; }
.diagram-title { fill: #151515; font: 700 26px 'Red Hat Display', 'Red Hat Text', Arial, sans-serif; }
.diagram-subtitle { fill: #4d4d4d; font: 400 15px 'Red Hat Text', Arial, sans-serif; }
.lane rect { fill: #f5f5f5; stroke: #e0e0e0; stroke-width: 1.5; }
.lane--red rect { fill: #fff5f5; stroke: #f4b7b7; }
.lane--blue rect { fill: #f1f7ff; stroke: #b8d8ff; }
.lane-title { fill: #a30000; font: 700 16px 'Red Hat Display', 'Red Hat Text', Arial, sans-serif; }
.card rect { fill: #ffffff; stroke: #e0e0e0; stroke-width: 1.5; }
.card--gate rect { stroke: #ee0000; stroke-width: 2.2; }
.card--proof rect { stroke: #0066cc; stroke-width: 2; }
.card--success rect { stroke: #3d7317; stroke-width: 2; }
.card--warning rect { stroke: #f0ab00; stroke-width: 2; }
.card--muted rect { fill: #f5f5f5; stroke: #c7c7c7; }
.card-title { fill: #151515; font: 700 17px 'Red Hat Display', 'Red Hat Text', Arial, sans-serif; }
.card-body { fill: #4d4d4d; font: 400 13.5px 'Red Hat Text', Arial, sans-serif; }
.connector { fill: none; stroke: #ee0000; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.connector--muted { stroke: #4d4d4d; }
.connector--success { stroke: #3d7317; }
.connector--warning { stroke: #f0ab00; }
.connector--dashed { stroke-dasharray: 7 7; }
.connector-label { fill: #4d4d4d; font: 700 12px 'Red Hat Text', Arial, sans-serif; }
.standalone-label { fill: #151515; font: 700 15px 'Red Hat Text', Arial, sans-serif; }
.standalone-label--muted { fill: #4d4d4d; font-weight: 500; }
.standalone-label--red { fill: #a30000; }
</style>
<text class="diagram-title" x="32" y="42">Stable-v3 Preflight Decision</text>
<text class="diagram-subtitle" x="32" y="68">Every candidate takes the same verification path; named failures stop launch before runtime work.</text>
<polyline class="connector connector--default" points="210,173 250,173" marker-end="url(#arrow-default)" />
<polyline class="connector connector--default" points="400,173 440,173" marker-end="url(#arrow-default)" />
<polyline class="connector connector--default" points="600,173 640,173" marker-end="url(#arrow-default)" />
<polyline class="connector connector--default" points="800,173 840,173" marker-end="url(#arrow-default)" />
<polyline class="connector connector--default" points="1000,173 1040,173" marker-end="url(#arrow-default)" />
<polyline class="connector connector--default" points="1120,216 1120,340" marker-end="url(#arrow-default)" />
<polyline class="connector connector--success" points="1040,383 1000,383 1000,383 840,383" marker-end="url(#arrow-success)" />
<polyline class="connector connector--warning connector--dashed" points="325,216 325,340" marker-end="url(#arrow-warning)" />
<text class="connector-label" x="370" y="278" text-anchor="middle">on failure</text>
<polyline class="connector connector--warning connector--dashed" points="520,216 520,340" marker-end="url(#arrow-warning)" />
<polyline class="connector connector--warning connector--dashed" points="720,216 720,475 425,475 425,432" marker-end="url(#arrow-warning)" />
<polyline class="connector connector--warning connector--dashed" points="920,216 920,475 500,475 500,432" marker-end="url(#arrow-warning)" />
<polyline class="connector connector--warning connector--dashed" points="1120,426 1120,500 560,500 560,432" marker-end="url(#arrow-warning)" />
<g class="card card--muted">
<rect x="60" y="130" width="150" height="100" rx="6" />
<text class="card-title" x="78" y="160" text-anchor="start">
<tspan x="78" dy="0">Candidate</tspan>
<tspan x="78" dy="16">host</tspan>
</text>
<text class="card-body" x="78" y="194" text-anchor="start">
<tspan x="78" dy="0">selected by</tspan>
<tspan x="78" dy="13">inventory</tspan>
</text>
</g>
<g class="card card--gate">
<rect x="250" y="130" width="150" height="100" rx="6" />
<text class="card-title" x="268" y="160" text-anchor="start">
<tspan x="268" dy="0">Parse v3</tspan>
<tspan x="268" dy="16">marker</tspan>
</text>
<text class="card-body" x="268" y="194" text-anchor="start">
<tspan x="268" dy="0">version</tspan>
<tspan x="268" dy="13">locator</tspan>
<tspan x="268" dy="13">digest</tspan>
</text>
</g>
<g class="card card--proof">
<rect x="440" y="130" width="160" height="100" rx="6" />
<text class="card-title" x="458" y="160" text-anchor="start">
<tspan x="458" dy="0">Fetch</tspan>
<tspan x="458" dy="16">artifact</tspan>
</text>
<text class="card-body" x="458" y="194" text-anchor="start">
<tspan x="458" dy="0">KRA vault</tspan>
<tspan x="458" dy="13">latest index</tspan>
</text>
</g>
<g class="card card--gate">
<rect x="640" y="130" width="160" height="100" rx="6" />
<text class="card-title" x="658" y="160" text-anchor="start">
<tspan x="658" dy="0">Verify</tspan>
<tspan x="658" dy="16">signature</tspan>
</text>
<text class="card-body" x="658" y="194" text-anchor="start">
<tspan x="658" dy="0">chain</tspan>
<tspan x="658" dy="13">allowlist</tspan>
<tspan x="658" dy="13">expiry</tspan>
</text>
</g>
<g class="card card--gate">
<rect x="840" y="130" width="160" height="100" rx="6" />
<text class="card-title" x="858" y="160" text-anchor="start">
<tspan x="858" dy="0">Replay</tspan>
<tspan x="858" dy="16">guard</tspan>
</text>
<text class="card-body" x="858" y="194" text-anchor="start">
<tspan x="858" dy="0">latest</tspan>
<tspan x="858" dy="13">generation</tspan>
<tspan x="858" dy="13">revoked state</tspan>
</text>
</g>
<g class="card card--gate">
<rect x="1040" y="130" width="160" height="100" rx="6" />
<text class="card-title" x="1058" y="160" text-anchor="start">
<tspan x="1058" dy="0">Bind to</tspan>
<tspan x="1058" dy="16">request</tspan>
</text>
<text class="card-body" x="1058" y="194" text-anchor="start">
<tspan x="1058" dy="0">host</tspan>
<tspan x="1058" dy="13">profile set</tspan>
<tspan x="1058" dy="13">policy</tspan>
</text>
</g>
<g class="card card--proof">
<rect x="1040" y="340" width="160" height="100" rx="6" />
<text class="card-title" x="1058" y="370" text-anchor="start">
<tspan x="1058" dy="0">Probe live</tspan>
<tspan x="1058" dy="16">state</tspan>
</text>
<text class="card-body" x="1058" y="404" text-anchor="start">
<tspan x="1058" dy="0">policy hash</tspan>
<tspan x="1058" dy="13">host facts</tspan>
</text>
</g>
<g class="card card--success">
<rect x="840" y="340" width="160" height="86" rx="6" />
<text class="card-title" x="858" y="370" text-anchor="start">
<tspan x="858" dy="0">Allow</tspan>
<tspan x="858" dy="16">launch</tspan>
</text>
<text class="card-body" x="858" y="404" text-anchor="start">
<tspan x="858" dy="0">all checks</tspan>
<tspan x="858" dy="13">passed</tspan>
</text>
</g>
<g class="card card--warning">
<rect x="250" y="340" width="350" height="92" rx="6" />
<text class="card-title" x="268" y="370" text-anchor="start">
<tspan x="268" dy="0">Fail closed with a named state</tspan>
</text>
<text class="card-body" x="268" y="389" text-anchor="start">
<tspan x="268" dy="0">parse, artifact, signature, replay, binding,</tspan>
<tspan x="268" dy="13">drift, revocation, or infrastructure failure</tspan>
</text>
</g>
</svg>
