<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="day2-pipeline-engines Red Hat styled diagram" width="1480" height="680" viewBox="0 0 1480 680">
  <defs>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.14"/>
    </filter>
    <filter id="paper">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.025"/></feComponentTransfer>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 13 7 L 1 13 z" fill="#ee0000"/>
    </marker>
    <style>
      .canvas { fill: #f7f7f7; }
      .grain { filter: url(#paper); opacity: 0.65; }
      .lane rect { fill: #fafafa; stroke: #c7c7c7; stroke-width: 1.4; filter: url(#shadow); }
      .lane-title { fill: #151515; font: 700 22px "Red Hat Display", "Red Hat Text", Arial, sans-serif; text-anchor: middle; letter-spacing: 0; }
      .card { fill: #ffffff; stroke: #c7c7c7; stroke-width: 1.35; filter: url(#shadow); }
      .title { fill: #151515; font: 700 18px "Red Hat Display", "Red Hat Text", Arial, sans-serif; letter-spacing: 0; }
      .subtitle { fill: #151515; font: 400 14px "Red Hat Text", Arial, sans-serif; letter-spacing: 0; }
      .connector { fill: none; stroke: #ee0000; stroke-width: 2.45; stroke-linecap: round; stroke-linejoin: round; }
      .chip rect { fill: #f7f7f7; stroke: #ee0000; stroke-width: 1.1; }
      .chip text { fill: #be0000; font: 600 13px "Red Hat Text", Arial, sans-serif; text-anchor: middle; letter-spacing: 0; }
      .icon { fill: none; stroke: #ee0000; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect class="canvas" width="1480" height="680"/>
  <rect class="grain" width="1480" height="680"/>

  <g class="lane">
    <rect x="42" y="42" width="1396" height="590" rx="14"/>
    <text class="lane-title" x="740" y="82">Pipeline engines share one proof contract</text>
  </g>

  <g class="edges">
    <path class="connector" d="M 320 340 H 390" marker-end="url(#arrow)"/>
    <path class="connector" d="M 630 340 H 700" marker-end="url(#arrow)"/>
    <path class="connector" d="M 940 340 H 1010" marker-end="url(#arrow)"/>
    <path class="connector" d="M 1130 292 V 226 H 980 V 196" marker-end="url(#arrow)"/>
    <path class="connector" d="M 1110 148 H 1170" marker-end="url(#arrow)"/>
    <path class="connector" d="M 1130 388 V 500" marker-end="url(#arrow)"/>
    <g class="chip"><rect x="1136" y="226" width="54" height="28" rx="5"/><text x="1163" y="245.5">yes</text></g>
    <g class="chip"><rect x="1140" y="438" width="54" height="28" rx="5"/><text x="1167" y="457.5">no</text></g>
  </g>

  <g class="node">
    <rect class="card" x="80" y="292" width="240" height="96" rx="8"/>
    <g class="icon" transform="translate(104 321)"><circle cx="17" cy="17" r="16"/><path d="M 12 10 L 24 17 L 12 24 Z"/></g>
    <text class="title" x="164" y="329">Runner choice</text>
    <text class="subtitle" x="164" y="350">GitHub, GitLab,</text>
    <text class="subtitle" x="164" y="368">Tekton, AAP</text>
  </g>
  <g class="node">
    <rect class="card" x="390" y="292" width="240" height="96" rx="8"/>
    <g class="icon" transform="translate(414 321)"><rect x="0" y="4" width="34" height="26" rx="4"/><path d="M 8 13 H 26"/><path d="M 8 21 H 22"/></g>
    <text class="title" x="474" y="329">Common contract</text>
    <text class="subtitle" x="474" y="350">build, test, prove,</text>
    <text class="subtitle" x="474" y="368">promote</text>
  </g>
  <g class="node">
    <rect class="card" x="700" y="292" width="240" height="96" rx="8"/>
    <g class="icon" transform="translate(724 321)"><rect x="0" y="4" width="34" height="26" rx="4"/><path d="M 8 13 H 26"/><path d="M 8 21 H 22"/></g>
    <text class="title" x="784" y="329">Evidence bundle</text>
    <text class="subtitle" x="784" y="350">RPM + logs</text>
    <text class="subtitle" x="784" y="368">+ probes</text>
  </g>
  <g class="node">
    <rect class="card" x="1010" y="292" width="240" height="96" rx="8"/>
    <g class="icon" transform="translate(1034 321)"><rect x="0" y="0" width="34" height="34" rx="4"/><path d="M 8 10 H 26"/><path d="M 8 18 H 22"/><path d="M 8 26 H 26"/></g>
    <text class="title" x="1094" y="348">Promote?</text>
  </g>
  <g class="node">
    <rect class="card" x="850" y="100" width="260" height="96" rx="8"/>
    <g class="icon" transform="translate(874 129)"><rect x="0" y="4" width="34" height="26" rx="4"/><path d="M 8 13 H 26"/><path d="M 8 21 H 22"/></g>
    <text class="title" x="934" y="137">Content</text>
    <text class="title" x="934" y="158">repository</text>
    <text class="subtitle" x="934" y="176">signed policy RPM</text>
  </g>
  <g class="node">
    <rect class="card" x="1170" y="100" width="220" height="96" rx="8"/>
    <g class="icon" transform="translate(1194 129)"><path d="M 16 0 L 32 8 V 20 C 32 29 25 36 16 40 C 7 36 0 29 0 20 V 8 Z"/></g>
    <text class="title" x="1254" y="137">AAP</text>
    <text class="title" x="1254" y="158">preflight</text>
    <text class="subtitle" x="1254" y="176">verified hosts only</text>
  </g>
  <g class="node">
    <rect class="card" x="1010" y="500" width="240" height="96" rx="8"/>
    <g class="icon" transform="translate(1034 529)"><path d="M 4 26 C 6 18 12 14 17 14 C 22 14 28 18 30 26"/><circle cx="17" cy="8" r="7"/></g>
    <text class="title" x="1094" y="537">Return to branch</text>
    <text class="subtitle" x="1094" y="558">fix or split identity</text>
  </g>
</svg>
