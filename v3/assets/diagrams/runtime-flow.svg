<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Blastwall runtime Red Hat styled diagram" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.14"/>
    </filter>
    <filter id="paper">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.025"/></feComponentTransfer>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 13 7 L 1 13 z" fill="#ee0000"/>
    </marker>
    <style>
      .canvas { fill: #f7f7f7; }
      .grain { filter: url(#paper); opacity: 0.65; }
      .card { fill: #ffffff; stroke: #c7c7c7; stroke-width: 1.35; filter: url(#shadow); }
      .title { fill: #151515; font: 700 20px "Red Hat Display", "Red Hat Text", Arial, sans-serif; letter-spacing: 0; }
      .subtitle { fill: #151515; font: 400 15px "Red Hat Text", Arial, sans-serif; letter-spacing: 0; }
      .connector { fill: none; stroke: #ee0000; stroke-width: 2.45; stroke-linecap: round; stroke-linejoin: round; }
      .connector.dashed { stroke-dasharray: 8 8; }
      .edge-label-chip rect { fill: #f7f7f7; stroke: #ee0000; stroke-width: 1.1; }
      .edge-label-chip text { fill: #be0000; font: 600 13px "Red Hat Text", Arial, sans-serif; text-anchor: middle; letter-spacing: 0; }
    </style>
  </defs>
  <rect class="canvas" width="1600" height="900"/>
  <rect class="grain" width="1600" height="900"/>

  <g class="edges">
    <path class="connector" d="M 390 132 H 600" marker-end="url(#arrow)"/>
    <path class="connector dashed" d="M 600 174 H 390" marker-end="url(#arrow)"/>
    <path class="connector" d="M 230 190 V 360" marker-end="url(#arrow)"/>
    <path class="connector" d="M 450 410 H 620" marker-end="url(#arrow)"/>
    <path class="connector" d="M 810 460 V 620" marker-end="url(#arrow)"/>
    <path class="connector" d="M 450 442 H 1270 V 620" marker-end="url(#arrow)"/>
    <path class="connector dashed" d="M 1080 692 H 960" marker-end="url(#arrow)"/>
  </g>


    <g class="edge-label-chip">
      <rect x="408" y="78" width="220" height="46" rx="5"/>
      <text x="518" y="99">inventory, HBAC,</text><text x="518" y="116">SELinux map, sudo</text>
    </g>

    <g class="edge-label-chip">
      <rect x="418" y="190" width="220" height="46" rx="5"/>
      <text x="528" y="211">eligible hosts +</text><text x="528" y="228">confinement state</text>
    </g>

    <g class="edge-label-chip">
      <rect x="66" y="258" width="280" height="46" rx="5"/>
      <text x="206" y="279">SSH and sudo execute</text><text x="206" y="296">on selected hosts</text>
    </g>

    <g class="edge-label-chip">
      <rect x="472" y="304" width="220" height="46" rx="5"/>
      <text x="582" y="325">resolve SELinux</text><text x="582" y="342">user map</text>
    </g>

    <g class="edge-label-chip">
      <rect x="642" y="512" width="260" height="46" rx="5"/>
      <text x="772" y="533">launch session as</text><text x="772" y="550">blastwall_t</text>
    </g>

    <g class="edge-label-chip">
      <rect x="1058" y="500" width="270" height="46" rx="5"/>
      <text x="1193" y="521">kernel enforces</text><text x="1193" y="538">Blastwall deny policy</text>
    </g>

    <g class="edge-label-chip">
      <rect x="720" y="742" width="330" height="63" rx="5"/>
      <text x="885" y="763">denies alg_socket, bpf,</text><text x="885" y="780">packet_socket, userns,</text><text x="885" y="797">io_uring, xfrm, RxRPC</text>
    </g>


      <g class="node">
        <rect class="card" x="70" y="80" width="320" height="110" rx="8"/>
        <svg x="92" y="114" width="42" height="42" viewBox="0 0 32 32" fill="#ee0000" aria-hidden="true"><path d="M26 16c0 1.654 1.346 3 3 3a1 1 0 1 1 0 2c-2.757 0-5-2.243-5-5s2.243-5 5-5a1 1 0 1 1 0 2c-1.654 0-3 1.346-3 3Zm3 13c-1.02 0-2.025-.116-3-.348v-3.49a1 1 0 0 0-.6-.916 9.022 9.022 0 0 1-1.737-1.008 1.063 1.063 0 0 0-.316-.156 1 1 0 0 0-.788.093l-3.014 1.744a12.96 12.96 0 0 1-3.001-5.188l3.01-1.742a1 1 0 0 0 .509-.985C20.024 16.674 20 16.34 20 16s.023-.675.06-1.005a1.01 1.01 0 0 0-.5-.98l-3.016-1.746a12.96 12.96 0 0 1 3-5.188l3.015 1.744a1.027 1.027 0 0 0 1.109-.061 9.043 9.043 0 0 1 1.735-1.004c.363-.16.597-.524.597-.92V3.348C26.975 3.116 27.98 3 29 3a1 1 0 1 0 0-2c-1.465 0-2.907.209-4.287.622A1 1 0 0 0 24 2.58v3.634a10.92 10.92 0 0 0-.981.567L19.88 4.965a.998.998 0 0 0-1.19.14 14.986 14.986 0 0 0-4.284 7.414 1 1 0 0 0 .472 1.096l3.138 1.817a9.57 9.57 0 0 0 .001 1.137l-3.14 1.816a1 1 0 0 0-.47 1.096 14.986 14.986 0 0 0 4.283 7.414 1 1 0 0 0 1.19.14l3.134-1.813c.32.208.65.4.985.571v3.627a1 1 0 0 0 .713.958c1.38.413 2.822.622 4.287.622a1 1 0 1 0 0-2ZM10.164 1.675a.998.998 0 0 0-1.27-.62l-5.35 1.841a1 1 0 1 0 .651 1.891l3.018-1.039A24.908 24.908 0 0 0 4 16c0 4.825 1.377 9.508 3.982 13.542a.998.998 0 0 0 1.382.298.998.998 0 0 0 .298-1.382A22.918 22.918 0 0 1 6 16c0-4.036 1.057-7.957 3.047-11.426l1.067 3.1a1 1 0 1 0 1.89-.65l-1.84-5.35Z"/></svg>
        <text class="title" x="156" y="134.5">AAP</text>
        <text class="subtitle" x="156" y="155.5">preflight and launch control</text>
      </g>

      <g class="node">
        <rect class="card" x="600" y="80" width="360" height="110" rx="8"/>
        <svg x="622" y="114" width="42" height="42" viewBox="0 0 32 32" fill="#ee0000" aria-hidden="true"><path d="M16 1C8.149 1 2 4.514 2 9v14c0 4.486 6.149 8 14 8s14-3.514 14-8V9c0-4.486-6.149-8-14-8Zm0 2c6.505 0 12 2.748 12 6s-5.495 6-12 6S4 12.252 4 9s5.495-6 12-6ZM4 13.161C6.427 15.476 10.839 17 16 17s9.573-1.524 12-3.839V16c0 3.252-5.495 6-12 6S4 19.252 4 16v-2.839ZM16 29c-6.505 0-12-2.748-12-6v-2.839C6.427 22.476 10.839 24 16 24s9.573-1.524 12-3.839V23c0 3.252-5.495 6-12 6Z"/></svg>
        <text class="title" x="686" y="134.5">IdM / FreeIPA</text>
        <text class="subtitle" x="686" y="155.5">identity and policy records</text>
      </g>

      <g class="node">
        <rect class="card" x="70" y="360" width="380" height="100" rx="8"/>
        <svg x="92" y="389" width="42" height="42" viewBox="0 0 32 32" fill="#ee0000" aria-hidden="true"><path d="M29.5 9h-27C1.673 9 1 9.673 1 10.5v11c0 .827.673 1.5 1.5 1.5h27c.827 0 1.5-.673 1.5-1.5v-11c0-.827-.673-1.5-1.5-1.5ZM29 21H3V11h26v10ZM7 16a1 1 0 0 1 1-1h5a1 1 0 0 1 0 2H8a1 1 0 0 1-1-1Zm14.38.015a1.626 1.626 0 1 1 3.251.001 1.626 1.626 0 0 1-3.251-.001Z"/></svg>
        <text class="title" x="156" y="409.5">Managed RHEL host</text>
        <text class="subtitle" x="156" y="430.5">selected by inventory state</text>
      </g>

      <g class="node">
        <rect class="card" x="620" y="360" width="380" height="100" rx="8"/>
        <svg x="642" y="389" width="42" height="42" viewBox="0 0 32 32" fill="#ee0000" aria-hidden="true"><path d="M16 31C8.832 31 3 25.168 3 18V4.56a1 1 0 0 1 .792-.978l12-2.56a1.01 1.01 0 0 1 .417 0l12 2.56c.461.099.792.506.792.978V18c0 7.168-5.832 13-13 13ZM5 5.369V18c0 6.065 4.935 11 11 11s11-4.935 11-11V5.369L16 3.022 5 5.369Z"/></svg>
        <text class="title" x="706" y="409.5">SSSD + pam_selinux</text>
        <text class="subtitle" x="706" y="430.5">applies mapped login label</text>
      </g>

      <g class="node">
        <rect class="card" x="1080" y="620" width="380" height="110" rx="8"/>
        <svg x="1102" y="654" width="42" height="42" viewBox="0 0 32 32" fill="#ee0000" aria-hidden="true"><path d="M16 31C8.832 31 3 25.168 3 18V4.56a1 1 0 0 1 .792-.978l12-2.56a1.01 1.01 0 0 1 .417 0l12 2.56c.461.099.792.506.792.978V18c0 7.168-5.832 13-13 13ZM5 5.369V18c0 6.065 4.935 11 11 11s11-4.935 11-11V5.369L16 3.022 5 5.369Z"/></svg>
        <text class="title" x="1166" y="674.5">SELinux kernel policy</text>
        <text class="subtitle" x="1166" y="695.5">trusted enforcement boundary</text>
      </g>

      <g class="node">
        <rect class="card" x="540" y="620" width="420" height="110" rx="8"/>
        <svg x="562" y="654" width="42" height="42" viewBox="0 0 32 32" fill="#ee0000" aria-hidden="true"><path d="M26 16c0 1.654 1.346 3 3 3a1 1 0 1 1 0 2c-2.757 0-5-2.243-5-5s2.243-5 5-5a1 1 0 1 1 0 2c-1.654 0-3 1.346-3 3Zm3 13c-1.02 0-2.025-.116-3-.348v-3.49a1 1 0 0 0-.6-.916 9.022 9.022 0 0 1-1.737-1.008 1.063 1.063 0 0 0-.316-.156 1 1 0 0 0-.788.093l-3.014 1.744a12.96 12.96 0 0 1-3.001-5.188l3.01-1.742a1 1 0 0 0 .509-.985C20.024 16.674 20 16.34 20 16s.023-.675.06-1.005a1.01 1.01 0 0 0-.5-.98l-3.016-1.746a12.96 12.96 0 0 1 3-5.188l3.015 1.744a1.027 1.027 0 0 0 1.109-.061 9.043 9.043 0 0 1 1.735-1.004c.363-.16.597-.524.597-.92V3.348C26.975 3.116 27.98 3 29 3a1 1 0 1 0 0-2c-1.465 0-2.907.209-4.287.622A1 1 0 0 0 24 2.58v3.634a10.92 10.92 0 0 0-.981.567L19.88 4.965a.998.998 0 0 0-1.19.14 14.986 14.986 0 0 0-4.284 7.414 1 1 0 0 0 .472 1.096l3.138 1.817a9.57 9.57 0 0 0 .001 1.137l-3.14 1.816a1 1 0 0 0-.47 1.096 14.986 14.986 0 0 0 4.283 7.414 1 1 0 0 0 1.19.14l3.134-1.813c.32.208.65.4.985.571v3.627a1 1 0 0 0 .713.958c1.38.413 2.822.622 4.287.622a1 1 0 1 0 0-2ZM10.164 1.675a.998.998 0 0 0-1.27-.62l-5.35 1.841a1 1 0 1 0 .651 1.891l3.018-1.039A24.908 24.908 0 0 0 4 16c0 4.825 1.377 9.508 3.982 13.542a.998.998 0 0 0 1.382.298.998.998 0 0 0 .298-1.382A22.918 22.918 0 0 1 6 16c0-4.036 1.057-7.957 3.047-11.426l1.067 3.1a1 1 0 1 0 1.89-.65l-1.84-5.35Z"/></svg>
        <text class="title" x="626" y="674.5">Confined automation session</text>
        <text class="subtitle" x="626" y="695.5">blastwall_u:blastwall_r:blastwall_t</text>
      </g>
</svg>
