<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="v3-operating-loop-title v3-operating-loop-desc">
<title id="v3-operating-loop-title">Signed Evidence Operating Loop</title>
<desc id="v3-operating-loop-desc">The demonstration path treats capture, signing, publication, launch, and audit as one repeatable loop.</desc>
<defs>
<marker id="arrow-default" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ee0000" /></marker>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4d4d4d" /></marker>
<marker id="arrow-success" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3d7317" /></marker>
<marker id="arrow-warning" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f0ab00" /></marker>
</defs>
<style>
svg { background: #ffffff; font-family: 'Red Hat Text', 'Helvetica Neue', Arial, sans-serif; }
.diagram-title { fill: #151515; font: 700 26px 'Red Hat Display', 'Red Hat Text', Arial, sans-serif; }
.diagram-subtitle { fill: #4d4d4d; font: 400 15px 'Red Hat Text', Arial, sans-serif; }
.lane rect { fill: #f5f5f5; stroke: #e0e0e0; stroke-width: 1.5; }
.lane--red rect { fill: #fff5f5; stroke: #f4b7b7; }
.lane--blue rect { fill: #f1f7ff; stroke: #b8d8ff; }
.lane-title { fill: #a30000; font: 700 16px 'Red Hat Display', 'Red Hat Text', Arial, sans-serif; }
.card rect { fill: #ffffff; stroke: #e0e0e0; stroke-width: 1.5; }
.card--gate rect { stroke: #ee0000; stroke-width: 2.2; }
.card--proof rect { stroke: #0066cc; stroke-width: 2; }
.card--success rect { stroke: #3d7317; stroke-width: 2; }
.card--warning rect { stroke: #f0ab00; stroke-width: 2; }
.card--muted rect { fill: #f5f5f5; stroke: #c7c7c7; }
.card-title { fill: #151515; font: 700 17px 'Red Hat Display', 'Red Hat Text', Arial, sans-serif; }
.card-body { fill: #4d4d4d; font: 400 13.5px 'Red Hat Text', Arial, sans-serif; }
.connector { fill: none; stroke: #ee0000; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.connector--muted { stroke: #4d4d4d; }
.connector--success { stroke: #3d7317; }
.connector--warning { stroke: #f0ab00; }
.connector--dashed { stroke-dasharray: 7 7; }
.connector-label { fill: #4d4d4d; font: 700 12px 'Red Hat Text', Arial, sans-serif; }
.standalone-label { fill: #151515; font: 700 15px 'Red Hat Text', Arial, sans-serif; }
.standalone-label--muted { fill: #4d4d4d; font-weight: 500; }
.standalone-label--red { fill: #a30000; }
</style>
<text class="diagram-title" x="32" y="42">Signed Evidence Operating Loop</text>
<text class="diagram-subtitle" x="32" y="68">The demonstration path treats capture, signing, publication, launch, and audit as one repeatable loop.</text>
<polyline class="connector connector--default" points="230,187 275,187" marker-end="url(#arrow-default)" />
<polyline class="connector connector--default" points="425,187 470,187" marker-end="url(#arrow-default)" />
<polyline class="connector connector--default" points="620,187 665,187" marker-end="url(#arrow-default)" />
<polyline class="connector connector--default" points="815,187 860,187" marker-end="url(#arrow-default)" />
<polyline class="connector connector--default" points="1010,187 1055,187" marker-end="url(#arrow-default)" />
<polyline class="connector connector--success" points="1130,229 1130,345" marker-end="url(#arrow-success)" />
<polyline class="connector connector--muted" points="1055,387 830,387" marker-end="url(#arrow-muted)" />
<polyline class="connector connector--warning" points="660,387 440,387" marker-end="url(#arrow-warning)" />
<polyline class="connector connector--warning" points="250,387 155,387 155,229" marker-end="url(#arrow-warning)" />
<g class="card card--muted">
<rect x="80" y="145" width="150" height="84" rx="6" />
<text class="card-title" x="98" y="175" text-anchor="start">
<tspan x="98" dy="0">Capture</tspan>
<tspan x="98" dy="16">host state</tspan>
</text>
<text class="card-body" x="98" y="209" text-anchor="start">
<tspan x="98" dy="0">policy hash</tspan>
<tspan x="98" dy="13">profile facts</tspan>
</text>
</g>
<g class="card card--proof">
<rect x="275" y="145" width="150" height="84" rx="6" />
<text class="card-title" x="293" y="175" text-anchor="start">
<tspan x="293" dy="0">Sign</tspan>
<tspan x="293" dy="16">evidence</tspan>
</text>
<text class="card-body" x="293" y="209" text-anchor="start">
<tspan x="293" dy="0">service key</tspan>
<tspan x="293" dy="13">allowed signer</tspan>
</text>
</g>
<g class="card card--proof">
<rect x="470" y="145" width="150" height="84" rx="6" />
<text class="card-title" x="488" y="175" text-anchor="start">
<tspan x="488" dy="0">Store</tspan>
<tspan x="488" dy="16">artifact</tspan>
</text>
<text class="card-body" x="488" y="209" text-anchor="start">
<tspan x="488" dy="0">KRA vault</tspan>
<tspan x="488" dy="13">latest index</tspan>
</text>
</g>
<g class="card card--muted">
<rect x="665" y="145" width="150" height="84" rx="6" />
<text class="card-title" x="683" y="175" text-anchor="start">
<tspan x="683" dy="0">Publish</tspan>
<tspan x="683" dy="16">marker</tspan>
</text>
<text class="card-body" x="683" y="209" text-anchor="start">
<tspan x="683" dy="0">locator</tspan>
<tspan x="683" dy="13">digest binding</tspan>
</text>
</g>
<g class="card card--muted">
<rect x="860" y="145" width="150" height="84" rx="6" />
<text class="card-title" x="878" y="175" text-anchor="start">
<tspan x="878" dy="0">Select</tspan>
<tspan x="878" dy="16">candidate</tspan>
</text>
<text class="card-body" x="878" y="209" text-anchor="start">
<tspan x="878" dy="0">inventory</tspan>
<tspan x="878" dy="13">profile match</tspan>
</text>
</g>
<g class="card card--gate">
<rect x="1055" y="145" width="150" height="84" rx="6" />
<text class="card-title" x="1073" y="175" text-anchor="start">
<tspan x="1073" dy="0">Verify</tspan>
<tspan x="1073" dy="16">preflight</tspan>
</text>
<text class="card-body" x="1073" y="209" text-anchor="start">
<tspan x="1073" dy="0">signed proof</tspan>
<tspan x="1073" dy="13">live state</tspan>
</text>
</g>
<g class="card card--success">
<rect x="1055" y="345" width="150" height="84" rx="6" />
<text class="card-title" x="1073" y="375" text-anchor="start">
<tspan x="1073" dy="0">Launch</tspan>
<tspan x="1073" dy="16">runtime</tspan>
</text>
<text class="card-body" x="1073" y="409" text-anchor="start">
<tspan x="1073" dy="0">confined</tspan>
<tspan x="1073" dy="13">auditable</tspan>
</text>
</g>
<g class="card card--proof">
<rect x="660" y="345" width="170" height="84" rx="6" />
<text class="card-title" x="678" y="375" text-anchor="start">
<tspan x="678" dy="0">Scheduled</tspan>
<tspan x="678" dy="16">audit</tspan>
</text>
<text class="card-body" x="678" y="409" text-anchor="start">
<tspan x="678" dy="0">KRA health</tspan>
<tspan x="678" dy="13">inventory drift</tspan>
</text>
</g>
<g class="card card--warning">
<rect x="250" y="345" width="190" height="84" rx="6" />
<text class="card-title" x="268" y="375" text-anchor="start">
<tspan x="268" dy="0">Recapture</tspan>
<tspan x="268" dy="16">when needed</tspan>
</text>
<text class="card-body" x="268" y="409" text-anchor="start">
<tspan x="268" dy="0">contract or</tspan>
<tspan x="268" dy="13">evidence change</tspan>
</text>
</g>
</svg>
