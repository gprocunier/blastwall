<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="540" viewBox="0 0 1280 540" role="img" aria-labelledby="v3-custody-boundary-title v3-custody-boundary-desc">
<title id="v3-custody-boundary-title">Stable-v3 Custody Boundary</title>
<desc id="v3-custody-boundary-desc">Production-shaped examples use service-owned signer and vault principals; shared custody stays explicit lab/RC evidence.</desc>
<defs>
<marker id="arrow-default" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ee0000" /></marker>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4d4d4d" /></marker>
<marker id="arrow-success" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3d7317" /></marker>
<marker id="arrow-warning" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f0ab00" /></marker>
</defs>
<style>
svg { background: #ffffff; font-family: 'Red Hat Text', 'Helvetica Neue', Arial, sans-serif; }
.diagram-title { fill: #151515; font: 700 26px 'Red Hat Display', 'Red Hat Text', Arial, sans-serif; }
.diagram-subtitle { fill: #4d4d4d; font: 400 15px 'Red Hat Text', Arial, sans-serif; }
.lane rect { fill: #f5f5f5; stroke: #e0e0e0; stroke-width: 1.5; }
.lane--red rect { fill: #fff5f5; stroke: #f4b7b7; }
.lane--blue rect { fill: #f1f7ff; stroke: #b8d8ff; }
.lane-title { fill: #a30000; font: 700 16px 'Red Hat Display', 'Red Hat Text', Arial, sans-serif; }
.card rect { fill: #ffffff; stroke: #e0e0e0; stroke-width: 1.5; }
.card--gate rect { stroke: #ee0000; stroke-width: 2.2; }
.card--proof rect { stroke: #0066cc; stroke-width: 2; }
.card--success rect { stroke: #3d7317; stroke-width: 2; }
.card--warning rect { stroke: #f0ab00; stroke-width: 2; }
.card--muted rect { fill: #f5f5f5; stroke: #c7c7c7; }
.card-title { fill: #151515; font: 700 17px 'Red Hat Display', 'Red Hat Text', Arial, sans-serif; }
.card-body { fill: #4d4d4d; font: 400 13.5px 'Red Hat Text', Arial, sans-serif; }
.connector { fill: none; stroke: #ee0000; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.connector--muted { stroke: #4d4d4d; }
.connector--success { stroke: #3d7317; }
.connector--warning { stroke: #f0ab00; }
.connector--dashed { stroke-dasharray: 7 7; }
.connector-label { fill: #4d4d4d; font: 700 12px 'Red Hat Text', Arial, sans-serif; }
.standalone-label { fill: #151515; font: 700 15px 'Red Hat Text', Arial, sans-serif; }
.standalone-label--muted { fill: #4d4d4d; font-weight: 500; }
.standalone-label--red { fill: #a30000; }
</style>
<text class="diagram-title" x="32" y="42">Stable-v3 Custody Boundary</text>
<text class="diagram-subtitle" x="32" y="68">Production-shaped examples use service-owned signer and vault principals; shared custody stays explicit lab/RC evidence.</text>
<g class="lane lane--red">
<rect x="34" y="95" width="1208" height="170" rx="8" />
<text class="lane-title" x="52" y="123" text-anchor="start">
<tspan x="52" dy="0">Stable-v3 operating custody</tspan>
</text>
</g>
<g class="lane lane--blue">
<rect x="34" y="305" width="1208" height="155" rx="8" />
<text class="lane-title" x="52" y="333" text-anchor="start">
<tspan x="52" dy="0">Lab / RC transition custody</tspan>
</text>
</g>
<polyline class="connector connector--default" points="242,190 300,190" marker-end="url(#arrow-default)" />
<polyline class="connector connector--default" points="480,190 538,190" marker-end="url(#arrow-default)" />
<polyline class="connector connector--default" points="728,190 786,190" marker-end="url(#arrow-default)" />
<polyline class="connector connector--success" points="971,190 1028,190" marker-end="url(#arrow-success)" />
<polyline class="connector connector--warning" points="325,388 390,388" marker-end="url(#arrow-warning)" />
<polyline class="connector connector--warning" points="620,388 685,388" marker-end="url(#arrow-warning)" />
<g class="card card--proof">
<rect x="72" y="145" width="170" height="100" rx="6" />
<text class="card-title" x="90" y="175" text-anchor="start">
<tspan x="90" dy="0">Signer owner</tspan>
</text>
<text class="card-body" x="90" y="194" text-anchor="start">
<tspan x="90" dy="0">named service</tspan>
<tspan x="90" dy="13">rotation path</tspan>
</text>
</g>
<g class="card card--proof">
<rect x="300" y="145" width="180" height="100" rx="6" />
<text class="card-title" x="318" y="175" text-anchor="start">
<tspan x="318" dy="0">Service vault</tspan>
<tspan x="318" dy="16">principal</tspan>
</text>
<text class="card-body" x="318" y="209" text-anchor="start">
<tspan x="318" dy="0">artifact write</tspan>
<tspan x="318" dy="13">latest index</tspan>
</text>
</g>
<g class="card card--gate">
<rect x="538" y="145" width="190" height="100" rx="6" />
<text class="card-title" x="556" y="175" text-anchor="start">
<tspan x="556" dy="0">Verifier</tspan>
<tspan x="556" dy="16">principal</tspan>
</text>
<text class="card-body" x="556" y="209" text-anchor="start">
<tspan x="556" dy="0">read-only fetch</tspan>
<tspan x="556" dy="13">allowlist checks</tspan>
</text>
</g>
<g class="card card--proof">
<rect x="786" y="145" width="185" height="100" rx="6" />
<text class="card-title" x="804" y="175" text-anchor="start">
<tspan x="804" dy="0">KRA health</tspan>
<tspan x="804" dy="16">owner</tspan>
</text>
<text class="card-body" x="804" y="209" text-anchor="start">
<tspan x="804" dy="0">replica choice</tspan>
<tspan x="804" dy="13">canary checks</tspan>
</text>
</g>
<g class="card card--success">
<rect x="1028" y="145" width="165" height="100" rx="6" />
<text class="card-title" x="1046" y="175" text-anchor="start">
<tspan x="1046" dy="0">Decision</tspan>
<tspan x="1046" dy="16">record</tspan>
</text>
<text class="card-body" x="1046" y="209" text-anchor="start">
<tspan x="1046" dy="0">owners</tspan>
<tspan x="1046" dy="13">timeouts</tspan>
<tspan x="1046" dy="13">evidence</tspan>
</text>
</g>
<g class="card card--warning">
<rect x="105" y="350" width="220" height="76" rx="6" />
<text class="card-title" x="123" y="380" text-anchor="start">
<tspan x="123" dy="0">Shared vault scope</tspan>
</text>
<text class="card-body" x="123" y="399" text-anchor="start">
<tspan x="123" dy="0">permitted only when mode says lab/RC</tspan>
</text>
</g>
<g class="card card--warning">
<rect x="390" y="350" width="230" height="76" rx="6" />
<text class="card-title" x="408" y="380" text-anchor="start">
<tspan x="408" dy="0">Transition workflow</tspan>
</text>
<text class="card-body" x="408" y="399" text-anchor="start">
<tspan x="408" dy="0">labels custody as RC evidence</tspan>
</text>
</g>
<g class="card card--gate">
<rect x="685" y="350" width="230" height="76" rx="6" />
<text class="card-title" x="703" y="380" text-anchor="start">
<tspan x="703" dy="0">Stable-v3 verifier</tspan>
</text>
<text class="card-body" x="703" y="399" text-anchor="start">
<tspan x="703" dy="0">rejects shared vault scope</tspan>
</text>
</g>
</svg>
