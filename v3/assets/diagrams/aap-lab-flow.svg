<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AAP lab flow Red Hat styled diagram" width="1280" height="410" viewBox="0 0 1280 410">
  <defs>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.14"/></filter>
    <filter id="paper"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 0.025"/></feComponentTransfer></filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 13 7 L 1 13 z" fill="#ee0000"/></marker>
    <style>.canvas{fill:#f7f7f7}.grain{filter:url(#paper);opacity:.65}.lane rect{fill:#fafafa;stroke:#c7c7c7;stroke-width:1.4;filter:url(#shadow)}.lane-title{fill:#151515;font:700 22px "Red Hat Display","Red Hat Text",Arial,sans-serif;text-anchor:middle}.card{fill:#fff;stroke:#c7c7c7;stroke-width:1.35;filter:url(#shadow)}.title{fill:#151515;font:700 17px "Red Hat Display","Red Hat Text",Arial,sans-serif}.subtitle{fill:#151515;font:400 13px "Red Hat Text",Arial,sans-serif}.connector{fill:none;stroke:#ee0000;stroke-width:2.45;stroke-linecap:round;stroke-linejoin:round}.connector.dashed{stroke-dasharray:8 8}.chip rect{fill:#f7f7f7;stroke:#ee0000;stroke-width:1.1}.chip text{fill:#be0000;font:600 12.4px "Red Hat Text",Arial,sans-serif;text-anchor:middle}.icon{fill:none;stroke:#ee0000;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}</style>
  </defs>
  <rect class="canvas" width="1280" height="410"/><rect class="grain" width="1280" height="410"/>
  <g class="lane"><rect x="42" y="54" width="1196" height="262" rx="14"/><text class="lane-title" x="640" y="92">AAP lab replay flow</text></g>
  <g class="edges"><path class="connector" d="M 268 180 H 340" marker-end="url(#arrow)"/><path class="connector" d="M 536 180 H 608" marker-end="url(#arrow)"/><path class="connector" d="M 804 180 H 876" marker-end="url(#arrow)"/><path class="connector" d="M 1072 180 H 1120 V 238" marker-end="url(#arrow)"/><path class="connector dashed" d="M 1120 300 V 344 H 170 V 230" marker-end="url(#arrow)"/></g>
  <g class="node"><rect class="card" x="72" y="130" width="196" height="100" rx="8"/><g class="icon" transform="translate(94 158)"><path d="M 16 0 L 32 8 V 20 C 32 29 25 36 16 40 C 7 36 0 29 0 20 V 8 Z"/></g><text class="title" x="150" y="165">Prepare lab</text><text class="subtitle" x="150" y="187">EE, Controller,</text><text class="subtitle" x="150" y="205">fixture host</text></g>
  <g class="node"><rect class="card" x="340" y="130" width="196" height="100" rx="8"/><g class="icon" transform="translate(362 158)"><rect x="0" y="0" width="34" height="34" rx="4"/><path d="M 8 12 H 26"/><path d="M 8 22 H 20"/></g><text class="title" x="418" y="165">Show AAP</text><text class="title" x="418" y="186">surface</text><text class="subtitle" x="418" y="207">awx object reads</text></g>
  <g class="node"><rect class="card" x="608" y="130" width="196" height="100" rx="8"/><g class="icon" transform="translate(630 158)"><circle cx="17" cy="17" r="16"/><path d="M 12 10 L 24 17 L 12 24 Z"/></g><text class="title" x="686" y="165">Launch and</text><text class="title" x="686" y="186">monitor</text><text class="subtitle" x="686" y="207">workflow id</text></g>
  <g class="node"><rect class="card" x="876" y="130" width="196" height="100" rx="8"/><g class="icon" transform="translate(898 158)"><path d="M 4 18 L 12 26 L 30 8"/><circle cx="17" cy="17" r="16"/></g><text class="title" x="954" y="165">Read job</text><text class="title" x="954" y="186">stdout</text><text class="subtitle" x="954" y="207">credential</text><text class="subtitle" x="954" y="223">preflight + verify</text></g>
  <g class="node"><rect class="card" x="1026" y="238" width="188" height="62" rx="8"/><g class="icon" transform="translate(1046 250)"><circle cx="17" cy="17" r="16"/><path d="M 8 17 L 14 23 L 26 11"/></g><text class="title" x="1100" y="264">Expected</text><text class="subtitle" x="1100" y="280">selected + stale</text><text class="subtitle" x="1100" y="296">hosts</text></g>
  <g class="chip"><rect x="1045" y="328" width="150" height="28" rx="5"/><text x="1120" y="347.5">reset only when needed</text></g>
</svg>
