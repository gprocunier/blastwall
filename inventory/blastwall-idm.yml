---
plugin: eigenstate.ipa.idm
server: idm.example.com
ipaadmin_principal: svc-ansible-runner

sources:
  - hosts
  - hbacrules

hbacrule_filter:
  - blastwall-ssh

host_filter_from_groups: true

hostvars_include:
  - idm_fqdn
  - idm_description
  - idm_os
  - idm_hostgroups

compose:
  ansible_host: idm_fqdn

groups:
  blastwall_policy_current: >-
    idm_description is defined and
    'blastwall_policy_rpm=blastwall-selinux-0.5.2-1' in idm_description and
    'blastwall_policy_state=active' in idm_description and
    'blastwall_policy_alg_socket=denied' in idm_description and
    'blastwall_policy_bpf=denied' in idm_description and
    'blastwall_policy_selfprotect=denied' in idm_description and
    'blastwall_policy_packet_socket=denied' in idm_description and
    'blastwall_policy_userns=denied' in idm_description and
    'blastwall_policy_io_uring=denied' in idm_description and
    'blastwall_policy_xfrm=denied' in idm_description and
    'blastwall_policy_rxrpc=denied' in idm_description
  blastwall_policy_stale: >-
    idm_description is not defined or
    'blastwall_policy_rpm=blastwall-selinux-0.5.2-1' not in idm_description or
    'blastwall_policy_state=active' not in idm_description or
    'blastwall_policy_alg_socket=denied' not in idm_description or
    'blastwall_policy_bpf=denied' not in idm_description or
    'blastwall_policy_selfprotect=denied' not in idm_description or
    'blastwall_policy_packet_socket=denied' not in idm_description or
    'blastwall_policy_userns=denied' not in idm_description or
    'blastwall_policy_io_uring=denied' not in idm_description or
    'blastwall_policy_xfrm=denied' not in idm_description or
    'blastwall_policy_rxrpc=denied' not in idm_description
  blastwall_policy_candidate: >-
    idm_description is not defined or
    'blastwall_policy_rpm=blastwall-selinux-0.5.2-1' not in idm_description or
    'blastwall_policy_state=active' not in idm_description or
    'blastwall_policy_alg_socket=denied' not in idm_description or
    'blastwall_policy_bpf=denied' not in idm_description or
    'blastwall_policy_selfprotect=denied' not in idm_description or
    'blastwall_policy_packet_socket=denied' not in idm_description or
    'blastwall_policy_userns=denied' not in idm_description or
    'blastwall_policy_io_uring=denied' not in idm_description or
    'blastwall_policy_xfrm=denied' not in idm_description or
    'blastwall_policy_rxrpc=denied' not in idm_description
