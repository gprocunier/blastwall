---
- name: Configure AAP Controller for Blastwall in Calabi
  hosts: localhost
  connection: local
  become: false
  gather_facts: true
  vars_files:
    - ../group_vars/all.yml
    - vars/calabi-aap.yml
  tasks:
    - name: Read AAP Controller admin password from OpenShift
      ansible.builtin.shell: |
        set -euo pipefail
        "{{ calabi_oc_bin }}" get secret -n "{{ calabi_aap_namespace }}" \
          "{{ calabi_aap_controller_secret }}" \
          -o jsonpath='{.data.password}' | base64 -d
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ calabi_kubeconfig }}"
      register: calabi_aap_controller_password
      changed_when: false
      no_log: true

    - name: Read Calabi lab runtime password from OpenShift
      ansible.builtin.shell: |
        set -euo pipefail
        "{{ calabi_oc_bin }}" get secret -n "{{ calabi_aap_namespace }}" \
          "{{ calabi_aap_gateway_secret }}" \
          -o jsonpath='{.data.password}' | base64 -d
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ calabi_kubeconfig }}"
      register: calabi_aap_runtime_password
      changed_when: false
      no_log: true

    - name: Apply Blastwall Controller configuration
      ansible.builtin.command:
        argv:
          - /usr/bin/env
          - "HOME={{ calabi_operator_home }}"
          - "PATH={{ calabi_operator_path }}"
          - "ANSIBLE_COLLECTIONS_PATH={{ calabi_ansible_collections_path }}"
          - "{{ calabi_ansible_playbook_bin }}"
          - aap/configure-controller.yml
      args:
        chdir: "{{ calabi_blastwall_root }}"
      environment:
        HOME: "{{ calabi_operator_home }}"
        PATH: "{{ calabi_operator_path }}"
        ANSIBLE_COLLECTIONS_PATH: "{{ calabi_ansible_collections_path }}"
        CONTROLLER_HOST: "{{ calabi_aap_controller_url }}"
        CONTROLLER_USERNAME: admin
        CONTROLLER_PASSWORD: "{{ calabi_aap_controller_password.stdout }}"
        CONTROLLER_VERIFY_SSL: "false"
        IPA_SERVER: idm-01.workshop.lan
        IPA_PRINCIPAL: svc-ansible-runner
        IPA_PASSWORD: >-
          {{ lookup('env', 'BLASTWALL_AUTO_PASSWORD') |
          default(calabi_aap_runtime_password.stdout, true) }}
        IPA_CERT: /etc/ipa/ca.crt
        KRB5_CONFIG: /etc/krb5.conf
        BLASTWALL_IDENTITY: svc-ansible-runner
        BLASTWALL_MACHINE_PASSWORD: >-
          {{ lookup('env', 'BLASTWALL_AUTO_PASSWORD') |
          default(calabi_aap_runtime_password.stdout, true) }}
        BLASTWALL_EE_IMAGE: "{{ calabi_registry_image }}:{{ calabi_blastwall_ee_version }}"
        BLASTWALL_INVENTORY_SOURCE_PATH: poc-calabi/aap/inventory/blastwall-idm.yml
        BLASTWALL_AAP_VERIFY_TARGET_GROUP: >-
          {{ lookup('env', 'BLASTWALL_AAP_VERIFY_TARGET_GROUP') |
          default('blastwall_profile_base', true) }}
        BLASTWALL_PROJECT_URL: >-
          {{ lookup('env', 'BLASTWALL_PROJECT_URL') |
          default('https://github.com/gprocunier/blastwall.git', true) }}
        BLASTWALL_PROJECT_BRANCH: >-
          {{ lookup('env', 'BLASTWALL_PROJECT_BRANCH') |
          default('blastwall-v2-phase-08-rc1k', true) }}
        BLASTWALL_POLICY_PIPELINE_CANDIDATE_GROUP: >-
          {{ lookup('env', 'BLASTWALL_POLICY_PIPELINE_CANDIDATE_GROUP') |
          default('blastwall_policy_candidate', true) }}
        BLASTWALL_POST_PROMOTION_PREFLIGHT_TARGET_GROUP: >-
          {{ lookup('env', 'BLASTWALL_POST_PROMOTION_PREFLIGHT_TARGET_GROUP') |
          default('', true) }}
        BLASTWALL_REQUIRED_POLICY_PROFILES: >-
          {{ lookup('env', 'BLASTWALL_REQUIRED_POLICY_PROFILES') | default('', true) }}
        BLASTWALL_ALLOW_DRY_RUN_PROFILES: >-
          {{ lookup('env', 'BLASTWALL_ALLOW_DRY_RUN_PROFILES') | default('false', true) }}
        BLASTWALL_STRANGE_SOCKET_V1_DRY_RUN: >-
          {{ lookup('env', 'BLASTWALL_STRANGE_SOCKET_V1_DRY_RUN') | default('', true) }}
        BLASTWALL_AAP_ATTESTATION_ENABLED: >-
          {{ lookup('env', 'BLASTWALL_AAP_ATTESTATION_ENABLED') | default('false', true) }}
        BLASTWALL_ATTESTATION_MODE: >-
          {{ lookup('env', 'BLASTWALL_ATTESTATION_MODE') | default('reference-v2', true) }}
        BLASTWALL_ATTESTATION_SIGNER_KEY_FILE: >-
          {{ lookup('env', 'BLASTWALL_ATTESTATION_SIGNER_KEY_FILE') | default('', true) }}
        BLASTWALL_ATTESTATION_SIGNER_CERTIFICATE_FILE: >-
          {{ lookup('env', 'BLASTWALL_ATTESTATION_SIGNER_CERTIFICATE_FILE') | default('', true) }}
        BLASTWALL_ATTESTATION_CA_BUNDLE_FILE: >-
          {{ lookup('env', 'BLASTWALL_ATTESTATION_CA_BUNDLE_FILE') | default('', true) }}
        BLASTWALL_ATTESTATION_SIGNER_ALLOWLIST: >-
          {{ lookup('env', 'BLASTWALL_ATTESTATION_SIGNER_ALLOWLIST') | default('', true) }}
        BLASTWALL_ATTESTATION_VAULT_PRIMARY: >-
          {{ lookup('env', 'BLASTWALL_ATTESTATION_VAULT_PRIMARY') | default('', true) }}
        BLASTWALL_ATTESTATION_VAULT_SERVERS: >-
          {{ lookup('env', 'BLASTWALL_ATTESTATION_VAULT_SERVERS') | default('', true) }}
        BLASTWALL_ATTESTATION_VAULT_SCOPE: >-
          {{ lookup('env', 'BLASTWALL_ATTESTATION_VAULT_SCOPE') | default('service', true) }}
        BLASTWALL_ATTESTATION_VAULT_OWNER: >-
          {{ lookup('env', 'BLASTWALL_ATTESTATION_VAULT_OWNER') | default('blastwall-attestation', true) }}
        BLASTWALL_ATTESTATION_ENVELOPE_DIR: >-
          {{ lookup('env', 'BLASTWALL_ATTESTATION_ENVELOPE_DIR') |
          default('/tmp/blastwall-attestations/envelopes', true) }}
        BLASTWALL_ATTESTATION_INDEX_DIR: >-
          {{ lookup('env', 'BLASTWALL_ATTESTATION_INDEX_DIR') |
          default('/tmp/blastwall-attestations/indexes', true) }}
        BLASTWALL_ATTESTATION_IDM_CREDENTIAL: >-
          {{ lookup('env', 'BLASTWALL_ATTESTATION_IDM_CREDENTIAL') | default('', true) }}
        BLASTWALL_SOURCE_REVISION: >-
          {{ lookup('env', 'BLASTWALL_SOURCE_REVISION') | default('', true) }}
        BLASTWALL_CURRENT_POLICY_SHA256: >-
          {{ lookup('env', 'BLASTWALL_CURRENT_POLICY_SHA256') |
          default(lookup('env', 'BLASTWALL_POLICY_SHA256') | default('', true), true) }}
        BLASTWALL_PROBE_REPORT_SHA256: >-
          {{ lookup('env', 'BLASTWALL_PROBE_REPORT_SHA256') | default('', true) }}
        BLASTWALL_SPO_EVIDENCE_JSON: >-
          {{ lookup('env', 'BLASTWALL_SPO_EVIDENCE_JSON') | default('', true) }}
        BLASTWALL_SPO_INCLUDE_STRANGE_SOCKET_V1: >-
          {{ lookup('env', 'BLASTWALL_SPO_INCLUDE_STRANGE_SOCKET_V1') | default('false', true) }}
        BLASTWALL_SPO_VALIDATE_STRANGE_SOCKET_V1: >-
          {{ lookup('env', 'BLASTWALL_SPO_VALIDATE_STRANGE_SOCKET_V1') | default('false', true) }}
        BLASTWALL_OPENSHIFT_KUBECONFIG: >-
          {{ lookup('env', 'BLASTWALL_OPENSHIFT_KUBECONFIG') | default(calabi_kubeconfig, true) }}
        BLASTWALL_IDM_ADMIN_PRINCIPAL: "{{ blastwall_ipaadmin_principal }}"
        BLASTWALL_IDM_ADMIN_PASSWORD: >-
          {{ lookup('env', 'IPA_ADMIN_PASSWORD') |
          default(calabi_aap_runtime_password.stdout, true) }}
        BLASTWALL_REGISTRY_HOST: "{{ calabi_registry_endpoint }}"
        BLASTWALL_AAP_LAUNCH_USER: "{{ calabi_blastwall_demo_user }}"
        BLASTWALL_AAP_LAUNCH_PASSWORD: >-
          {{ lookup('env', 'BLASTWALL_DEMO_PASSWORD') |
          default(calabi_aap_runtime_password.stdout, true) }}
        BLASTWALL_AAP_LAUNCH_USER_EMAIL: "{{ calabi_blastwall_demo_email }}"
        BLASTWALL_REGISTRY_USERNAME: "{{ lookup('env', 'BLASTWALL_REGISTRY_USERNAME') | default(calabi_registry_user, true) }}"
        BLASTWALL_REGISTRY_PASSWORD: "{{ lookup('env', 'BLASTWALL_REGISTRY_PASSWORD') }}"
      no_log: true
      changed_when: true
