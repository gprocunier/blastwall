---
- name: Seed Blastwall AAP current/stale selection fixture
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../group_vars/all.yml
    - vars/calabi-aap.yml
  vars:
    calabi_blastwall_stale_host: >-
      {{ lookup('env', 'BLASTWALL_STALE_HOST') |
      default('stale-blastwall-01.workshop.lan', true) }}
    calabi_blastwall_stale_marker: >-
      blastwall_policy_rpm=blastwall-selinux-0.4.0-1;
      blastwall_policy_state=active;
      blastwall_policy_alg_socket=denied;
      blastwall_policy_bpf=denied;
      blastwall_policy_selfprotect=denied
  tasks:
    - name: Require IdM admin password
      ansible.builtin.assert:
        that:
          - blastwall_ipaadmin_password | length > 0
        fail_msg: "Set IPA_ADMIN_PASSWORD before seeding the AAP selection fixture."

    - name: Ensure stale Blastwall fixture host exists in IdM
      freeipa.ansible_freeipa.ipahost:
        ipaadmin_principal: "{{ blastwall_ipaadmin_principal }}"
        ipaadmin_password: "{{ blastwall_ipaadmin_password }}"
        name: "{{ calabi_blastwall_stale_host }}"
        description: "{{ calabi_blastwall_stale_marker }}"
        force: true
        state: present
      no_log: true

    - name: Add stale fixture host to Blastwall managed-host group
      freeipa.ansible_freeipa.ipahostgroup:
        ipaadmin_principal: "{{ blastwall_ipaadmin_principal }}"
        ipaadmin_password: "{{ blastwall_ipaadmin_password }}"
        name: "{{ blastwall_hostgroup }}"
        host:
          - "{{ calabi_blastwall_stale_host }}"
        action: member
        state: present
      no_log: true

    - name: Report current/stale selection fixture
      ansible.builtin.debug:
        msg:
          current_host: "{{ blastwall_endpoint_host }}"
          stale_host: "{{ calabi_blastwall_stale_host }}"
          hostgroup: "{{ blastwall_hostgroup }}"
          stale_marker: "{{ calabi_blastwall_stale_marker }}"
