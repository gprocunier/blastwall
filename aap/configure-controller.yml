---
- name: Configure Blastwall objects in AAP Controller
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - vars/blastwall-controller.yml
  environment:
    CONTROLLER_HOST: "{{ blastwall_aap_controller_host }}"
    CONTROLLER_USERNAME: "{{ blastwall_aap_controller_username }}"
    CONTROLLER_PASSWORD: "{{ blastwall_aap_controller_password }}"
    CONTROLLER_VERIFY_SSL: "{{ blastwall_aap_validate_certs | string | lower }}"
  tasks:
    - name: Require controller password
      ansible.builtin.assert:
        that:
          - blastwall_aap_controller_host | length > 0
          - blastwall_aap_controller_password | length > 0
        fail_msg: >-
          Set CONTROLLER_HOST and CONTROLLER_PASSWORD before applying
          Blastwall Controller configuration.

    - name: Require IdM runtime files
      ansible.builtin.assert:
        that:
          - blastwall_aap_ipa_cert_file | length > 0
          - blastwall_aap_krb5_config_file | length > 0
          - blastwall_aap_ipa_server | length > 0
          - blastwall_aap_ipa_domain | length > 0
          - blastwall_aap_ipa_realm | length > 0
          - blastwall_aap_ipa_principal | length > 0
          - blastwall_aap_ipa_password | length > 0 or blastwall_aap_ipa_keytab_file | length > 0
        fail_msg: >-
          Set IPA_SERVER, IPA_DOMAIN, IPA_REALM, IPA_CERT, KRB5_CONFIG,
          IPA_PRINCIPAL, and either IPA_KEYTAB or IPA_PASSWORD before applying AAP
          configuration.

    - name: Read IdM CA certificate for AAP credential creation
      ansible.builtin.slurp:
        src: "{{ blastwall_aap_ipa_cert_file }}"
      register: blastwall_aap_ipa_cert
      no_log: true

    - name: Read Kerberos config for AAP credential creation
      ansible.builtin.slurp:
        src: "{{ blastwall_aap_krb5_config_file }}"
      register: blastwall_aap_krb5_config
      no_log: true

    - name: Read optional IdM keytab for AAP credential creation
      ansible.builtin.slurp:
        src: "{{ blastwall_aap_ipa_keytab_file }}"
      register: blastwall_aap_ipa_keytab
      when: blastwall_aap_ipa_keytab_file | length > 0
      no_log: true

    - name: Read optional OpenShift kubeconfig for SPO apply validation
      ansible.builtin.slurp:
        src: "{{ blastwall_aap_openshift_kubeconfig_file }}"
      register: blastwall_aap_openshift_kubeconfig
      when: blastwall_aap_openshift_kubeconfig_file | length > 0
      no_log: true

    - name: Store IdM runtime credential material
      ansible.builtin.set_fact:
        blastwall_aap_ipa_cert_content: >-
          {{ blastwall_aap_ipa_cert.content | b64decode }}
        blastwall_aap_krb5_config_content: >-
          {{ blastwall_aap_krb5_config.content | b64decode }}
        blastwall_aap_ipa_keytab_content: >-
          {{ blastwall_aap_ipa_keytab.content | default('') | b64decode }}
        blastwall_aap_openshift_kubeconfig_content: >-
          {{ blastwall_aap_openshift_kubeconfig.content | default('') | b64decode }}
      no_log: true

    - name: Ensure Blastwall organization exists
      awx.awx.organization:
        name: "{{ blastwall_aap_organization }}"
        state: present

    - name: Ensure optional workflow launch user exists
      awx.awx.user:
        username: "{{ blastwall_aap_launch_user }}"
        password: "{{ blastwall_aap_launch_password }}"
        email: "{{ blastwall_aap_launch_user_email }}"
        first_name: Blastwall
        last_name: Demo
        is_superuser: false
        is_system_auditor: false
        state: present
      no_log: true
      when:
        - blastwall_aap_launch_user | length > 0
        - blastwall_aap_launch_password | length > 0

    - name: Ensure Blastwall execution environment registry credential exists
      awx.awx.credential:
        name: "{{ blastwall_aap_registry_credential }}"
        organization: "{{ blastwall_aap_organization }}"
        credential_type: Container Registry
        inputs:
          host: "{{ blastwall_aap_registry_host }}"
          username: "{{ blastwall_aap_registry_username }}"
          password: "{{ blastwall_aap_registry_password }}"
        state: present
      no_log: true
      when: blastwall_aap_registry_password | length > 0

    - name: Ensure Blastwall execution environment exists
      awx.awx.execution_environment:
        name: "{{ blastwall_aap_ee_name }}"
        organization: "{{ blastwall_aap_organization }}"
        image: "{{ blastwall_aap_ee_image }}"
        pull: "{{ blastwall_aap_ee_pull }}"
        credential: >-
          {{
            blastwall_aap_registry_credential
            if blastwall_aap_registry_password | length > 0
            else omit
          }}
        state: present

    - name: Define Blastwall IdM credential type contract
      ansible.builtin.set_fact:
        blastwall_aap_idm_credential_type_inputs:
          fields:
            - id: ipa_server
              label: IPA server
              type: string
            - id: ipa_domain
              label: IPA domain
              type: string
            - id: ipa_realm
              label: IPA realm
              type: string
            - id: ipa_principal
              label: IPA principal
              type: string
            - id: ipa_password
              label: IPA password (demo fallback)
              type: string
              secret: true
            - id: ipa_keytab
              label: IPA keytab file content
              type: string
              multiline: true
              secret: true
            - id: ipa_ca
              label: IPA CA certificate
              type: string
              multiline: true
              secret: true
            - id: krb5_config
              label: krb5.conf
              type: string
              multiline: true
              secret: true
            - id: blastwall_identity
              label: Blastwall identity
              type: string
          required:
            - ipa_server
            - ipa_domain
            - ipa_realm
            - ipa_principal
            - ipa_ca
            - krb5_config
            - blastwall_identity
        blastwall_aap_idm_credential_type_injectors:
          file:
            template.ipa_ca: !unsafe "{{ ipa_ca }}"
            template.krb5_config: !unsafe "{{ krb5_config }}"
            template.ipa_keytab: !unsafe "{{ ipa_keytab }}"
          env:
            IPA_SERVER: !unsafe "{{ ipa_server }}"
            IPA_DOMAIN: !unsafe "{{ ipa_domain }}"
            IPA_REALM: !unsafe "{{ ipa_realm }}"
            IPA_PRINCIPAL: !unsafe "{{ ipa_principal }}"
            IPA_PASSWORD: !unsafe "{{ ipa_password }}"
            IPA_ADMIN_PASSWORD: !unsafe "{{ ipa_password }}"
            IPA_CERT: !unsafe "{{ tower.filename.ipa_ca }}"
            KRB5_CONFIG: !unsafe "{{ tower.filename.krb5_config }}"
            IPA_KEYTAB: !unsafe "{{ tower.filename.ipa_keytab if ipa_keytab else \"\" }}"
            KRB5CCNAME: FILE:/tmp/blastwall_krb5cc
            BLASTWALL_IDENTITY: !unsafe "{{ blastwall_identity }}"

    - name: Define Blastwall OpenShift kubeconfig credential type contract
      ansible.builtin.set_fact:
        blastwall_aap_openshift_credential_type_inputs:
          fields:
            - id: kubeconfig
              label: kubeconfig
              type: string
              multiline: true
              secret: true
          required:
            - kubeconfig
        blastwall_aap_openshift_credential_type_injectors:
          file:
            template.kubeconfig: !unsafe "{{ kubeconfig }}"
          env:
            K8S_AUTH_KUBECONFIG: !unsafe "{{ tower.filename.kubeconfig }}"

    - name: Look up Blastwall IdM credential type
      ansible.builtin.uri:
        url: "{{ blastwall_aap_controller_host }}/api/v2/credential_types/?name={{ blastwall_aap_idm_credential_type | urlencode }}&kind=cloud"
        method: GET
        url_username: "{{ blastwall_aap_controller_username }}"
        url_password: "{{ blastwall_aap_controller_password }}"
        force_basic_auth: true
        validate_certs: "{{ blastwall_aap_validate_certs | bool }}"
        status_code: 200
      register: blastwall_aap_idm_credential_type_lookup

    - name: Assert Blastwall IdM credential type lookup is unambiguous
      ansible.builtin.assert:
        that:
          - blastwall_aap_idm_credential_type_lookup.json.count | int <= 1
        fail_msg: >-
          Expected at most one AAP credential type named
          {{ blastwall_aap_idm_credential_type }}, found
          {{ blastwall_aap_idm_credential_type_lookup.json.count }}.

    - name: Create Blastwall IdM credential type
      ansible.builtin.uri:
        url: "{{ blastwall_aap_controller_host }}/api/v2/credential_types/"
        method: POST
        url_username: "{{ blastwall_aap_controller_username }}"
        url_password: "{{ blastwall_aap_controller_password }}"
        force_basic_auth: true
        validate_certs: "{{ blastwall_aap_validate_certs | bool }}"
        body_format: json
        body:
          name: "{{ blastwall_aap_idm_credential_type }}"
          kind: cloud
          inputs: "{{ blastwall_aap_idm_credential_type_inputs }}"
          injectors: "{{ blastwall_aap_idm_credential_type_injectors }}"
        status_code: 201
      register: blastwall_aap_idm_credential_type_create
      when: blastwall_aap_idm_credential_type_lookup.json.count | int == 0

    - name: Remove managed Blastwall IdM credential before credential type schema update
      awx.awx.credential:
        name: "{{ blastwall_aap_idm_credential }}"
        organization: "{{ blastwall_aap_organization }}"
        credential_type: "{{ blastwall_aap_idm_credential_type }}"
        state: absent
      no_log: true
      when:
        - blastwall_aap_idm_credential_type_lookup.json.count | int == 1
        - >-
          blastwall_aap_idm_credential_type_lookup.json.results[0].inputs !=
          blastwall_aap_idm_credential_type_inputs

    - name: Update Blastwall IdM credential type when drifted
      ansible.builtin.uri:
        url: >-
          {{ blastwall_aap_controller_host }}{{
          blastwall_aap_idm_credential_type_lookup.json.results[0].url }}
        method: PATCH
        url_username: "{{ blastwall_aap_controller_username }}"
        url_password: "{{ blastwall_aap_controller_password }}"
        force_basic_auth: true
        validate_certs: "{{ blastwall_aap_validate_certs | bool }}"
        body_format: json
        body:
          inputs: "{{ blastwall_aap_idm_credential_type_inputs }}"
          injectors: "{{ blastwall_aap_idm_credential_type_injectors }}"
        status_code: 200
      register: blastwall_aap_idm_credential_type_update
      when:
        - blastwall_aap_idm_credential_type_lookup.json.count | int == 1
        - >-
          blastwall_aap_idm_credential_type_lookup.json.results[0].inputs !=
          blastwall_aap_idm_credential_type_inputs or
          blastwall_aap_idm_credential_type_lookup.json.results[0].injectors !=
          blastwall_aap_idm_credential_type_injectors

    - name: Look up Blastwall OpenShift kubeconfig credential type
      ansible.builtin.uri:
        url: "{{ blastwall_aap_controller_host }}/api/v2/credential_types/?name={{ blastwall_aap_openshift_credential_type | urlencode }}&kind=cloud"
        method: GET
        url_username: "{{ blastwall_aap_controller_username }}"
        url_password: "{{ blastwall_aap_controller_password }}"
        force_basic_auth: true
        validate_certs: "{{ blastwall_aap_validate_certs | bool }}"
        status_code: 200
      register: blastwall_aap_openshift_credential_type_lookup

    - name: Assert Blastwall OpenShift kubeconfig credential type lookup is unambiguous
      ansible.builtin.assert:
        that:
          - blastwall_aap_openshift_credential_type_lookup.json.count | int <= 1
        fail_msg: >-
          Expected at most one AAP credential type named
          {{ blastwall_aap_openshift_credential_type }}, found
          {{ blastwall_aap_openshift_credential_type_lookup.json.count }}.

    - name: Create Blastwall OpenShift kubeconfig credential type
      ansible.builtin.uri:
        url: "{{ blastwall_aap_controller_host }}/api/v2/credential_types/"
        method: POST
        url_username: "{{ blastwall_aap_controller_username }}"
        url_password: "{{ blastwall_aap_controller_password }}"
        force_basic_auth: true
        validate_certs: "{{ blastwall_aap_validate_certs | bool }}"
        body_format: json
        body:
          name: "{{ blastwall_aap_openshift_credential_type }}"
          kind: cloud
          inputs: "{{ blastwall_aap_openshift_credential_type_inputs }}"
          injectors: "{{ blastwall_aap_openshift_credential_type_injectors }}"
        status_code: 201
      register: blastwall_aap_openshift_credential_type_create
      when: blastwall_aap_openshift_credential_type_lookup.json.count | int == 0

    - name: Remove managed OpenShift credential before credential type schema update
      awx.awx.credential:
        name: "{{ blastwall_aap_openshift_credential }}"
        organization: "{{ blastwall_aap_organization }}"
        credential_type: "{{ blastwall_aap_openshift_credential_type }}"
        state: absent
      no_log: true
      when:
        - blastwall_aap_openshift_credential_type_lookup.json.count | int == 1
        - >-
          blastwall_aap_openshift_credential_type_lookup.json.results[0].inputs !=
          blastwall_aap_openshift_credential_type_inputs

    - name: Update Blastwall OpenShift kubeconfig credential type when drifted
      ansible.builtin.uri:
        url: >-
          {{ blastwall_aap_controller_host }}{{
          blastwall_aap_openshift_credential_type_lookup.json.results[0].url }}
        method: PATCH
        url_username: "{{ blastwall_aap_controller_username }}"
        url_password: "{{ blastwall_aap_controller_password }}"
        force_basic_auth: true
        validate_certs: "{{ blastwall_aap_validate_certs | bool }}"
        body_format: json
        body:
          inputs: "{{ blastwall_aap_openshift_credential_type_inputs }}"
          injectors: "{{ blastwall_aap_openshift_credential_type_injectors }}"
        status_code: 200
      register: blastwall_aap_openshift_credential_type_update
      when:
        - blastwall_aap_openshift_credential_type_lookup.json.count | int == 1
        - >-
          blastwall_aap_openshift_credential_type_lookup.json.results[0].inputs !=
          blastwall_aap_openshift_credential_type_inputs or
          blastwall_aap_openshift_credential_type_lookup.json.results[0].injectors !=
          blastwall_aap_openshift_credential_type_injectors

    - name: Ensure Blastwall IdM credential exists
      awx.awx.credential:
        name: "{{ blastwall_aap_idm_credential }}"
        organization: "{{ blastwall_aap_organization }}"
        credential_type: "{{ blastwall_aap_idm_credential_type }}"
        inputs:
          ipa_server: "{{ blastwall_aap_ipa_server }}"
          ipa_domain: "{{ blastwall_aap_ipa_domain }}"
          ipa_realm: "{{ blastwall_aap_ipa_realm }}"
          ipa_principal: "{{ blastwall_aap_ipa_principal }}"
          ipa_password: "{{ blastwall_aap_ipa_password }}"
          ipa_keytab: "{{ blastwall_aap_ipa_keytab_content }}"
          ipa_ca: "{{ blastwall_aap_ipa_cert_content }}"
          krb5_config: "{{ blastwall_aap_krb5_config_content }}"
          blastwall_identity: "{{ blastwall_aap_identity }}"
        state: present
      no_log: true

    - name: Ensure Blastwall policy maintainer IdM credential exists
      awx.awx.credential:
        name: "{{ blastwall_aap_policy_idm_credential }}"
        organization: "{{ blastwall_aap_organization }}"
        credential_type: "{{ blastwall_aap_idm_credential_type }}"
        inputs:
          ipa_server: "{{ blastwall_aap_ipa_server }}"
          ipa_domain: "{{ blastwall_aap_ipa_domain }}"
          ipa_realm: "{{ blastwall_aap_ipa_realm }}"
          ipa_principal: "{{ blastwall_aap_policy_identity }}"
          ipa_password: "{{ blastwall_aap_policy_password }}"
          ipa_keytab: "{{ blastwall_aap_ipa_keytab_content }}"
          ipa_ca: "{{ blastwall_aap_ipa_cert_content }}"
          krb5_config: "{{ blastwall_aap_krb5_config_content }}"
          blastwall_identity: "{{ blastwall_aap_policy_identity }}"
        state: present
      no_log: true

    - name: Ensure Blastwall IdM admin credential exists
      awx.awx.credential:
        name: "{{ blastwall_aap_idm_admin_credential }}"
        organization: "{{ blastwall_aap_organization }}"
        credential_type: "{{ blastwall_aap_idm_credential_type }}"
        inputs:
          ipa_server: "{{ blastwall_aap_ipa_server }}"
          ipa_domain: "{{ blastwall_aap_ipa_domain }}"
          ipa_realm: "{{ blastwall_aap_ipa_realm }}"
          ipa_principal: "{{ blastwall_aap_idm_admin_principal }}"
          ipa_password: "{{ blastwall_aap_idm_admin_password }}"
          ipa_keytab: ""
          ipa_ca: "{{ blastwall_aap_ipa_cert_content }}"
          krb5_config: "{{ blastwall_aap_krb5_config_content }}"
          blastwall_identity: "{{ blastwall_aap_idm_admin_principal }}"
        state: present
      no_log: true

    - name: Ensure optional Blastwall OpenShift credential exists
      awx.awx.credential:
        name: "{{ blastwall_aap_openshift_credential }}"
        organization: "{{ blastwall_aap_organization }}"
        credential_type: "{{ blastwall_aap_openshift_credential_type }}"
        inputs:
          kubeconfig: "{{ blastwall_aap_openshift_kubeconfig_content }}"
        state: present
      no_log: true
      when: blastwall_aap_openshift_kubeconfig_content | length > 0

    - name: Ensure GSSAPI machine credential exists
      awx.awx.credential:
        name: "{{ blastwall_aap_machine_credential }}"
        organization: "{{ blastwall_aap_organization }}"
        credential_type: Machine
        inputs:
          username: "{{ blastwall_aap_identity }}"
          password: "{{ blastwall_aap_machine_password }}"
        state: present
      no_log: true

    - name: Ensure policy maintainer machine credential exists
      awx.awx.credential:
        name: "{{ blastwall_aap_policy_machine_credential }}"
        organization: "{{ blastwall_aap_organization }}"
        credential_type: Machine
        inputs:
          username: "{{ blastwall_aap_policy_identity }}"
          password: "{{ blastwall_aap_policy_password }}"
          become_method: sudo
        state: present
      no_log: true

    - name: Ensure Blastwall project exists
      awx.awx.project:
        name: "{{ blastwall_aap_project }}"
        organization: "{{ blastwall_aap_organization }}"
        scm_type: git
        scm_url: "{{ blastwall_aap_project_url }}"
        scm_branch: "{{ blastwall_aap_project_branch }}"
        scm_clean: true
        scm_update_on_launch: true
        allow_override: true
        state: present

    - name: Ensure Blastwall inventory exists
      awx.awx.inventory:
        name: "{{ blastwall_aap_inventory }}"
        organization: "{{ blastwall_aap_organization }}"
        variables:
          ansible_ssh_common_args: >-
            -o GSSAPIAuthentication=yes
            -o GSSAPIDelegateCredentials=yes
            -o PreferredAuthentications=gssapi-with-mic,gssapi-keyex
            -o ControlMaster=no
            -o ControlPath=none
            -o StrictHostKeyChecking=no
            -o UserKnownHostsFile=/dev/null
        state: present

    - name: Ensure Blastwall inventory source exists
      awx.awx.inventory_source:
        name: "{{ blastwall_aap_inventory_source }}"
        organization: "{{ blastwall_aap_organization }}"
        inventory: "{{ blastwall_aap_inventory }}"
        source: scm
        source_project: "{{ blastwall_aap_project }}"
        source_path: "{{ blastwall_aap_inventory_source_path }}"
        source_vars: "{{ blastwall_aap_inventory_source_vars }}"
        execution_environment: "{{ blastwall_aap_ee_name }}"
        credential: "{{ blastwall_aap_idm_credential }}"
        overwrite: true
        overwrite_vars: true
        update_on_launch: true
        update_cache_timeout: 0
        state: present

    - name: Ensure Blastwall job templates exist
      awx.awx.job_template:
        name: "{{ item.name }}"
        organization: "{{ blastwall_aap_organization }}"
        job_type: run
        inventory: "{{ blastwall_aap_inventory }}"
        project: "{{ blastwall_aap_project }}"
        execution_environment: "{{ blastwall_aap_ee_name }}"
        playbook: "{{ item.playbook }}"
        credentials: "{{ item.credentials }}"
        limit: "{{ item.limit | default(omit) }}"
        extra_vars: "{{ item.extra_vars | default(omit) }}"
        ask_variables_on_launch: true
        ask_limit_on_launch: true
        verbosity: 1
        state: present
      loop: "{{ blastwall_aap_job_templates }}"

    - name: Attach OpenShift credential to SPO apply and validate job template
      awx.awx.job_template:
        name: Blastwall apply and validate SPO policy CRs
        organization: "{{ blastwall_aap_organization }}"
        job_type: run
        inventory: "{{ blastwall_aap_inventory }}"
        project: "{{ blastwall_aap_project }}"
        execution_environment: "{{ blastwall_aap_ee_name }}"
        playbook: playbooks/apply-validate-spo-policy-crs.yml
        credentials:
          - "{{ blastwall_aap_openshift_credential }}"
        extra_vars: "{{ blastwall_aap_spo_apply_extra_vars }}"
        ask_variables_on_launch: true
        ask_limit_on_launch: true
        verbosity: 1
        state: present
      when: blastwall_aap_openshift_kubeconfig_content | length > 0

    - name: Remove stale policy deployment job template from AAP verification path
      awx.awx.job_template:
        name: Blastwall deploy policy
        organization: "{{ blastwall_aap_organization }}"
        state: absent

    - name: Ensure Blastwall workflow template exists
      awx.awx.workflow_job_template:
        name: "{{ blastwall_aap_workflow }}"
        organization: "{{ blastwall_aap_organization }}"
        inventory: "{{ blastwall_aap_inventory }}"
        ask_variables_on_launch: true
        state: present

    - name: Ensure Blastwall policy pipeline workflow template exists
      awx.awx.workflow_job_template:
        name: "{{ blastwall_aap_policy_pipeline_workflow }}"
        organization: "{{ blastwall_aap_organization }}"
        inventory: "{{ blastwall_aap_inventory }}"
        ask_variables_on_launch: true
        state: present

    - name: Ensure workflow preflight node exists
      awx.awx.workflow_job_template_node:
        identifier: project_sync
        workflow_job_template: "{{ blastwall_aap_workflow }}"
        organization: "{{ blastwall_aap_organization }}"
        unified_job_template: "{{ blastwall_aap_project }}"
        state: present

    - name: Ensure workflow inventory sync node exists
      awx.awx.workflow_job_template_node:
        identifier: inventory_sync
        workflow_job_template: "{{ blastwall_aap_workflow }}"
        organization: "{{ blastwall_aap_organization }}"
        unified_job_template: "{{ blastwall_aap_inventory_source }}"
        state: present

    - name: Ensure workflow job nodes exist
      awx.awx.workflow_job_template_node:
        identifier: "{{ item.identifier }}"
        workflow_job_template: "{{ blastwall_aap_workflow }}"
        organization: "{{ blastwall_aap_organization }}"
        unified_job_template: "{{ item.template }}"
        limit: "{{ item.limit | default(omit) }}"
        extra_data: "{{ item.extra_data | default(omit) }}"
        state: present
      loop:
        - identifier: credential_smoke
          template: Blastwall credential smoke
        - identifier: preflight
          template: Blastwall preflight
          extra_data: "{{ blastwall_aap_profile_extra_vars }}"
        - identifier: verify_managed_host
          template: Blastwall verify managed host
          limit: "{{ blastwall_aap_verify_target_group }}"
          extra_data: "{{ blastwall_aap_profile_extra_vars | combine({'blastwall_verify_target_hosts': blastwall_aap_verify_target_group}) }}"

    - name: Remove stale bootstrap workflow nodes from verification workflow
      awx.awx.workflow_job_template_node:
        identifier: "{{ item }}"
        workflow_job_template: "{{ blastwall_aap_workflow }}"
        organization: "{{ blastwall_aap_organization }}"
        state: absent
      loop:
        - deploy_policy
        - post_deploy_inventory_sync

    - name: Remove stale policy rollout workflow template
      awx.awx.workflow_job_template:
        name: Blastwall policy rollout
        organization: "{{ blastwall_aap_organization }}"
        state: absent

    - name: Link workflow nodes
      awx.awx.workflow_job_template_node:
        identifier: "{{ item.identifier }}"
        workflow_job_template: "{{ blastwall_aap_workflow }}"
        organization: "{{ blastwall_aap_organization }}"
        unified_job_template: "{{ item.template }}"
        success_nodes: "{{ item.success_nodes }}"
        state: present
      loop:
        - identifier: project_sync
          template: "{{ blastwall_aap_project }}"
          success_nodes:
            - credential_smoke
        - identifier: credential_smoke
          template: Blastwall credential smoke
          success_nodes:
            - inventory_sync
        - identifier: inventory_sync
          template: "{{ blastwall_aap_inventory_source }}"
          success_nodes:
            - preflight
        - identifier: preflight
          template: Blastwall preflight
          success_nodes:
            - verify_managed_host

    - name: Ensure policy pipeline sync nodes exist
      awx.awx.workflow_job_template_node:
        identifier: "{{ item.identifier }}"
        workflow_job_template: "{{ blastwall_aap_policy_pipeline_workflow }}"
        organization: "{{ blastwall_aap_organization }}"
        unified_job_template: "{{ item.template }}"
        state: present
      loop:
        - identifier: policy_project_sync
          template: "{{ blastwall_aap_project }}"
        - identifier: policy_inventory_sync
          template: "{{ blastwall_aap_inventory_source }}"
        - identifier: post_promotion_inventory_sync
          template: "{{ blastwall_aap_inventory_source }}"

    - name: Ensure policy pipeline job nodes exist
      awx.awx.workflow_job_template_node:
        identifier: "{{ item.identifier }}"
        workflow_job_template: "{{ blastwall_aap_policy_pipeline_workflow }}"
        organization: "{{ blastwall_aap_organization }}"
        unified_job_template: "{{ item.template }}"
        limit: "{{ item.limit | default(omit) }}"
        extra_data: "{{ item.extra_data | default(omit) }}"
        state: present
      loop:
        - identifier: build_policy_rpm
          template: Blastwall build policy RPM
          limit: "{{ blastwall_aap_policy_pipeline_candidate_group }}"
          extra_data:
            blastwall_policy_pipeline_build_hosts: "{{ blastwall_aap_policy_pipeline_candidate_group }}"
        - identifier: render_spo_policy_crs
          template: Blastwall render SPO policy CRs
          extra_data: "{{ blastwall_aap_spo_render_extra_vars }}"
        - identifier: install_candidate_policy_rpm
          template: Blastwall install candidate policy RPM
          limit: "{{ blastwall_aap_policy_pipeline_candidate_group }}"
          extra_data: "{{ blastwall_aap_profile_extra_vars | combine({'blastwall_policy_pipeline_target_hosts': blastwall_aap_policy_pipeline_candidate_group}) }}"
        - identifier: verify_candidate_host
          template: Blastwall verify managed host
          limit: "{{ blastwall_aap_policy_pipeline_candidate_group }}"
          extra_data: "{{ blastwall_aap_profile_extra_vars | combine({'blastwall_verify_target_hosts': blastwall_aap_policy_pipeline_candidate_group}) }}"
        - identifier: promote_policy_marker
          template: Blastwall promote policy marker
          limit: "{{ blastwall_aap_policy_pipeline_candidate_group }}"
          extra_data: "{{ blastwall_aap_profile_extra_vars | combine({'blastwall_policy_pipeline_target_hosts': blastwall_aap_policy_pipeline_candidate_group}) }}"
        - identifier: post_promotion_preflight
          template: Blastwall preflight
          extra_data: "{{ blastwall_aap_profile_extra_vars | combine({'blastwall_preflight_target_group_override': blastwall_aap_post_promotion_preflight_target_group}) }}"

    - name: Ensure policy pipeline OpenShift apply validation node exists when configured
      awx.awx.workflow_job_template_node:
        identifier: apply_validate_spo_policy_crs
        workflow_job_template: "{{ blastwall_aap_policy_pipeline_workflow }}"
        organization: "{{ blastwall_aap_organization }}"
        unified_job_template: Blastwall apply and validate SPO policy CRs
        extra_data: "{{ blastwall_aap_spo_apply_extra_vars }}"
        state: present
      when: blastwall_aap_openshift_kubeconfig_content | length > 0

    - name: Remove policy pipeline OpenShift apply validation node when not configured
      awx.awx.workflow_job_template_node:
        identifier: apply_validate_spo_policy_crs
        workflow_job_template: "{{ blastwall_aap_policy_pipeline_workflow }}"
        organization: "{{ blastwall_aap_organization }}"
        unified_job_template: Blastwall apply and validate SPO policy CRs
        state: absent
      when: blastwall_aap_openshift_kubeconfig_content | length == 0

    - name: Link policy pipeline workflow nodes
      awx.awx.workflow_job_template_node:
        identifier: "{{ item.identifier }}"
        workflow_job_template: "{{ blastwall_aap_policy_pipeline_workflow }}"
        organization: "{{ blastwall_aap_organization }}"
        unified_job_template: "{{ item.template }}"
        success_nodes: "{{ item.success_nodes }}"
        state: present
      loop:
        - identifier: policy_project_sync
          template: "{{ blastwall_aap_project }}"
          success_nodes:
            - policy_inventory_sync
        - identifier: policy_inventory_sync
          template: "{{ blastwall_aap_inventory_source }}"
          success_nodes:
            - build_policy_rpm
        - identifier: build_policy_rpm
          template: Blastwall build policy RPM
          success_nodes:
            - render_spo_policy_crs
            - install_candidate_policy_rpm
        - identifier: install_candidate_policy_rpm
          template: Blastwall install candidate policy RPM
          success_nodes:
            - verify_candidate_host
        - identifier: verify_candidate_host
          template: Blastwall verify managed host
          success_nodes:
            - promote_policy_marker
        - identifier: promote_policy_marker
          template: Blastwall promote policy marker
          success_nodes:
            - post_promotion_inventory_sync
        - identifier: post_promotion_inventory_sync
          template: "{{ blastwall_aap_inventory_source }}"
          success_nodes:
            - post_promotion_preflight

    - name: Link render SPO node to OpenShift apply validation when configured
      awx.awx.workflow_job_template_node:
        identifier: render_spo_policy_crs
        workflow_job_template: "{{ blastwall_aap_policy_pipeline_workflow }}"
        organization: "{{ blastwall_aap_organization }}"
        unified_job_template: Blastwall render SPO policy CRs
        success_nodes:
          - apply_validate_spo_policy_crs
        state: present
      when: blastwall_aap_openshift_kubeconfig_content | length > 0

    - name: Leave render SPO node as artifact-only when OpenShift is not configured
      awx.awx.workflow_job_template_node:
        identifier: render_spo_policy_crs
        workflow_job_template: "{{ blastwall_aap_policy_pipeline_workflow }}"
        organization: "{{ blastwall_aap_organization }}"
        unified_job_template: Blastwall render SPO policy CRs
        success_nodes: []
        state: present
      when: blastwall_aap_openshift_kubeconfig_content | length == 0

    - name: Grant optional launch user Blastwall organization membership
      awx.awx.role:
        users:
          - "{{ blastwall_aap_launch_user }}"
        role: member
        organizations:
          - "{{ blastwall_aap_organization }}"
        state: present
      when: blastwall_aap_launch_user | length > 0

    - name: Grant optional launch user read access to Blastwall resources
      awx.awx.role:
        users:
          - "{{ blastwall_aap_launch_user }}"
        role: read
        lookup_organization: "{{ blastwall_aap_organization }}"
        projects:
          - "{{ blastwall_aap_project }}"
        inventories:
          - "{{ blastwall_aap_inventory }}"
        credentials:
          - "{{ blastwall_aap_idm_credential }}"
          - "{{ blastwall_aap_machine_credential }}"
          - "{{ blastwall_aap_policy_idm_credential }}"
          - "{{ blastwall_aap_policy_machine_credential }}"
          - "{{ blastwall_aap_idm_admin_credential }}"
        job_templates: "{{ blastwall_aap_job_templates | map(attribute='name') | list }}"
        workflows:
          - "{{ blastwall_aap_workflow }}"
          - "{{ blastwall_aap_policy_pipeline_workflow }}"
        state: present
      when: blastwall_aap_launch_user | length > 0

    - name: Grant optional launch user read access to OpenShift credential
      awx.awx.role:
        users:
          - "{{ blastwall_aap_launch_user }}"
        role: read
        lookup_organization: "{{ blastwall_aap_organization }}"
        credentials:
          - "{{ blastwall_aap_openshift_credential }}"
        state: present
      when:
        - blastwall_aap_launch_user | length > 0
        - blastwall_aap_openshift_kubeconfig_content | length > 0

    - name: Grant optional launch user execute access to Blastwall workflow
      awx.awx.role:
        users:
          - "{{ blastwall_aap_launch_user }}"
        role: execute
        lookup_organization: "{{ blastwall_aap_organization }}"
        workflows:
          - "{{ blastwall_aap_workflow }}"
          - "{{ blastwall_aap_policy_pipeline_workflow }}"
        state: present
      when: blastwall_aap_launch_user | length > 0

    - name: Report configured Blastwall AAP objects
      ansible.builtin.debug:
        msg:
          organization: "{{ blastwall_aap_organization }}"
          project: "{{ blastwall_aap_project }}"
          inventory: "{{ blastwall_aap_inventory }}"
          execution_environment: "{{ blastwall_aap_ee_name }}"
          image: "{{ blastwall_aap_ee_image }}"
          workflow: "{{ blastwall_aap_workflow }}"
          policy_pipeline_workflow: "{{ blastwall_aap_policy_pipeline_workflow }}"
