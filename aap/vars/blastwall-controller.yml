---
blastwall_aap_controller_host: >-
  {{ lookup('env', 'CONTROLLER_HOST') | default('', true) }}
blastwall_aap_controller_username: >-
  {{ lookup('env', 'CONTROLLER_USERNAME') | default('admin', true) }}
blastwall_aap_controller_password: >-
  {{ lookup('env', 'CONTROLLER_PASSWORD') | default('', true) }}
blastwall_aap_validate_certs: >-
  {{ (lookup('env', 'CONTROLLER_VERIFY_SSL') | default('false', true)) | bool }}

blastwall_aap_organization: Blastwall
blastwall_aap_project: Blastwall
blastwall_aap_project_url: >-
  {{ lookup('env', 'BLASTWALL_PROJECT_URL') |
  default('https://github.com/gprocunier/blastwall.git', true) }}
blastwall_aap_project_branch: >-
  {{ lookup('env', 'BLASTWALL_PROJECT_BRANCH') | default('main', true) }}

blastwall_aap_ee_name: Blastwall EE
blastwall_aap_ee_image: >-
  {{ lookup('env', 'BLASTWALL_EE_IMAGE') |
  default('registry.example.com/blastwall/blastwall-ee:0.5.0', true) }}
blastwall_aap_ee_pull: always

blastwall_aap_inventory: Blastwall IdM Inventory
blastwall_aap_inventory_source: Blastwall IdM Inventory Source
blastwall_aap_inventory_source_path: >-
  {{ lookup('env', 'BLASTWALL_INVENTORY_SOURCE_PATH') |
  default('inventory/blastwall-idm.yml', true) }}

blastwall_aap_idm_credential_type: Blastwall IdM Runtime
blastwall_aap_idm_credential: Blastwall IdM Runtime
blastwall_aap_policy_idm_credential: Blastwall Policy Maintainer IdM
blastwall_aap_idm_admin_credential: Blastwall IdM Admin
blastwall_aap_attestation_idm_credential: >-
  {{ lookup('env', 'BLASTWALL_ATTESTATION_IDM_CREDENTIAL') |
  default(blastwall_aap_idm_admin_credential, true) }}
blastwall_aap_machine_credential: svc-ansible-runner
blastwall_aap_policy_machine_credential: sysop policy maintainer ssh
blastwall_aap_registry_credential: Blastwall EE Registry
blastwall_aap_openshift_credential_type: Blastwall OpenShift Kubeconfig
blastwall_aap_openshift_credential: Blastwall OpenShift Admin
blastwall_aap_attestation_signer_credential_type: Blastwall Attestation Signer
blastwall_aap_attestation_signer_credential: Blastwall Attestation Signer
blastwall_aap_attestation_verifier_credential_type: Blastwall Attestation Verifier
blastwall_aap_attestation_verifier_credential: Blastwall Attestation Verifier

blastwall_aap_ipa_server: >-
  {{ lookup('env', 'IPA_SERVER') | default('', true) }}
blastwall_aap_ipa_domain: >-
  {{ lookup('env', 'IPA_DOMAIN') |
  default((blastwall_aap_ipa_server.split('.')[1:] | join('.')), true) }}
blastwall_aap_ipa_realm: >-
  {{ lookup('env', 'IPA_REALM') |
  default((blastwall_aap_ipa_domain | upper), true) }}
blastwall_aap_ipa_principal: >-
  {{ lookup('env', 'IPA_PRINCIPAL') | default('svc-ansible-runner', true) }}
blastwall_aap_ipa_password: >-
  {{ lookup('env', 'IPA_PASSWORD') |
  default(lookup('env', 'IPA_ADMIN_PASSWORD'), true) }}
blastwall_aap_ipa_keytab_file: >-
  {{ lookup('env', 'IPA_KEYTAB') | default('', true) }}
blastwall_aap_ipa_cert_file: >-
  {{ lookup('env', 'IPA_CERT') | default('/etc/ipa/ca.crt', true) }}
blastwall_aap_krb5_config_file: >-
  {{ lookup('env', 'KRB5_CONFIG') | default('/etc/krb5.conf', true) }}
blastwall_aap_identity: >-
  {{ lookup('env', 'BLASTWALL_IDENTITY') | default('svc-ansible-runner', true) }}
blastwall_aap_machine_password: >-
  {{ lookup('env', 'BLASTWALL_MACHINE_PASSWORD') |
  default(blastwall_aap_ipa_password, true) }}
blastwall_aap_policy_identity: >-
  {{ lookup('env', 'BLASTWALL_POLICY_IDENTITY') | default('sysop', true) }}
blastwall_aap_policy_password: >-
  {{ lookup('env', 'BLASTWALL_POLICY_PASSWORD') |
  default(blastwall_aap_ipa_password, true) }}
blastwall_aap_idm_admin_principal: >-
  {{ lookup('env', 'BLASTWALL_IDM_ADMIN_PRINCIPAL') | default('admin', true) }}
blastwall_aap_idm_admin_password: >-
  {{ lookup('env', 'BLASTWALL_IDM_ADMIN_PASSWORD') |
  default(blastwall_aap_ipa_password, true) }}
blastwall_aap_attestation_enabled: >-
  {{ lookup('env', 'BLASTWALL_AAP_ATTESTATION_ENABLED') | default('false', true) | bool }}
blastwall_aap_attestation_mode: >-
  {{ lookup('env', 'BLASTWALL_ATTESTATION_MODE') | default('reference-v2', true) }}
blastwall_aap_attestation_signer_key_file: >-
  {{ lookup('env', 'BLASTWALL_ATTESTATION_SIGNER_KEY_FILE') | default('', true) }}
blastwall_aap_attestation_signer_certificate_file: >-
  {{ lookup('env', 'BLASTWALL_ATTESTATION_SIGNER_CERTIFICATE_FILE') | default('', true) }}
blastwall_aap_attestation_ca_bundle_file: >-
  {{ lookup('env', 'BLASTWALL_ATTESTATION_CA_BUNDLE_FILE') | default('', true) }}
blastwall_aap_attestation_signer_allowlist: >-
  {{ lookup('env', 'BLASTWALL_ATTESTATION_SIGNER_ALLOWLIST') | default('', true) }}
blastwall_aap_attestation_vault_primary: >-
  {{ lookup('env', 'BLASTWALL_ATTESTATION_VAULT_PRIMARY') | default('', true) }}
blastwall_aap_attestation_vault_servers: >-
  {{ lookup('env', 'BLASTWALL_ATTESTATION_VAULT_SERVERS') | default('', true) }}
blastwall_aap_attestation_vault_scope: >-
  {{ lookup('env', 'BLASTWALL_ATTESTATION_VAULT_SCOPE') | default('service', true) }}
blastwall_aap_attestation_vault_owner: >-
  {{ lookup('env', 'BLASTWALL_ATTESTATION_VAULT_OWNER') | default('blastwall-attestation', true) }}
blastwall_aap_attestation_envelope_dir: >-
  {{ lookup('env', 'BLASTWALL_ATTESTATION_ENVELOPE_DIR') |
  default('/tmp/blastwall-attestations/envelopes', true) }}
blastwall_aap_attestation_index_dir: >-
  {{ lookup('env', 'BLASTWALL_ATTESTATION_INDEX_DIR') |
  default('/tmp/blastwall-attestations/indexes', true) }}
blastwall_aap_current_policy_sha256: >-
  {{ lookup('env', 'BLASTWALL_CURRENT_POLICY_SHA256') |
  default(lookup('env', 'BLASTWALL_POLICY_SHA256') | default('', true), true) }}
blastwall_aap_probe_report_sha256: >-
  {{ lookup('env', 'BLASTWALL_PROBE_REPORT_SHA256') | default('', true) }}
blastwall_aap_spo_evidence_json: >-
  {{ lookup('env', 'BLASTWALL_SPO_EVIDENCE_JSON') | default('', true) }}

blastwall_aap_launch_user: >-
  {{ lookup('env', 'BLASTWALL_AAP_LAUNCH_USER') | default('', true) }}
blastwall_aap_launch_password: >-
  {{ lookup('env', 'BLASTWALL_AAP_LAUNCH_PASSWORD') | default('', true) }}
blastwall_aap_launch_user_email: >-
  {{ lookup('env', 'BLASTWALL_AAP_LAUNCH_USER_EMAIL') |
  default(blastwall_aap_launch_user ~ '@example.com', true) }}

blastwall_aap_required_policy_profiles: >-
  {{ lookup('env', 'BLASTWALL_REQUIRED_POLICY_PROFILES') | default('', true) }}
blastwall_aap_allow_dry_run_profiles: >-
  {{ lookup('env', 'BLASTWALL_ALLOW_DRY_RUN_PROFILES') | default('false', true) }}
blastwall_aap_strange_socket_v1_dry_run: >-
  {{ lookup('env', 'BLASTWALL_STRANGE_SOCKET_V1_DRY_RUN') | default('', true) }}
blastwall_aap_spo_include_strange_socket_v1: >-
  {{ lookup('env', 'BLASTWALL_SPO_INCLUDE_STRANGE_SOCKET_V1') | default('false', true) }}
blastwall_aap_spo_validate_strange_socket_v1: >-
  {{ lookup('env', 'BLASTWALL_SPO_VALIDATE_STRANGE_SOCKET_V1') | default('false', true) }}
blastwall_aap_profile_extra_vars:
  BLASTWALL_REQUIRED_POLICY_PROFILES: "{{ blastwall_aap_required_policy_profiles }}"
  BLASTWALL_ALLOW_DRY_RUN_PROFILES: "{{ blastwall_aap_allow_dry_run_profiles }}"
  BLASTWALL_STRANGE_SOCKET_V1_DRY_RUN: "{{ blastwall_aap_strange_socket_v1_dry_run }}"
blastwall_aap_attestation_extra_vars:
  BLASTWALL_ATTESTATION_MODE: "{{ blastwall_aap_attestation_mode }}"
  BLASTWALL_CURRENT_POLICY_SHA256: "{{ blastwall_aap_current_policy_sha256 }}"
  BLASTWALL_PROBE_REPORT_SHA256: "{{ blastwall_aap_probe_report_sha256 }}"
  BLASTWALL_ATTESTATION_VAULT_PRIMARY: "{{ blastwall_aap_attestation_vault_primary }}"
  BLASTWALL_ATTESTATION_VAULT_SERVERS: "{{ blastwall_aap_attestation_vault_servers }}"
  BLASTWALL_ATTESTATION_VAULT_SCOPE: "{{ blastwall_aap_attestation_vault_scope }}"
  BLASTWALL_ATTESTATION_VAULT_OWNER: "{{ blastwall_aap_attestation_vault_owner }}"
  BLASTWALL_ATTESTATION_ENVELOPE_DIR: "{{ blastwall_aap_attestation_envelope_dir }}"
  BLASTWALL_ATTESTATION_INDEX_DIR: "{{ blastwall_aap_attestation_index_dir }}"
  BLASTWALL_SPO_EVIDENCE_JSON: "{{ blastwall_aap_spo_evidence_json }}"
  BLASTWALL_TARGET_IDENTITY: "{{ blastwall_aap_identity }}"
  blastwall_target_identity: "{{ blastwall_aap_identity }}"
blastwall_aap_spo_render_extra_vars:
  BLASTWALL_SPO_INCLUDE_STRANGE_SOCKET_V1: "{{ blastwall_aap_spo_include_strange_socket_v1 }}"
blastwall_aap_spo_apply_extra_vars:
  BLASTWALL_SPO_VALIDATE_STRANGE_SOCKET_V1: "{{ blastwall_aap_spo_validate_strange_socket_v1 }}"
blastwall_aap_inventory_source_vars:
  BLASTWALL_ALLOW_DRY_RUN_PROFILES: "{{ blastwall_aap_allow_dry_run_profiles }}"
  BLASTWALL_ATTESTATION_MODE: "{{ blastwall_aap_attestation_mode }}"

blastwall_aap_registry_host: >-
  {{ lookup('env', 'BLASTWALL_REGISTRY_HOST') |
  default('registry.example.com', true) }}
blastwall_aap_registry_username: >-
  {{ lookup('env', 'BLASTWALL_REGISTRY_USERNAME') | default('init', true) }}
blastwall_aap_registry_password: >-
  {{ lookup('env', 'BLASTWALL_REGISTRY_PASSWORD') | default('', true) }}
blastwall_aap_openshift_kubeconfig_file: >-
  {{ lookup('env', 'BLASTWALL_OPENSHIFT_KUBECONFIG') | default('', true) }}

blastwall_aap_job_templates:
  - name: Blastwall build policy RPM
    playbook: playbooks/build-policy-rpm.yml
    credentials:
      - "{{ blastwall_aap_policy_idm_credential }}"
      - "{{ blastwall_aap_policy_machine_credential }}"
    limit: "{{ blastwall_aap_policy_pipeline_candidate_group }}"
  - name: Blastwall render SPO policy CRs
    playbook: playbooks/render-spo-policy-crs.yml
    credentials: []
    limit: ""
    extra_vars: "{{ blastwall_aap_spo_render_extra_vars }}"
  - name: Blastwall apply and validate SPO policy CRs
    playbook: playbooks/apply-validate-spo-policy-crs.yml
    credentials: []
    limit: ""
    extra_vars: "{{ blastwall_aap_spo_apply_extra_vars }}"
  - name: Blastwall install candidate policy RPM
    playbook: playbooks/install-policy-rpm.yml
    credentials:
      - "{{ blastwall_aap_policy_idm_credential }}"
      - "{{ blastwall_aap_policy_machine_credential }}"
    limit: "{{ blastwall_aap_policy_pipeline_candidate_group }}"
    extra_vars: "{{ blastwall_aap_profile_extra_vars }}"
  - name: Blastwall promote policy marker
    playbook: playbooks/promote-policy-rpm.yml
    credentials:
      - "{{ blastwall_aap_idm_admin_credential }}"
    limit: "{{ blastwall_aap_policy_pipeline_candidate_group }}"
    extra_vars: "{{ blastwall_aap_profile_extra_vars }}"
  - name: Blastwall credential smoke
    playbook: playbooks/credential-smoke.yml
    credentials:
      - "{{ blastwall_aap_idm_credential }}"
    limit: ""
  - name: Blastwall preflight
    playbook: playbooks/preflight.yml
    credentials:
      - "{{ blastwall_aap_idm_credential }}"
    limit: ""
    extra_vars: "{{ blastwall_aap_profile_extra_vars }}"
  - name: Blastwall verify managed host
    playbook: playbooks/verify-managed-host.yml
    credentials:
      - "{{ blastwall_aap_idm_credential }}"
      - "{{ blastwall_aap_machine_credential }}"
    limit: ""
    extra_vars: "{{ blastwall_aap_profile_extra_vars }}"

blastwall_aap_v3_job_templates:
  - name: Blastwall attestation vault health
    playbook: playbooks/attestation-vault-health.yml
    credentials:
      - "{{ blastwall_aap_attestation_idm_credential }}"
      - "{{ blastwall_aap_attestation_verifier_credential }}"
    limit: ""
    extra_vars: "{{ blastwall_aap_attestation_extra_vars }}"
  - name: Blastwall sign attestation
    playbook: playbooks/sign-attestation.yml
    credentials:
      - "{{ blastwall_aap_attestation_idm_credential }}"
      - "{{ blastwall_aap_attestation_signer_credential }}"
    limit: "{{ blastwall_aap_policy_pipeline_candidate_group }}"
    extra_vars: "{{ blastwall_aap_profile_extra_vars | combine(blastwall_aap_attestation_extra_vars) }}"

blastwall_aap_workflow: Blastwall runtime verification
blastwall_aap_policy_pipeline_workflow: Blastwall policy pipeline
blastwall_aap_verify_target_group: >-
  {{ lookup('env', 'BLASTWALL_AAP_VERIFY_TARGET_GROUP') |
  default('blastwall_profile_base', true) }}
blastwall_aap_policy_pipeline_candidate_group: >-
  {{ lookup('env', 'BLASTWALL_POLICY_PIPELINE_CANDIDATE_GROUP') |
  default('blastwall_policy_stale', true) }}
blastwall_aap_profile_post_promotion_preflight_group: >-
  {{ lookup('env', 'BLASTWALL_POST_PROMOTION_PROFILE_GROUP') |
  default('blastwall_profile_base', true) }}
blastwall_aap_post_promotion_preflight_target_group: >-
  {{ lookup('env', 'BLASTWALL_POST_PROMOTION_PREFLIGHT_TARGET_GROUP') |
  default(blastwall_aap_profile_post_promotion_preflight_group, true) }}
