<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Blastwall IdM relationship diagram" width="1500" height="760" viewBox="0 0 1500 760">
  <defs>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.14"/>
    </filter>
    <filter id="paper">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.025"/></feComponentTransfer>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 13 7 L 1 13 z" fill="#ee0000"/>
    </marker>
    <style>
      .canvas { fill: #f7f7f7; }
      .grain { filter: url(#paper); opacity: 0.65; }
      .lane { fill: #f8f8f8; stroke: #d2d2d2; stroke-width: 1; }
      .lane-title { fill: #151515; font: 700 18px "Red Hat Display", "Red Hat Text", Arial, sans-serif; letter-spacing: 0; }
      .card { fill: #ffffff; stroke: #c7c7c7; stroke-width: 1.35; filter: url(#shadow); }
      .title { fill: #151515; font: 700 20px "Red Hat Display", "Red Hat Text", Arial, sans-serif; letter-spacing: 0; }
      .subtitle { fill: #151515; font: 400 14px "Red Hat Text", Arial, sans-serif; letter-spacing: 0; }
      .compact-title { font-size: 16px; }
      .compact-subtitle { font-size: 12px; }
      .connector { fill: none; stroke: #ee0000; stroke-width: 2.45; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect class="canvas" width="1500" height="760"/>
  <rect class="grain" width="1500" height="760"/>

  <rect class="lane" x="54" y="60" width="1392" height="230" rx="10"/>
  <text class="lane-title" x="82" y="94">Shared IdM Scope</text>
  <rect class="lane" x="54" y="302" width="1392" height="166" rx="10"/>
  <text class="lane-title" x="82" y="336">SSH Access And Login Mapping</text>
  <rect class="lane" x="54" y="496" width="1392" height="188" rx="10"/>
  <text class="lane-title" x="82" y="530">Sudo Root Task Policy</text>

  <g class="edges">
    <path class="connector" d="M 350 147 H 430"/>
    <path class="connector" d="M 350 227 H 430"/>
    <path class="connector" d="M 430 147 V 590"/>
    <path class="connector" d="M 430 294 H 645 V 330" marker-end="url(#arrow)"/>
    <path class="connector" d="M 430 590 H 500" marker-end="url(#arrow)"/>
    <path class="connector" d="M 350 380 H 500" marker-end="url(#arrow)"/>
    <path class="connector" d="M 780 380 H 890" marker-end="url(#arrow)"/>
    <path class="connector" d="M 1170 380 H 1200" marker-end="url(#arrow)"/>
    <path class="connector" d="M 780 590 H 890" marker-end="url(#arrow)"/>
    <path class="connector" d="M 1170 590 H 1200" marker-end="url(#arrow)"/>
  </g>


