<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ansible lab flow Red Hat styled diagram" width="1280" height="490" viewBox="0 0 1280 490">
  <defs>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.14"/></filter>
    <filter id="paper"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 0.025"/></feComponentTransfer></filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 13 7 L 1 13 z" fill="#ee0000"/></marker>
    <style>.canvas{fill:#f7f7f7}.grain{filter:url(#paper);opacity:.65}.lane rect{fill:#fafafa;stroke:#c7c7c7;stroke-width:1.4;filter:url(#shadow)}.lane-title{fill:#151515;font:700 22px "Red Hat Display","Red Hat Text",Arial,sans-serif;text-anchor:middle}.card{fill:#fff;stroke:#c7c7c7;stroke-width:1.35;filter:url(#shadow)}.title{fill:#151515;font:700 17px "Red Hat Display","Red Hat Text",Arial,sans-serif}.subtitle{fill:#151515;font:400 13px "Red Hat Text",Arial,sans-serif}.connector{fill:none;stroke:#ee0000;stroke-width:2.45;stroke-linecap:round;stroke-linejoin:round}.chip rect{fill:#f7f7f7;stroke:#ee0000;stroke-width:1.1}.chip text{fill:#be0000;font:600 12.4px "Red Hat Text",Arial,sans-serif;text-anchor:middle}.icon{fill:none;stroke:#ee0000;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}</style>
  </defs>
  <rect class="canvas" width="1280" height="490"/><rect class="grain" width="1280" height="490"/>
  <g class="lane"><rect x="42" y="54" width="1196" height="370" rx="14"/><text class="lane-title" x="640" y="92">Ansible lab replay flow</text></g>
  <g class="edges"><path class="connector" d="M 268 180 H 340" marker-end="url(#arrow)"/><path class="connector" d="M 536 180 H 608" marker-end="url(#arrow)"/><path class="connector" d="M 804 180 H 876" marker-end="url(#arrow)"/><path class="connector" d="M 1072 180 H 1120 V 306" marker-end="url(#arrow)"/></g>
  <g class="node"><rect class="card" x="72" y="130" width="196" height="100" rx="8"/><g class="icon" transform="translate(94 159)"><ellipse cx="17" cy="8" rx="17" ry="7"/><path d="M 0 8 V 28 C 0 32 8 36 17 36 C 26 36 34 32 34 28 V 8"/></g><text class="title" x="150" y="165">Build IdM</text><text class="title" x="150" y="186">boundary</text><text class="subtitle" x="150" y="207">identity + access</text></g>
  <g class="node"><rect class="card" x="340" y="130" width="196" height="100" rx="8"/><g class="icon" transform="translate(362 158)"><rect x="0" y="0" width="34" height="34" rx="4"/><path d="M 8 10 H 26"/><path d="M 8 18 H 22"/><path d="M 8 26 H 26"/></g><text class="title" x="418" y="165">Run read</text><text class="title" x="418" y="186">side gate</text><text class="subtitle" x="418" y="207">eigenstate.ipa</text></g>
  <g class="node"><rect class="card" x="608" y="130" width="196" height="100" rx="8"/><g class="icon" transform="translate(630 158)"><path d="M 16 0 L 32 8 V 20 C 32 29 25 36 16 40 C 7 36 0 29 0 20 V 8 Z"/></g><text class="title" x="686" y="165">Deploy and</text><text class="title" x="686" y="186">test host</text><text class="subtitle" x="686" y="207">policy RPM</text><text class="subtitle" x="686" y="223">plus probes</text></g>
  <g class="node"><rect class="card" x="876" y="130" width="196" height="100" rx="8"/><g class="icon" transform="translate(898 158)"><circle cx="17" cy="17" r="16"/><path d="M 7 7 L 27 27"/></g><text class="title" x="954" y="165">Direct SSH</text><text class="title" x="954" y="186">probes</text><text class="subtitle" x="954" y="207">GSSAPI identity</text></g>
  <g class="node"><rect class="card" x="876" y="306" width="338" height="78" rx="8"/><g class="icon" transform="translate(902 328)"><rect x="0" y="0" width="34" height="34" rx="4"/><path d="M 8 10 H 26"/><path d="M 8 18 H 22"/><path d="M 8 26 H 26"/></g><text class="title" x="962" y="351">Audit and self-protection</text></g>
  <g class="chip"><rect x="111" y="258" width="118" height="28" rx="5"/><text x="170" y="277.5">IdM state</text></g><g class="chip"><rect x="379" y="258" width="118" height="28" rx="5"/><text x="438" y="277.5">suitability</text></g><g class="chip"><rect x="647" y="258" width="118" height="28" rx="5"/><text x="706" y="277.5">runtime</text></g><g class="chip"><rect x="915" y="258" width="118" height="28" rx="5"/><text x="974" y="277.5">host proof</text></g>
</svg>
