<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="day2-calabi-runner-boundary Red Hat styled diagram" width="1280" height="430" viewBox="0 0 1280 430">
  <defs>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.14"/>
    </filter>
    <filter id="paper">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.025"/></feComponentTransfer>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 13 7 L 1 13 z" fill="#ee0000"/>
    </marker>
    <style>
      .canvas { fill: #f7f7f7; }
      .grain { filter: url(#paper); opacity: 0.65; }
      .lane rect { fill: #fafafa; stroke: #c7c7c7; stroke-width: 1.4; filter: url(#shadow); }
      .lane-title { fill: #151515; font: 700 22px "Red Hat Display", "Red Hat Text", Arial, sans-serif; text-anchor: middle; letter-spacing: 0; }
      .card { fill: #ffffff; stroke: #c7c7c7; stroke-width: 1.35; filter: url(#shadow); }
      .title { fill: #151515; font: 700 18px "Red Hat Display", "Red Hat Text", Arial, sans-serif; letter-spacing: 0; }
      .subtitle { fill: #151515; font: 400 14px "Red Hat Text", Arial, sans-serif; letter-spacing: 0; }
      .connector { fill: none; stroke: #ee0000; stroke-width: 2.45; stroke-linecap: round; stroke-linejoin: round; }
      .connector.dashed { stroke-dasharray: 8 8; }
      .chip rect { fill: #f7f7f7; stroke: #ee0000; stroke-width: 1.1; }
      .chip text { fill: #be0000; font: 600 13px "Red Hat Text", Arial, sans-serif; text-anchor: middle; letter-spacing: 0; }
      .icon { fill: none; stroke: #ee0000; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect class="canvas" width="1280" height="430"/>
  <rect class="grain" width="1280" height="430"/>

  <g class="lane">
    <rect x="42" y="54" width="1196" height="324" rx="14"/>
    <text class="lane-title" x="640" y="92">Calabi runner proof boundary</text>
  </g>

  <g class="edges">
    <path class="connector" d="M 310 168 H 370" marker-end="url(#arrow)"/>
    <path class="connector" d="M 610 168 H 670" marker-end="url(#arrow)"/>
    <path class="connector" d="M 910 168 H 970" marker-end="url(#arrow)"/>
    <path class="connector dashed" d="M 1090 264 V 316 H 490 V 216" marker-end="url(#arrow)"/>
    <g class="chip"><rect x="742" y="302" width="136" height="28" rx="5"/><text x="810" y="321.5">next-run input</text></g>
  </g>

  <g class="node">
    <rect class="card" x="70" y="120" width="240" height="96" rx="8"/>
    <g class="icon" transform="translate(94 149)"><circle cx="17" cy="17" r="16"/><path d="M 12 10 L 24 17 L 12 24 Z"/></g>
    <text class="title" x="154" y="157">GitHub dispatch</text>
    <text class="subtitle" x="154" y="178">lab runner launches</text>
    <text class="subtitle" x="154" y="196">the workflow</text>
  </g>
  <g class="node">
    <rect class="card" x="370" y="120" width="240" height="96" rx="8"/>
    <g class="icon" transform="translate(394 149)"><rect x="0" y="4" width="34" height="26" rx="4"/><path d="M 8 13 H 26"/><path d="M 8 21 H 22"/></g>
    <text class="title" x="454" y="157">AAP Controller</text>
    <text class="subtitle" x="454" y="178">policy workflow</text>
  </g>
  <g class="node">
    <rect class="card" x="670" y="120" width="240" height="96" rx="8"/>
    <g class="icon" transform="translate(694 149)"><path d="M 5 18 L 13 26 L 30 8"/><circle cx="17" cy="17" r="16"/></g>
    <text class="title" x="754" y="157">Lab proof</text>
    <text class="subtitle" x="754" y="178">install, verify,</text>
    <text class="subtitle" x="754" y="196">collect logs</text>
  </g>
  <g class="node">
    <rect class="card" x="970" y="120" width="240" height="144" rx="8"/>
    <g class="icon" transform="translate(994 161)"><path d="M 16 2 L 32 10 V 22 C 32 30 25 36 16 40 C 7 36 0 30 0 22 V 10 Z"/></g>
    <text class="title" x="1054" y="157">IdM marker</text>
    <text class="title" x="1054" y="178">+ inventory</text>
    <text class="subtitle" x="1054" y="200">verified state</text>
    <text class="subtitle" x="1054" y="218">gates future</text>
    <text class="subtitle" x="1054" y="236">automation runs</text>
  </g>
</svg>
