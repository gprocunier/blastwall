apiVersion: apps/v1
kind: Deployment
metadata:
  name: blastwall-nested-demo
  namespace: blastwall-workloads
  labels:
    app.kubernetes.io/name: blastwall-nested-demo
    blastwall.io/profile: openshift-spo
    blastwall.io/workload-class: blastwall-nested
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: blastwall-nested-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: blastwall-nested-demo
        blastwall.io/profile: openshift-spo
        blastwall.io/workload-class: blastwall-nested
      annotations:
        openshift.io/required-scc: blastwall-nested
    spec:
      # This is the explicit exception class for workloads that need pod-level
      # user namespace behavior, such as rootless build or nested-container
      # workflows. It should not be used as a general-purpose escape hatch.
      hostUsers: false
      serviceAccountName: blastwall-nested-runner
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: demo
          image: registry.access.redhat.com/ubi9/python-312:latest
          command:
            - /bin/bash
            - -lc
            - sleep infinity
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      nodeSelector:
        node-role.kubernetes.io/worker: ""
      tolerations:
        - key: node-role.kubernetes.io/worker
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/infra
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
