apiVersion: v1
kind: ServiceAccount
metadata:
  name: blastwall-strange-runner
  namespace: blastwall-workloads
  labels:
    app.kubernetes.io/name: blastwall
    app.kubernetes.io/component: validation
    blastwall.io/profile: openshift-spo
    blastwall.io/workload-class: blastwall-strange
    blastwall.io/policy-profile: strange-socket-v1
  annotations:
    blastwall.io/source: openshift/spo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: use-blastwall-strange-scc
  namespace: blastwall-workloads
  labels:
    app.kubernetes.io/name: blastwall
    app.kubernetes.io/component: workload-binding
    blastwall.io/profile: openshift-spo
    blastwall.io/workload-class: blastwall-strange
    blastwall.io/policy-profile: strange-socket-v1
  annotations:
    blastwall.io/source: openshift/spo
rules:
  - apiGroups:
      - security.openshift.io
    resources:
      - securitycontextconstraints
    resourceNames:
      - blastwall-strange
    verbs:
      - use
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: blastwall-strange-runner-uses-strange-scc
  namespace: blastwall-workloads
  labels:
    app.kubernetes.io/name: blastwall
    app.kubernetes.io/component: workload-binding
    blastwall.io/profile: openshift-spo
    blastwall.io/workload-class: blastwall-strange
    blastwall.io/policy-profile: strange-socket-v1
  annotations:
    blastwall.io/source: openshift/spo
subjects:
  - kind: ServiceAccount
    name: blastwall-strange-runner
    namespace: blastwall-workloads
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: use-blastwall-strange-scc
---
