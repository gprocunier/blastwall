apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: blastwall-confined
  labels:
    app.kubernetes.io/name: blastwall
    app.kubernetes.io/component: workload-binding
    blastwall.io/profile: openshift-spo
  annotations:
    kubernetes.io/description: >-
      Runs selected workloads under the Security Profiles Operator SELinux type
      discovered from RawSelinuxProfile status.usage while preserving OpenShift
      namespace MCS categories.
    blastwall.io/policy-version: "0.6.1"
    blastwall.io/policy-release: "0.rc1"
    blastwall.io/policy-nevra: blastwall-selinux-0.6.1-0.rc1
    blastwall.io/source: openshift/spo
allowHostDirVolumePlugin: false
allowHostIPC: false
allowHostNetwork: false
allowHostPID: false
allowHostPorts: false
allowPrivilegeEscalation: false
allowPrivilegedContainer: false
allowedCapabilities: []
defaultAddCapabilities: []
fsGroup:
  type: MustRunAs
groups: []
priority: null
readOnlyRootFilesystem: false
requiredDropCapabilities:
  - ALL
runAsUser:
  type: MustRunAsRange
seLinuxContext:
  type: MustRunAs
  seLinuxOptions:
    type: __BLASTWALL_SPO_STANDARD_SELINUX_TYPE__
seccompProfiles:
  - runtime/default
supplementalGroups:
  type: RunAsAny
users: []
volumes:
  - configMap
  - downwardAPI
  - emptyDir
  - projected
  - secret
---
apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: blastwall-nested
  labels:
    app.kubernetes.io/name: blastwall
    app.kubernetes.io/component: workload-binding
    blastwall.io/profile: openshift-spo
    blastwall.io/workload-class: blastwall-nested
  annotations:
    kubernetes.io/description: >-
      Runs selected nested workloads under the Security Profiles Operator
      SELinux type discovered from RawSelinuxProfile status.usage with pod-level
      user namespace behavior. UID and group strategy fields are RunAsAny
      because they are interpreted inside the pod user namespace.
    blastwall.io/policy-version: "0.6.1"
    blastwall.io/policy-release: "0.rc1"
    blastwall.io/policy-nevra: blastwall-selinux-0.6.1-0.rc1
    blastwall.io/source: openshift/spo
allowHostDirVolumePlugin: false
allowHostIPC: false
allowHostNetwork: false
allowHostPID: false
allowHostPorts: false
allowPrivilegeEscalation: false
allowPrivilegedContainer: false
allowedCapabilities: []
defaultAddCapabilities: []
fsGroup:
  type: RunAsAny
groups: []
priority: null
readOnlyRootFilesystem: false
requiredDropCapabilities:
  - ALL
runAsUser:
  type: RunAsAny
seLinuxContext:
  type: MustRunAs
  seLinuxOptions:
    type: __BLASTWALL_SPO_NESTED_SELINUX_TYPE__
seccompProfiles:
  - runtime/default
supplementalGroups:
  type: RunAsAny
userNamespaceLevel: RequirePodLevel
users: []
volumes:
  - configMap
  - downwardAPI
  - emptyDir
  - projected
  - secret
