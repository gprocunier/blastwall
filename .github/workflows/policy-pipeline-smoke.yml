name: policy-pipeline-smoke

on:
  workflow_dispatch:
    inputs:
      workflow_template:
        description: AAP policy pipeline workflow template id or name
        required: false
        default: "Blastwall policy pipeline"
      policy_version:
        description: Candidate Blastwall policy version
        required: false
        default: "0.5.2"
      policy_release:
        description: Candidate Blastwall policy release
        required: false
        default: "1"
      check_spo_apply_validate:
        description: Require the apply_validate_spo_policy_crs node and evidence
        required: false
        default: "false"

jobs:
  aap-policy-pipeline-smoke:
    runs-on:
      - self-hosted
      - blastwall-lab
    env:
      TOWER_HOST: ${{ secrets.BLASTWALL_AAP_CONTROLLER_URL }}
      TOWER_USERNAME: ${{ secrets.BLASTWALL_AAP_USERNAME }}
      TOWER_PASSWORD: ${{ secrets.BLASTWALL_AAP_PASSWORD }}
      TOWER_VERIFY_SSL: "false"
      SPO_APPLY_VALIDATE: ${{ inputs.check_spo_apply_validate }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require lab tools and AAP credentials
        shell: bash
        run: |
          set -euo pipefail
          command -v awx
          command -v jq
          test -n "${TOWER_HOST}"
          test -n "${TOWER_USERNAME}"
          test -n "${TOWER_PASSWORD}"

      - name: Launch Blastwall policy pipeline
        shell: bash
        run: |
          set -euo pipefail
          awx workflow_job_templates launch "${{ inputs.workflow_template }}" \
            --extra_vars "{\"BLASTWALL_POLICY_VERSION\":\"${{ inputs.policy_version }}\",\"BLASTWALL_POLICY_RELEASE\":\"${{ inputs.policy_release }}\"}" \
            -f json |
            tee /tmp/blastwall-policy-pipeline-launch.json |
            jq '{workflow_job, status, launched_by: .launched_by.name}'

          workflow_id="$(jq -r '.workflow_job' /tmp/blastwall-policy-pipeline-launch.json)"
          awx workflow_jobs monitor "${workflow_id}"

          awx workflow_job_nodes list --workflow_job "${workflow_id}" -f json |
            tee /tmp/blastwall-policy-pipeline-nodes.json |
            jq -r '.results[] | [.identifier, .summary_fields.job.id, .summary_fields.job.type, .summary_fields.job.status] | @tsv'

      - name: Assert policy pipeline nodes succeeded
        shell: bash
        run: |
          set -euo pipefail

          require_apply="${SPO_APPLY_VALIDATE:-false}"
          expected_nodes=(
            "policy_project_sync"
            "policy_inventory_sync"
            "build_policy_rpm"
            "render_spo_policy_crs"
            "install_candidate_policy_rpm"
            "verify_candidate_host"
            "promote_policy_marker"
            "post_promotion_inventory_sync"
            "post_promotion_preflight"
          )

          if [[ "${require_apply}" == "true" ]]; then
            expected_nodes+=("apply_validate_spo_policy_crs")
          fi

          jq -r '.results[] | select(.summary_fields.job.status == "successful") | .identifier' /tmp/blastwall-policy-pipeline-nodes.json |
            sort -u > /tmp/blastwall-policy-pipeline-successful-nodes.txt

          for expected_node in "${expected_nodes[@]}"; do
            if ! grep -Fqx "${expected_node}" /tmp/blastwall-policy-pipeline-successful-nodes.txt; then
              echo "Missing successful workflow node: ${expected_node}"
              echo "Successful nodes:"
              cat /tmp/blastwall-policy-pipeline-successful-nodes.txt
              exit 1
            fi
          done

      - name: Assert policy pipeline evidence
        shell: bash
        run: |
          set -euo pipefail
          build_id="$(jq -r '.results[] | select(.identifier == "build_policy_rpm") | .summary_fields.job.id' /tmp/blastwall-policy-pipeline-nodes.json)"
          render_spo_id="$(jq -r '.results[] | select(.identifier == "render_spo_policy_crs") | .summary_fields.job.id' /tmp/blastwall-policy-pipeline-nodes.json)"
          install_id="$(jq -r '.results[] | select(.identifier == "install_candidate_policy_rpm") | .summary_fields.job.id' /tmp/blastwall-policy-pipeline-nodes.json)"
          verify_id="$(jq -r '.results[] | select(.identifier == "verify_candidate_host") | .summary_fields.job.id' /tmp/blastwall-policy-pipeline-nodes.json)"
          promote_id="$(jq -r '.results[] | select(.identifier == "promote_policy_marker") | .summary_fields.job.id' /tmp/blastwall-policy-pipeline-nodes.json)"
          preflight_id="$(jq -r '.results[] | select(.identifier == "post_promotion_preflight") | .summary_fields.job.id' /tmp/blastwall-policy-pipeline-nodes.json)"

          awx jobs stdout "${build_id}" | tee /tmp/blastwall-policy-pipeline-build.log
          grep -F 'policy_pipeline_build' /tmp/blastwall-policy-pipeline-build.log
          grep -F 'blastwall-selinux-${{ inputs.policy_version }}-${{ inputs.policy_release }}' /tmp/blastwall-policy-pipeline-build.log

          awx jobs stdout "${render_spo_id}" | tee /tmp/blastwall-policy-pipeline-render-spo.log
          grep -F 'spo_policy_crs_render' /tmp/blastwall-policy-pipeline-render-spo.log
          grep -F 'policy_nevra' /tmp/blastwall-policy-pipeline-render-spo.log
          grep -F 'blastwall-spo-crs.yaml' /tmp/blastwall-policy-pipeline-render-spo.log
          grep -F 'blastwall_spo_bundle_yaml' /tmp/blastwall-policy-pipeline-render-spo.log
          grep -F 'blastwall_spo_bundle_path' /tmp/blastwall-policy-pipeline-render-spo.log
          grep -F 'blastwall_spo_bundle_sha256' /tmp/blastwall-policy-pipeline-render-spo.log
          grep -F 'RawSelinuxProfile' /tmp/blastwall-policy-pipeline-render-spo.log
          grep -F 'spo_profiles' /tmp/blastwall-policy-pipeline-render-spo.log
          grep -F 'blastwall' /tmp/blastwall-policy-pipeline-render-spo.log
          grep -F 'blastwall-nested' /tmp/blastwall-policy-pipeline-render-spo.log
          grep -F 'spo_profile_resources' /tmp/blastwall-policy-pipeline-render-spo.log
          grep -F 'blastwallnested' /tmp/blastwall-policy-pipeline-render-spo.log
          grep -F 'spo_sccs' /tmp/blastwall-policy-pipeline-render-spo.log
          grep -F 'blastwall-confined' /tmp/blastwall-policy-pipeline-render-spo.log
          grep -F 'blastwall-nested' /tmp/blastwall-policy-pipeline-render-spo.log
          awx jobs get "${render_spo_id}" -f json |
            tee /tmp/blastwall-policy-pipeline-render-spo-job.json |
            jq -e '
              .artifacts.blastwall_spo_bundle_yaml
              and .artifacts.blastwall_spo_bundle_path
              and .artifacts.blastwall_spo_bundle_sha256
              and .artifacts.policy_nevra
              and (.artifacts.policy_nevra == "blastwall-selinux-${{ inputs.policy_version }}-${{ inputs.policy_release }}")
            '

          if [[ "${SPO_APPLY_VALIDATE:-false}" == "true" ]]; then
            apply_spo_id="$(jq -r '.results[] | select(.identifier == "apply_validate_spo_policy_crs") | .summary_fields.job.id' /tmp/blastwall-policy-pipeline-nodes.json)"

            if [[ -z "${apply_spo_id}" || "${apply_spo_id}" == "null" ]]; then
              echo "Expected apply_validate_spo_policy_crs node is missing from workflow execution"
              exit 1
            fi

            awx jobs stdout "${apply_spo_id}" | tee /tmp/blastwall-policy-pipeline-apply-spo.log
            grep -F 'spo_policy_apply_validate' /tmp/blastwall-policy-pipeline-apply-spo.log
            grep -F 'spo_policy_bundle_sha256' /tmp/blastwall-policy-pipeline-apply-spo.log
            grep -F 'standard_profile: passed' /tmp/blastwall-policy-pipeline-apply-spo.log
            grep -F 'nested_profile: passed' /tmp/blastwall-policy-pipeline-apply-spo.log
          else
            echo "Skipping apply_validate_spo_policy_crs assertions: not requested"
          fi

          awx jobs stdout "${install_id}" | tee /tmp/blastwall-policy-pipeline-install.log
          grep -F 'policy_pipeline_install' /tmp/blastwall-policy-pipeline-install.log
          grep -F 'blastwall-selinux-${{ inputs.policy_version }}-${{ inputs.policy_release }}' /tmp/blastwall-policy-pipeline-install.log

          awx jobs stdout "${verify_id}" | tee /tmp/blastwall-policy-pipeline-verify.log
          grep -F 'blastwall_u:blastwall_r:blastwall_t:s0' /tmp/blastwall-policy-pipeline-verify.log
          grep -E 'SKIP: could not create AF_ALG socket|BLOCKED:' /tmp/blastwall-policy-pipeline-verify.log
          grep -F 'Dirty Frag NETLINK_XFRM' /tmp/blastwall-policy-pipeline-verify.log
          grep -F 'Dirty Frag AF_RXRPC' /tmp/blastwall-policy-pipeline-verify.log

          awx jobs stdout "${promote_id}" | tee /tmp/blastwall-policy-pipeline-promote.log
          grep -F 'policy_pipeline_promotion' /tmp/blastwall-policy-pipeline-promote.log
          grep -F 'bw_rpm=blastwall-selinux-${{ inputs.policy_version }}-${{ inputs.policy_release }}' /tmp/blastwall-policy-pipeline-promote.log

          awx jobs stdout "${preflight_id}" | tee /tmp/blastwall-policy-pipeline-preflight.log
          grep -E 'All assertions passed|selected_hosts|candidate_hosts' /tmp/blastwall-policy-pipeline-preflight.log
