---
- name: Deploy Blastwall SELinux policy and publish host marker
  hosts: all
  become: true
  gather_facts: false
  vars:
    ipa_server: "{{ lookup('env', 'IPA_SERVER') | default('', true) }}"
    ipa_domain: >-
      {{ lookup('env', 'IPA_DOMAIN') |
      default((ipa_server.split('.')[1:] | join('.')), true) }}
    ipa_basedn: >-
      dc={{ ipa_domain | replace('.', ',dc=') }}
    ipa_principal: "{{ lookup('env', 'IPA_PRINCIPAL') }}"
    ipa_realm: >-
      {{ lookup('env', 'IPA_REALM') |
      default((ipa_domain | upper), true) }}
    ipa_login_principal: >-
      {{ ipa_principal if '@' in ipa_principal else ipa_principal ~ '@' ~ ipa_realm }}
    ipa_password: >-
      {{ lookup('env', 'IPA_PASSWORD') |
      default(lookup('env', 'IPA_ADMIN_PASSWORD'), true) }}
    ipa_keytab: "{{ lookup('env', 'IPA_KEYTAB') | default('', true) }}"
    krb5_config: "{{ lookup('env', 'KRB5_CONFIG') | default('', true) }}"
    krb5_ccache: FILE:/tmp/blastwall_krb5cc
    blastwall_policy_rpm: blastwall-selinux-0.5.2-1
    blastwall_project_dir: /opt/blastwall
    blastwall_policy_dir: "{{ blastwall_project_dir }}/policy"
    blastwall_selinux_type: targeted
    blastwall_selinux_user: blastwall_u
    blastwall_selinux_role: blastwall_r
    blastwall_selinux_range: s0
    blastwall_update_idm_marker: true
    blastwall_deploy_rollback_on_failure: true
    blastwall_deploy_force_cleanup_on_failure: false
    blastwall_policy_marker_rpm_sha256: >-
      {{ blastwall_policy_rpm_sha256 | default(lookup('env', 'BLASTWALL_POLICY_RPM_SHA256') | default('', true), true) }}
    blastwall_existing_userclass_values: >-
      {{
        idm_userclass
        if (idm_userclass is defined and idm_userclass is not string)
        else ([idm_userclass] if (idm_userclass is defined and idm_userclass | length > 0) else [])
      }}
    blastwall_existing_description: "{{ idm_description | default('') }}"
    blastwall_clear_legacy_description_marker: true
    blastwall_clear_description_marker: >-
      {{
        blastwall_clear_legacy_description_marker | bool and
        blastwall_existing_description is match('^(bw_|blastwall:)')
      }}
    blastwall_preserved_userclass_values: >-
      {{
        blastwall_existing_userclass_values
        | reject('match', '^blastwall:')
        | list
      }}
    blastwall_policy_modules:
      - blastwall
      - blastwall-sshd-login
      - blastwall-alg-socket-deny
      - blastwall-bpf-deny
      - blastwall-policy-selfprotect
      - blastwall-packet-socket-deny
      - blastwall-userns-deny
      - blastwall-io-uring-deny
      - blastwall-xfrm-deny
      - blastwall-rxrpc-deny
    blastwall_policy_marker: >-
      blastwall:state=active;rpm={{ blastwall_policy_rpm }};rpm_sha256={{ blastwall_policy_marker_rpm_sha256 }};alg=deny;bpf=deny;self=deny;pkt=deny;userns=deny;iou=deny;xfrm=deny;rxrpc=deny
    blastwall_policy_failed_marker: >-
      blastwall:state=failed;rpm={{ blastwall_policy_rpm }};rpm_sha256={{ blastwall_policy_marker_rpm_sha256 | default('unknown', true) }}
    blastwall_policy_userclass_values: >-
      {{ blastwall_preserved_userclass_values + [blastwall_policy_marker] }}
    blastwall_policy_failed_userclass_values: >-
      {{ blastwall_preserved_userclass_values + [blastwall_policy_failed_marker] }}
  tasks:
    - name: Require Kerberos inputs for target SSH
      ansible.builtin.assert:
        that:
          - ipa_principal | length > 0
          - ipa_realm | length > 0 or '@' in ipa_principal
          - ipa_keytab | length > 0 or ipa_password | length > 0
          - not blastwall_update_idm_marker | bool or ipa_server | length > 0
          - not blastwall_update_idm_marker | bool or ipa_domain | length > 0
          - not blastwall_update_idm_marker | bool or ipa_password | length > 0
          - not blastwall_update_idm_marker | bool or blastwall_policy_marker_rpm_sha256 is match('^[0-9a-f]{64}$')
        fail_msg: >-
          Set IPA_PRINCIPAL, IPA_REALM, and either IPA_KEYTAB or IPA_PASSWORD for
          GSSAPI target SSH. Marker updates also require IPA_SERVER, IPA_DOMAIN,
          IPA_PASSWORD, and a 64-character BLASTWALL_POLICY_RPM_SHA256 value for
          the FreeIPA module.
      run_once: true
      delegate_to: localhost
      become: false

    - name: Authenticate automation identity for GSSAPI target SSH
      ansible.builtin.shell: |
        set -euo pipefail
        if [ -n "${IPA_KEYTAB}" ]; then
          kinit -k -t "${IPA_KEYTAB}" "${IPA_LOGIN_PRINCIPAL}"
        else
          printf '%s\n' "${IPA_PASSWORD}" | kinit "${IPA_LOGIN_PRINCIPAL}"
        fi
      args:
        executable: /bin/bash
      environment:
        IPA_LOGIN_PRINCIPAL: "{{ ipa_login_principal }}"
        IPA_PASSWORD: "{{ ipa_password }}"
        IPA_KEYTAB: "{{ ipa_keytab }}"
        KRB5_CONFIG: "{{ krb5_config }}"
        KRB5CCNAME: "{{ krb5_ccache }}"
      changed_when: false
      no_log: true
      run_once: true
      delegate_to: localhost
      become: false

    - name: Write FreeIPA client config for host marker updates
      ansible.builtin.copy:
        dest: /etc/ipa/default.conf
        mode: "0644"
        content: |
          [global]
          server = {{ ipa_server }}
          domain = {{ ipa_domain }}
          realm = {{ ipa_realm }}
          basedn = {{ ipa_basedn }}
          xmlrpc_uri = https://{{ ipa_server }}/ipa/xml
      run_once: true
      delegate_to: localhost
      become: false
      when: blastwall_update_idm_marker | bool

    - name: Install and validate Blastwall policy
      block:
        - name: Install SELinux policy build dependencies
          ansible.builtin.dnf:
            name:
              - make
              - checkpolicy
              - selinux-policy-devel
              - policycoreutils-python-utils
            state: present

        - name: Check SELinux policy development Makefile
          ansible.builtin.stat:
            path: /usr/share/selinux/devel/Makefile
          register: blastwall_selinux_devel_makefile

        - name: Capture pre-existing SELinux policy modules
          ansible.builtin.command:
            argv:
              - semodule
              - -l
          register: blastwall_preexisting_modules
          changed_when: false

        - name: Store pre-existing SELinux policy module names
          ansible.builtin.set_fact:
            blastwall_preexisting_module_names: >-
              {{
                blastwall_preexisting_modules.stdout_lines
                | map('split')
                | map('first')
                | list
              }}

        - name: Check pre-existing Blastwall login context
          ansible.builtin.stat:
            path: >-
              /etc/selinux/{{ blastwall_selinux_type }}/contexts/users/{{ blastwall_selinux_user }}
          register: blastwall_preexisting_login_context

        - name: Backup pre-existing Blastwall login context
          ansible.builtin.slurp:
            src: >-
              /etc/selinux/{{ blastwall_selinux_type }}/contexts/users/{{ blastwall_selinux_user }}
          register: blastwall_preexisting_login_context_content
          when: blastwall_preexisting_login_context.stat.exists | default(false)

        - name: Assert host can build and install local SELinux policy
          ansible.builtin.assert:
            that:
              - blastwall_selinux_devel_makefile.stat.exists
            fail_msg: >-
              Missing selinux-policy-devel
              (/usr/share/selinux/devel/Makefile).

        - name: Create Blastwall project directory
          ansible.builtin.file:
            path: "{{ blastwall_project_dir }}"
            state: directory
            owner: root
            group: root
            mode: "0755"

        - name: Copy Blastwall policy source to target
          ansible.builtin.copy:
            src: "{{ playbook_dir }}/../policy/"
            dest: "{{ blastwall_policy_dir }}/"
            owner: root
            group: root
            mode: preserve

        - name: Install Blastwall policy modules
          community.general.make:
            chdir: "{{ blastwall_policy_dir }}"
            target: install

        - name: Install Blastwall SELinux login context
          ansible.builtin.copy:
            src: "{{ blastwall_policy_dir }}/contexts/{{ blastwall_selinux_user }}"
            dest: >-
              /etc/selinux/{{ blastwall_selinux_type }}/contexts/users/{{ blastwall_selinux_user }}
            owner: root
            group: root
            mode: "0644"
            remote_src: true

        - name: Register Blastwall SELinux user
          ansible.builtin.command:
            argv:
              - semanage
              - user
              - -l
          register: blastwall_selinux_users_before
          changed_when: false

        - name: Parse existing SELinux user names
          ansible.builtin.set_fact:
            blastwall_selinux_user_names: >-
              {{
                blastwall_selinux_users_before.stdout_lines
                | map('trim')
                | reject('equalto', '')
                | map('split')
                | map('first')
                | list
              }}

        - name: Update existing Blastwall SELinux user
          ansible.builtin.command:
            argv:
              - semanage
              - user
              - -m
              - -R
              - "{{ blastwall_selinux_role }}"
              - -r
              - "{{ blastwall_selinux_range }}"
              - "{{ blastwall_selinux_user }}"
          changed_when: true
          when: blastwall_selinux_user in blastwall_selinux_user_names

        - name: Add Blastwall SELinux user
          ansible.builtin.command:
            argv:
              - semanage
              - user
              - -a
              - -R
              - "{{ blastwall_selinux_role }}"
              - -r
              - "{{ blastwall_selinux_range }}"
              - "{{ blastwall_selinux_user }}"
          changed_when: true
          when: blastwall_selinux_user not in blastwall_selinux_user_names

        - name: Restore SELinux user context directory labels
          ansible.builtin.command:
            cmd: >-
              restorecon -R
              /etc/selinux/{{ blastwall_selinux_type }}/contexts/users
          changed_when: false

        - name: Validate installed SELinux policy modules
          ansible.builtin.command:
            argv:
              - semodule
              - -l
          register: blastwall_installed_modules
          changed_when: false

        - name: Assert Blastwall SELinux policy modules are installed
          ansible.builtin.assert:
            that:
              - item in (blastwall_installed_modules.stdout_lines | map('split') | map('first') | list)
            fail_msg: "SELinux module {{ item }} is not installed."
          loop: "{{ blastwall_policy_modules }}"

        - name: Validate registered Blastwall SELinux user
          ansible.builtin.command:
            argv:
              - semanage
              - user
              - -l
          register: blastwall_selinux_users_after
          changed_when: false

        - name: Assert Blastwall SELinux user is registered
          ansible.builtin.assert:
            that:
              - >-
                blastwall_selinux_user in (
                  blastwall_selinux_users_after.stdout_lines
                  | map('split')
                  | map('first')
                  | list
                )
            fail_msg: "SELinux user {{ blastwall_selinux_user }} is not registered."

        - name: Check Blastwall login context file
          ansible.builtin.stat:
            path: >-
              /etc/selinux/{{ blastwall_selinux_type }}/contexts/users/{{ blastwall_selinux_user }}
          register: blastwall_login_context_file

        - name: Assert Blastwall policy install is complete
          ansible.builtin.assert:
            that:
              - blastwall_login_context_file.stat.exists
            fail_msg: >-
              Blastwall policy install did not validate cleanly.
              context_exists={{ blastwall_login_context_file.stat.exists | default(false) }}.

        - name: Publish Blastwall host marker to IdM
          freeipa.ansible_freeipa.ipahost:
            ipaadmin_principal: "{{ ipa_principal }}"
            ipaadmin_password: "{{ ipa_password }}"
            name: "{{ inventory_hostname }}"
            description: "{{ '' if blastwall_clear_description_marker | bool else omit }}"
            userclass: "{{ blastwall_policy_userclass_values }}"
            state: present
          no_log: true
          delegate_to: localhost
          become: false
          when: blastwall_update_idm_marker | bool

      rescue:
        - name: Roll back newly staged Blastwall policy modules
          ansible.builtin.command:
            argv:
              - semodule
              - -r
              - "{{ item }}"
          loop: "{{ blastwall_policy_modules | reverse | list }}"
          changed_when: true
          failed_when: false
          when:
            - blastwall_deploy_rollback_on_failure | bool
            - >-
              blastwall_deploy_force_cleanup_on_failure | bool or
              item not in (blastwall_preexisting_module_names | default([]))

        - name: Restore pre-existing Blastwall login context
          ansible.builtin.copy:
            content: "{{ blastwall_preexisting_login_context_content.content | b64decode }}"
            dest: >-
              /etc/selinux/{{ blastwall_selinux_type }}/contexts/users/{{ blastwall_selinux_user }}
            owner: root
            group: root
            mode: "0644"
          when:
            - blastwall_deploy_rollback_on_failure | bool
            - blastwall_preexisting_login_context is defined
            - blastwall_preexisting_login_context.stat.exists | default(false)
            - blastwall_preexisting_login_context_content is defined
            - not blastwall_deploy_force_cleanup_on_failure | bool

        - name: Remove newly staged Blastwall login context
          ansible.builtin.file:
            path: >-
              /etc/selinux/{{ blastwall_selinux_type }}/contexts/users/{{ blastwall_selinux_user }}
            state: absent
          when:
            - blastwall_deploy_rollback_on_failure | bool
            - >-
              blastwall_preexisting_login_context is not defined or
              not blastwall_preexisting_login_context.stat.exists | default(false) or
              blastwall_deploy_force_cleanup_on_failure | bool

        - name: Restore SELinux user context directory labels after rollback
          ansible.builtin.command:
            cmd: >-
              restorecon -R
              /etc/selinux/{{ blastwall_selinux_type }}/contexts/users
          changed_when: false
          failed_when: false
          when: blastwall_deploy_rollback_on_failure | bool

        - name: Publish failed Blastwall host marker to IdM
          freeipa.ansible_freeipa.ipahost:
            ipaadmin_principal: "{{ ipa_principal }}"
            ipaadmin_password: "{{ ipa_password }}"
            name: "{{ inventory_hostname }}"
            description: "{{ '' if blastwall_clear_description_marker | bool else omit }}"
            userclass: "{{ blastwall_policy_failed_userclass_values }}"
            state: present
          no_log: true
          delegate_to: localhost
          become: false
          failed_when: false
          when: blastwall_update_idm_marker | bool

        - name: Stop after failed Blastwall deployment
          ansible.builtin.fail:
            msg: >-
              Blastwall policy deployment failed on {{ inventory_hostname }}.
              The host marker was set to failed when marker updates were enabled.
              Rollback was attempted when blastwall_deploy_rollback_on_failure=true.
              Set blastwall_deploy_force_cleanup_on_failure=true only for destructive
              lab cleanup of pre-existing Blastwall policy state.
