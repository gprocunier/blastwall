---
- name: Deploy Blastwall SELinux policy and publish host marker
  hosts: all
  become: true
  gather_facts: false
  vars:
    ipa_principal: "{{ lookup('env', 'IPA_PRINCIPAL') }}"
    ipa_realm: "{{ lookup('env', 'IPA_REALM') | default('', true) }}"
    ipa_login_principal: >-
      {{ ipa_principal if '@' in ipa_principal else ipa_principal ~ '@' ~ ipa_realm }}
    ipa_password: "{{ lookup('env', 'IPA_ADMIN_PASSWORD') }}"
    krb5_config: "{{ lookup('env', 'KRB5_CONFIG') | default('', true) }}"
    krb5_ccache: FILE:/tmp/blastwall_krb5cc
    blastwall_policy_rpm: blastwall-selinux-0.5.0-1
    blastwall_project_dir: /opt/blastwall
    blastwall_policy_dir: "{{ blastwall_project_dir }}/policy"
    blastwall_selinux_type: targeted
    blastwall_selinux_user: blastwall_u
    blastwall_selinux_role: blastwall_r
    blastwall_selinux_range: s0
    blastwall_update_idm_marker: true
    blastwall_policy_marker: >-
      blastwall_policy_rpm={{ blastwall_policy_rpm }};
      blastwall_policy_state=active;
      blastwall_policy_alg_socket=denied;
      blastwall_policy_bpf=denied;
      blastwall_policy_selfprotect=denied;
      blastwall_policy_packet_socket=denied;
      blastwall_policy_userns=denied;
      blastwall_policy_io_uring=denied
  tasks:
    - name: Require Kerberos inputs for target SSH
      ansible.builtin.assert:
        that:
          - ipa_principal | length > 0
          - ipa_realm | length > 0 or '@' in ipa_principal
          - ipa_password | length > 0
        fail_msg: >-
          Set IPA_PRINCIPAL, IPA_REALM, and IPA_ADMIN_PASSWORD for GSSAPI
          target SSH.
      run_once: true
      delegate_to: localhost
      become: false

    - name: Authenticate automation identity for GSSAPI target SSH
      ansible.builtin.shell: |
        set -euo pipefail
        printf '%s\n' "${IPA_ADMIN_PASSWORD}" | kinit "${IPA_LOGIN_PRINCIPAL}"
      args:
        executable: /bin/bash
      environment:
        IPA_LOGIN_PRINCIPAL: "{{ ipa_login_principal }}"
        IPA_ADMIN_PASSWORD: "{{ ipa_password }}"
        KRB5_CONFIG: "{{ krb5_config }}"
        KRB5CCNAME: "{{ krb5_ccache }}"
      changed_when: false
      no_log: true
      run_once: true
      delegate_to: localhost
      become: false

    - name: Install SELinux policy build dependencies
      ansible.builtin.dnf:
        name:
          - make
          - checkpolicy
          - selinux-policy-devel
          - policycoreutils-python-utils
        state: present

    - name: Check SELinux policy development Makefile
      ansible.builtin.stat:
        path: /usr/share/selinux/devel/Makefile
      register: blastwall_selinux_devel_makefile

    - name: Assert host can build and install local SELinux policy
      ansible.builtin.assert:
        that:
          - blastwall_selinux_devel_makefile.stat.exists
        fail_msg: >-
          Missing selinux-policy-devel
          (/usr/share/selinux/devel/Makefile).

    - name: Create Blastwall project directory
      ansible.builtin.file:
        path: "{{ blastwall_project_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Copy Blastwall policy source to target
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../policy/"
        dest: "{{ blastwall_policy_dir }}/"
        owner: root
        group: root
        mode: preserve

    - name: Install Blastwall policy modules
      ansible.builtin.command:
        cmd: make -C "{{ blastwall_policy_dir }}" install
      changed_when: true

    - name: Install Blastwall SELinux login context
      ansible.builtin.copy:
        src: "{{ blastwall_policy_dir }}/contexts/{{ blastwall_selinux_user }}"
        dest: >-
          /etc/selinux/{{ blastwall_selinux_type }}/contexts/users/{{ blastwall_selinux_user }}
        owner: root
        group: root
        mode: "0644"
        remote_src: true

    - name: Register Blastwall SELinux user
      ansible.builtin.shell: |
        set -euo pipefail
        if semanage user -l | awk '{print $1}' | grep -qx "${SELINUX_USER}"; then
          semanage user -m -R "${SELINUX_ROLE}" -r "${SELINUX_RANGE}" "${SELINUX_USER}"
        else
          semanage user -a -R "${SELINUX_ROLE}" -r "${SELINUX_RANGE}" "${SELINUX_USER}"
        fi
      args:
        executable: /bin/bash
      environment:
        SELINUX_USER: "{{ blastwall_selinux_user }}"
        SELINUX_ROLE: "{{ blastwall_selinux_role }}"
        SELINUX_RANGE: "{{ blastwall_selinux_range }}"
      changed_when: true

    - name: Restore SELinux user context directory labels
      ansible.builtin.command:
        cmd: >-
          restorecon -R
          /etc/selinux/{{ blastwall_selinux_type }}/contexts/users
      changed_when: false

    - name: Publish Blastwall host marker to IdM
      ansible.builtin.command:
        cmd: ipa host-mod "{{ inventory_hostname }}" --desc "{{ blastwall_policy_marker }}"
      changed_when: true
      when: blastwall_update_idm_marker | bool
