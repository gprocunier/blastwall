---
- name: Blastwall AAP runtime credential smoke test
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ipa_server: "{{ lookup('env', 'IPA_SERVER') }}"
    ipa_domain: >-
      {{ lookup('env', 'IPA_DOMAIN') |
      default((ipa_server.split('.')[1:] | join('.')), true) }}
    ipa_realm: >-
      {{ lookup('env', 'IPA_REALM') |
      default((ipa_domain | upper), true) }}
    ipa_basedn: >-
      dc={{ ipa_domain | replace('.', ',dc=') }}
    ipa_principal: "{{ lookup('env', 'IPA_PRINCIPAL') | default('admin', true) }}"
    ipa_password: >-
      {{ lookup('env', 'IPA_PASSWORD') |
      default(lookup('env', 'IPA_ADMIN_PASSWORD'), true) }}
    ipa_keytab: "{{ lookup('env', 'IPA_KEYTAB') | default('', true) }}"
    ipa_ca: "{{ lookup('env', 'IPA_CERT') | default('/etc/ipa/ca.crt', true) }}"
    krb5_config: "{{ lookup('env', 'KRB5_CONFIG') | default('', true) }}"
    krb5_ccache: "{{ lookup('env', 'KRB5CCNAME') | default('FILE:/tmp/blastwall_krb5cc', true) }}"
    blastwall_identity: "{{ lookup('env', 'BLASTWALL_IDENTITY') }}"
    blastwall_hbac_rule_name: blastwall-ssh
  tasks:
    - name: Require injected IdM runtime credential inputs
      ansible.builtin.assert:
        that:
          - ipa_server | length > 0
          - ipa_domain | length > 0
          - ipa_realm | length > 0
          - ipa_principal | length > 0
          - ipa_ca | length > 0
          - krb5_config | length > 0
          - ipa_keytab | length > 0 or ipa_password | length > 0
          - blastwall_identity | length > 0
        fail_msg: >-
          Blastwall IdM runtime credential is incomplete. Expected IPA_SERVER,
          IPA_DOMAIN, IPA_REALM, IPA_PRINCIPAL, IPA_CERT, KRB5_CONFIG,
          BLASTWALL_IDENTITY, and either IPA_KEYTAB or IPA_PASSWORD.

    - name: Write FreeIPA client config for credential smoke
      ansible.builtin.copy:
        dest: /etc/ipa/default.conf
        mode: "0644"
        content: |
          [global]
          server = {{ ipa_server }}
          domain = {{ ipa_domain }}
          realm = {{ ipa_realm }}
          basedn = {{ ipa_basedn }}
          xmlrpc_uri = https://{{ ipa_server }}/ipa/xml

    - name: Authenticate injected IdM runtime credential
      ansible.builtin.shell: |
        set -euo pipefail
        if [ -n "${IPA_KEYTAB}" ]; then
          kinit -k -t "${IPA_KEYTAB}" "${IPA_LOGIN_PRINCIPAL}"
        else
          printf '%s\n' "${IPA_PASSWORD}" | kinit "${IPA_LOGIN_PRINCIPAL}"
        fi
        klist -s
      args:
        executable: /bin/bash
      environment:
        IPA_LOGIN_PRINCIPAL: >-
          {{ ipa_principal if '@' in ipa_principal else ipa_principal ~ '@' ~ ipa_realm }}
        IPA_PASSWORD: "{{ ipa_password }}"
        IPA_KEYTAB: "{{ ipa_keytab }}"
        KRB5_CONFIG: "{{ krb5_config }}"
        KRB5CCNAME: "{{ krb5_ccache }}"
      changed_when: false
      no_log: true

    - name: Read linked HBAC rule using injected credential
      ansible.builtin.set_fact:
        blastwall_credential_hbac_rule: >-
          {{ lookup('eigenstate.ipa.hbacrule',
                    '%s' | format(blastwall_hbac_rule_name),
                    server=ipa_server,
                    ipaadmin_principal=ipa_principal,
                    ipaadmin_password=ipa_password,
                    kerberos_keytab=ipa_keytab,
                    verify=ipa_ca) }}

    - name: Assert injected credential can read Blastwall IdM state
      ansible.builtin.assert:
        that:
          - blastwall_credential_hbac_rule.exists
          - blastwall_credential_hbac_rule.enabled
          - "'sshd' in blastwall_credential_hbac_rule.services or blastwall_credential_hbac_rule.servicecategory == 'all'"
        fail_msg: >-
          Injected IdM runtime credential could not read the expected Blastwall
          HBAC state.

    - name: Report credential smoke result
      ansible.builtin.debug:
        msg:
          credential_smoke: passed
          principal: "{{ ipa_principal }}"
          identity: "{{ blastwall_identity }}"
          hbac_rule: "{{ blastwall_hbac_rule_name }}"
