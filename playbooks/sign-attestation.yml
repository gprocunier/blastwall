---
- name: Sign and read back Blastwall v3 attestation artifacts
  hosts: "{{ blastwall_policy_pipeline_target_hosts | default('blastwall_policy_stale') }}"
  become: false
  gather_facts: false
  vars:
    blastwall_attestation_mode: >-
      {{ BLASTWALL_ATTESTATION_MODE |
      default(lookup('env', 'BLASTWALL_ATTESTATION_MODE') | default('reference-v2', true), true) }}
    blastwall_attestation_required: "{{ blastwall_attestation_mode in ['transition-v3', 'stable-v3'] }}"
    blastwall_policy_name: blastwall-selinux
    blastwall_policy_version: >-
      {{ BLASTWALL_POLICY_VERSION |
      default(lookup('env', 'BLASTWALL_POLICY_VERSION') | default('0.6.1', true), true) }}
    blastwall_policy_release: >-
      {{ BLASTWALL_POLICY_RELEASE |
      default(lookup('env', 'BLASTWALL_POLICY_RELEASE') | default('0.rc1', true), true) }}
    blastwall_policy_nevra: "{{ blastwall_policy_name }}-{{ blastwall_policy_version }}-{{ blastwall_policy_release }}"
    blastwall_profile_registry_path: "{{ playbook_dir }}/../policy/profiles.yml"
    blastwall_profile_registry_sha256: "{{ lookup('file', blastwall_profile_registry_path, rstrip=False) | hash('sha256') }}"
    blastwall_policy_module_sha256: >-
      {{
        vars.get('BLASTWALL_CURRENT_POLICY_SHA256', '') |
        default('', true) or
        vars.get('BLASTWALL_POLICY_SHA256', '') |
        default('', true) or
        (blastwall_policy_sha256_by_host | default({})).get(inventory_hostname, '') |
        default('', true) or
        vars.get('blastwall_policy_sha256', '') |
        default('', true) or
        lookup('env', 'BLASTWALL_CURRENT_POLICY_SHA256') |
        default('', true) or
        lookup('env', 'BLASTWALL_POLICY_SHA256') |
        default('', true)
      }}
    blastwall_probe_report_sha256: >-
      {{
        vars.get('BLASTWALL_PROBE_REPORT_SHA256', '') |
        default('', true) or
        (blastwall_probe_report_sha256_by_host | default({})).get(inventory_hostname, '') |
        default('', true) or
        vars.get('blastwall_probe_report_sha256', '') |
        default('', true) or
        lookup('env', 'BLASTWALL_PROBE_REPORT_SHA256') |
        default('', true)
      }}
    blastwall_required_profiles_env: >-
      {{ BLASTWALL_REQUIRED_POLICY_PROFILES |
      default(lookup('env', 'BLASTWALL_REQUIRED_POLICY_PROFILES') | default('', true), true) }}
    required_blastwall_profiles: >-
      {{
        (blastwall_required_profiles_env.split(',') | map('trim') | reject('equalto', '') | list)
        if blastwall_required_profiles_env | length > 0
        else ['base']
      }}
    blastwall_allow_dry_run_profiles: >-
      {{ BLASTWALL_ALLOW_DRY_RUN_PROFILES |
      default(lookup('env', 'BLASTWALL_ALLOW_DRY_RUN_PROFILES') | default('false', true), true) | bool }}
    blastwall_attestation_state: >-
      {{ BLASTWALL_ATTESTATION_STATE |
      default(lookup('env', 'BLASTWALL_ATTESTATION_STATE') | default('active', true), true) }}
    blastwall_attestation_generation: >-
      {{
        BLASTWALL_ATTESTATION_GENERATION |
        default(lookup('env', 'BLASTWALL_ATTESTATION_GENERATION') |
        default(lookup('pipe', 'date +%s'), true), true)
      }}
    blastwall_attestation_valid_for_seconds: >-
      {{ BLASTWALL_ATTESTATION_VALID_FOR_SECONDS |
      default(lookup('env', 'BLASTWALL_ATTESTATION_VALID_FOR_SECONDS') | default('3600', true), true) }}
    blastwall_attestation_source_revision: >-
      {{
        [
          vars.get('awx_project_revision', ''),
          vars.get('tower_project_revision', ''),
          vars.get('AWX_PROJECT_REVISION', ''),
          vars.get('TOWER_PROJECT_REVISION', ''),
          lookup('env', 'AWX_PROJECT_REVISION'),
          lookup('env', 'TOWER_PROJECT_REVISION'),
          lookup('pipe', 'git -C ' ~ playbook_dir ~ '/.. rev-parse HEAD 2>/dev/null || true'),
          vars.get('BLASTWALL_SOURCE_REVISION', ''),
          lookup('env', 'BLASTWALL_SOURCE_REVISION'),
          'unknown'
        ] | map('string') | map('trim') | reject('equalto', '') | first
      }}
    blastwall_attestation_workflow_job_id: >-
      {{
        [
          vars.get('awx_workflow_job_id', ''),
          vars.get('tower_workflow_job_id', ''),
          vars.get('AWX_WORKFLOW_JOB_ID', ''),
          vars.get('TOWER_WORKFLOW_JOB_ID', ''),
          lookup('env', 'AWX_WORKFLOW_JOB_ID'),
          lookup('env', 'TOWER_WORKFLOW_JOB_ID'),
          lookup('env', 'WORKFLOW_JOB_ID'),
          vars.get('BLASTWALL_AAP_WORKFLOW_JOB_ID', ''),
          lookup('env', 'BLASTWALL_AAP_WORKFLOW_JOB_ID'),
          vars.get('awx_job_id', ''),
          vars.get('tower_job_id', ''),
          vars.get('AWX_JOB_ID', ''),
          vars.get('TOWER_JOB_ID', ''),
          lookup('env', 'AWX_JOB_ID'),
          lookup('env', 'TOWER_JOB_ID'),
          lookup('env', 'JOB_ID'),
          '0'
        ] | map('string') | map('trim') | reject('equalto', '') | first
      }}
    blastwall_spo_evidence_json: >-
      {{ BLASTWALL_SPO_EVIDENCE_JSON |
      default(lookup('env', 'BLASTWALL_SPO_EVIDENCE_JSON') | default('', true), true) }}
    blastwall_attestation_signer_key: >-
      {{ lookup('env', 'BLASTWALL_ATTESTATION_SIGNER_KEY') | default('', true) }}
    blastwall_attestation_signer_certificate: >-
      {{ lookup('env', 'BLASTWALL_ATTESTATION_SIGNER_CERTIFICATE') | default('', true) }}
    blastwall_attestation_ca_bundle: >-
      {{ lookup('env', 'BLASTWALL_ATTESTATION_CA_BUNDLE') | default('', true) }}
    blastwall_attestation_signer_allowlist: >-
      {{ lookup('env', 'BLASTWALL_ATTESTATION_SIGNER_ALLOWLIST') | default('', true) }}
    blastwall_attestation_vault_primary: >-
      {{ lookup('env', 'BLASTWALL_ATTESTATION_VAULT_PRIMARY') | default('', true) }}
    blastwall_attestation_vault_servers: >-
      {{ lookup('env', 'BLASTWALL_ATTESTATION_VAULT_SERVERS') | default('', true) }}
    blastwall_attestation_vault_scope: >-
      {{ lookup('env', 'BLASTWALL_ATTESTATION_VAULT_SCOPE') | default('service', true) }}
    blastwall_attestation_vault_owner: >-
      {{ lookup('env', 'BLASTWALL_ATTESTATION_VAULT_OWNER') | default('blastwall-attestation', true) }}
    blastwall_attestation_envelope_dir: >-
      {{ lookup('env', 'BLASTWALL_ATTESTATION_ENVELOPE_DIR') |
      default('/tmp/blastwall-attestations/envelopes', true) }}
    blastwall_attestation_index_dir: >-
      {{ lookup('env', 'BLASTWALL_ATTESTATION_INDEX_DIR') |
      default('/tmp/blastwall-attestations/indexes', true) }}
    ipa_server: >-
      {{ lookup('env', 'IPA_SERVER') | default(blastwall_attestation_vault_primary, true) }}
    ipa_domain: >-
      {{ lookup('env', 'IPA_DOMAIN') |
      default((ipa_server.split('.')[1:] | join('.')), true) }}
    ipa_ca: "{{ lookup('env', 'IPA_CERT') | default('/etc/ipa/ca.crt', true) }}"
    ipa_basedn: >-
      dc={{ ipa_domain | replace('.', ',dc=') }}
    ipa_principal: "{{ lookup('env', 'IPA_PRINCIPAL') | default('', true) }}"
    ipa_realm: "{{ lookup('env', 'IPA_REALM') | default('', true) }}"
    ipa_login_principal: >-
      {{ ipa_principal if '@' in ipa_principal else ipa_principal ~ '@' ~ ipa_realm }}
    ipa_password: >-
      {{ lookup('env', 'IPA_PASSWORD') |
      default(lookup('env', 'IPA_ADMIN_PASSWORD'), true) }}
    ipa_keytab: "{{ lookup('env', 'IPA_KEYTAB') | default('', true) }}"
    krb5_config: "{{ lookup('env', 'KRB5_CONFIG') | default('', true) }}"
    krb5_ccache: FILE:/tmp/blastwall_krb5cc
  tasks:
    - name: Skip v3 signing outside transition-v3 or stable-v3 mode
      ansible.builtin.debug:
        msg:
          attestation_signing: skipped
          mode: "{{ blastwall_attestation_mode }}"
      when: not blastwall_attestation_required | bool

    - name: Sign and read back attestation artifacts
      when: blastwall_attestation_required | bool
      block:
        - name: Require Blastwall v3 signing inputs
          ansible.builtin.assert:
            that:
              - blastwall_policy_module_sha256 is match('^[0-9a-f]{64}$')
              - blastwall_probe_report_sha256 is match('^[0-9a-f]{64}$')
              - blastwall_attestation_generation | int >= 0
              - blastwall_attestation_valid_for_seconds | int > 0
              - blastwall_attestation_signer_key | length > 0
              - blastwall_attestation_signer_certificate | length > 0
              - blastwall_attestation_ca_bundle | length > 0
              - blastwall_attestation_signer_allowlist | length > 0
              - blastwall_attestation_vault_primary | length > 0
              - blastwall_attestation_vault_servers | length > 0
              - ipa_server | length > 0
              - ipa_domain | length > 0
              - ipa_principal | length > 0
              - ipa_realm | length > 0 or '@' in ipa_principal
              - ipa_keytab | length > 0 or ipa_password | length > 0
            fail_msg: >-
              transition-v3/stable-v3 signing requires current policy hash,
              probe report hash, signer key/certificate/CA/allowlist, explicit
              KRA vault primary, explicit KRA vault server list, and Kerberos
              credentials for the vault client.
          run_once: true
          delegate_to: localhost

        - name: Assert stable-v3 does not use lab/RC shared vault custody
          ansible.builtin.assert:
            that:
              - blastwall_attestation_mode != 'stable-v3' or blastwall_attestation_vault_scope != 'shared'
            fail_msg: >-
              stable-v3 rejects shared vault scope as lab/RC custody. Use a
              service-owned or named-user signer/vault principal for stable-v3;
              transition-v3 may use shared custody only as explicit lab/RC
              evidence.
          run_once: true
          delegate_to: localhost

        - name: Report lab/RC shared custody mode
          ansible.builtin.debug:
            msg:
              custody: lab/RC shared vault custody
              mode: "{{ blastwall_attestation_mode }}"
              vault_scope: "{{ blastwall_attestation_vault_scope }}"
              vault_owner: "{{ blastwall_attestation_vault_owner }}"
          when:
            - blastwall_attestation_mode != 'stable-v3'
            - blastwall_attestation_vault_scope == 'shared'
          run_once: true
          delegate_to: localhost

        - name: Write FreeIPA client config for attestation vault writes
          ansible.builtin.copy:
            dest: /etc/ipa/default.conf
            mode: "0644"
            content: |
              [global]
              server = {{ ipa_server }}
              domain = {{ ipa_domain }}
              realm = {{ ipa_realm }}
              basedn = {{ ipa_basedn }}
              xmlrpc_uri = https://{{ ipa_server }}/ipa/xml
          run_once: true
          delegate_to: localhost

        - name: Install injected FreeIPA CA for attestation vault writes
          ansible.builtin.copy:
            src: "{{ ipa_ca }}"
            dest: /etc/ipa/ca.crt
            mode: "0644"
            remote_src: true
          when:
            - ipa_ca | length > 0
            - ipa_ca != "/etc/ipa/ca.crt"
          run_once: true
          delegate_to: localhost

        - name: Build signed attestation envelope and latest index
          ansible.builtin.command:
            argv: "{{ blastwall_attestation_sign_argv }}"
          register: blastwall_signed_attestation_build
          changed_when: false
          failed_when: blastwall_signed_attestation_build.rc != 0
          delegate_to: localhost
          vars:
            blastwall_attestation_sign_argv: >-
              {{
                [
                  ansible_playbook_python | default('/usr/bin/python3'),
                  playbook_dir ~ '/../tools/blastwall_attestation_sign.py',
                  'build-artifacts',
                  '--registry', blastwall_profile_registry_path,
                  '--attestation-mode', blastwall_attestation_mode,
                  '--subject-host', inventory_hostname,
                  '--target', 'rhel-login',
                  '--rpm', blastwall_policy_nevra,
                  '--policy-sha256', blastwall_policy_module_sha256,
                  '--registry-sha256', blastwall_profile_registry_sha256,
                  '--probe-report-sha256', blastwall_probe_report_sha256,
                  '--state', blastwall_attestation_state,
                  '--generation', blastwall_attestation_generation | string,
                  '--source-revision', blastwall_attestation_source_revision,
                  '--aap-workflow-job-id', blastwall_attestation_workflow_job_id | string,
                  '--valid-for-seconds', blastwall_attestation_valid_for_seconds | string,
                  '--signer-key', blastwall_attestation_signer_key,
                  '--signer-certificate', blastwall_attestation_signer_certificate,
                  '--ca-bundle', blastwall_attestation_ca_bundle,
                  '--signer-allowlist-csv', blastwall_attestation_signer_allowlist,
                  '--vault-primary', blastwall_attestation_vault_primary,
                  '--vault-servers-csv', blastwall_attestation_vault_servers,
                  '--vault-scope', blastwall_attestation_vault_scope,
                  '--vault-owner', blastwall_attestation_vault_owner,
                  '--envelope-dir', blastwall_attestation_envelope_dir,
                  '--index-dir', blastwall_attestation_index_dir
                ]
                + (['--allow-dry-run-profiles'] if blastwall_allow_dry_run_profiles | bool else [])
                + (
                  required_blastwall_profiles
                  | map('regex_replace', '^', '--profile=')
                  | list
                )
                + (['--spo-evidence', blastwall_spo_evidence_json] if blastwall_spo_evidence_json | length > 0 else [])
              }}

        - name: Parse local attestation build evidence
          ansible.builtin.set_fact:
            blastwall_signed_attestation_build_evidence: "{{ blastwall_signed_attestation_build.stdout | from_json }}"
          no_log: true

        - name: Archive attestation envelope with eigenstate vault artifact custody
          eigenstate.ipa.vault_artifact:
            name: "{{ blastwall_signed_attestation_build_evidence.vault_artifacts.envelope.name }}"
            state: archived
            server: "{{ blastwall_attestation_vault_primary }}"
            ipaadmin_principal: "{{ ipa_login_principal }}"
            ipaadmin_password: "{{ ipa_password }}"
            kerberos_keytab: "{{ ipa_keytab if ipa_keytab | length > 0 else omit }}"
            verify: "{{ ipa_ca }}"
            shared: "{{ true if blastwall_attestation_vault_scope == 'shared' else omit }}"
            service: "{{ blastwall_attestation_vault_owner if blastwall_attestation_vault_scope == 'service' else omit }}"
            username: "{{ blastwall_attestation_vault_owner if blastwall_attestation_vault_scope == 'user' else omit }}"
            payload_file: "{{ blastwall_signed_attestation_build_evidence.envelope_file }}"
            expected_sha256: "{{ blastwall_signed_attestation_build_evidence.attestation_sha256 }}"
            read_back: true
            description: "{{ blastwall_signed_attestation_build_evidence.attestation_ref }}"
          register: blastwall_attestation_envelope_custody
          no_log: true
          delegate_to: localhost

        - name: Archive latest index with eigenstate vault artifact custody
          eigenstate.ipa.vault_artifact:
            name: "{{ blastwall_signed_attestation_build_evidence.vault_artifacts.index.name }}"
            state: archived
            server: "{{ blastwall_attestation_vault_primary }}"
            ipaadmin_principal: "{{ ipa_login_principal }}"
            ipaadmin_password: "{{ ipa_password }}"
            kerberos_keytab: "{{ ipa_keytab if ipa_keytab | length > 0 else omit }}"
            verify: "{{ ipa_ca }}"
            shared: "{{ true if blastwall_attestation_vault_scope == 'shared' else omit }}"
            service: "{{ blastwall_attestation_vault_owner if blastwall_attestation_vault_scope == 'service' else omit }}"
            username: "{{ blastwall_attestation_vault_owner if blastwall_attestation_vault_scope == 'user' else omit }}"
            payload_file: "{{ blastwall_signed_attestation_build_evidence.index_file }}"
            expected_sha256: "{{ blastwall_signed_attestation_build_evidence.index_sha256 }}"
            read_back: true
            description: "{{ blastwall_signed_attestation_build_evidence.index_ref }}"
          register: blastwall_attestation_index_custody
          no_log: true
          delegate_to: localhost

        - name: Assert attestation vault read-back verified
          ansible.builtin.assert:
            that:
              - blastwall_attestation_envelope_custody.read_back_verified | bool
              - blastwall_attestation_envelope_custody.artifact_sha256 == blastwall_signed_attestation_build_evidence.attestation_sha256
              - blastwall_attestation_index_custody.read_back_verified | bool
              - blastwall_attestation_index_custody.artifact_sha256 == blastwall_signed_attestation_build_evidence.index_sha256
            fail_msg: >-
              Signed attestation artifact read-back verification failed before
              marker publication.

        - name: Verify stored signed attestation before marker publication
          ansible.builtin.command:
            argv: "{{ blastwall_attestation_verify_existing_argv }}"
          register: blastwall_signed_attestation
          changed_when: false
          failed_when: blastwall_signed_attestation.rc != 0
          delegate_to: localhost
          vars:
            blastwall_attestation_verify_existing_argv: >-
              {{
                [
                  ansible_playbook_python | default('/usr/bin/python3'),
                  playbook_dir ~ '/../tools/blastwall_attestation_sign.py',
                  'verify-existing',
                  '--registry', blastwall_profile_registry_path,
                  '--attestation-mode', blastwall_attestation_mode,
                  '--subject-host', inventory_hostname,
                  '--target', 'rhel-login',
                  '--rpm', blastwall_policy_nevra,
                  '--policy-sha256', blastwall_policy_module_sha256,
                  '--registry-sha256', blastwall_profile_registry_sha256,
                  '--probe-report-sha256', blastwall_probe_report_sha256,
                  '--state', blastwall_attestation_state,
                  '--generation', blastwall_attestation_generation | string,
                  '--source-revision', blastwall_attestation_source_revision,
                  '--aap-workflow-job-id', blastwall_attestation_workflow_job_id | string,
                  '--valid-for-seconds', blastwall_attestation_valid_for_seconds | string,
                  '--signer-certificate', blastwall_attestation_signer_certificate,
                  '--ca-bundle', blastwall_attestation_ca_bundle,
                  '--signer-allowlist-csv', blastwall_attestation_signer_allowlist,
                  '--envelope-json', blastwall_signed_attestation_build_evidence.envelope_file,
                  '--index-json', blastwall_signed_attestation_build_evidence.index_file
                ]
                + (['--allow-dry-run-profiles'] if blastwall_allow_dry_run_profiles | bool else [])
                + (
                  required_blastwall_profiles
                  | map('regex_replace', '^', '--profile=')
                  | list
                )
                + (['--spo-evidence', blastwall_spo_evidence_json] if blastwall_spo_evidence_json | length > 0 else [])
              }}

        - name: Parse sanitized attestation signing evidence
          ansible.builtin.set_fact:
            blastwall_signed_attestation_evidence: "{{ blastwall_signed_attestation.stdout | from_json }}"
          no_log: true

        - name: Propagate signed attestation evidence to downstream workflow jobs
          ansible.builtin.set_stats:
            data:
              BLASTWALL_ATTESTATION_GENERATION: "{{ blastwall_signed_attestation_evidence.index_generation }}"
              blastwall_attestation_generation: "{{ blastwall_signed_attestation_evidence.index_generation }}"
              blastwall_v3_attestation_marker: "{{ blastwall_signed_attestation_evidence.marker }}"
              blastwall_v3_attestation_marker_by_host: >-
                {{ {inventory_hostname: blastwall_signed_attestation_evidence.marker} }}
              blastwall_v3_attestation_ref: "{{ blastwall_signed_attestation_evidence.attestation_ref }}"
              blastwall_v3_attestation_sha256: "{{ blastwall_signed_attestation_evidence.attestation_sha256 }}"
              blastwall_v3_attestation_index_generation: "{{ blastwall_signed_attestation_evidence.index_generation }}"
              blastwall_v3_attestation_signer_kid: "{{ blastwall_signed_attestation_evidence.signer_kid }}"

        - name: Report attestation signing evidence
          ansible.builtin.debug:
            msg:
              attestation_ref: "{{ blastwall_signed_attestation_evidence.attestation_ref }}"
              attestation_sha256: "{{ blastwall_signed_attestation_evidence.attestation_sha256 }}"
              index_generation: "{{ blastwall_signed_attestation_evidence.index_generation }}"
              signer_kid: "{{ blastwall_signed_attestation_evidence.signer_kid }}"
              vault_server: "{{ blastwall_signed_attestation_evidence.vault_server }}"
              workflow_job_id: "{{ blastwall_signed_attestation_evidence.workflow_job_id }}"
              source_revision: "{{ blastwall_signed_attestation_evidence.source_revision }}"
