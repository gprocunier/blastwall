---
- name: Check Blastwall attestation vault health for configured KRA targets
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ipa_server: "{{ lookup('env', 'IPA_SERVER') | default('', true) }}"
    ipa_domain: >-
      {{ lookup('env', 'IPA_DOMAIN') |
      default((ipa_server.split('.')[1:] | join('.')), true) }}
    ipa_realm: >-
      {{ lookup('env', 'IPA_REALM') |
      default((ipa_domain | upper), true) }}
    ipa_principal: "{{ lookup('env', 'IPA_PRINCIPAL') | default('admin', true) }}"
    ipa_login_principal: >-
      {{ ipa_principal if '@' in ipa_principal else ipa_principal ~ '@' ~ ipa_realm }}
    ipa_password: >-
      {{ lookup('env', 'IPA_PASSWORD') |
      default(lookup('env', 'IPA_ADMIN_PASSWORD'), true) }}
    ipa_keytab: "{{ lookup('env', 'IPA_KEYTAB') | default('', true) }}"
    ipa_ca: "{{ lookup('env', 'IPA_CERT') | default('/etc/ipa/ca.crt', true) }}"
    ipa_basedn: >-
      dc={{ ipa_domain | replace('.', ',dc=') }}
    blastwall_attestation_vault_primary: >-
      {{ lookup('env', 'BLASTWALL_ATTESTATION_VAULT_PRIMARY') | default('', true) }}
    blastwall_attestation_vault_servers: >-
      {{
        lookup('env', 'BLASTWALL_ATTESTATION_VAULT_SERVERS') |
        default('', true) |
        split(',') |
        map('trim') |
        reject('equalto', '') |
        list
      }}
    blastwall_attestation_vault_scope: >-
      {{ lookup('env', 'BLASTWALL_ATTESTATION_VAULT_SCOPE') | default('', true) }}
    blastwall_attestation_vault_owner: >-
      {{ lookup('env', 'BLASTWALL_ATTESTATION_VAULT_OWNER') | default('', true) }}
    blastwall_attestation_health_canary: >-
      {{ lookup('env', 'BLASTWALL_ATTESTATION_HEALTH_CANARY') | default('', true) }}
    blastwall_attestation_canary_max_age_seconds: >-
      {{ lookup('env', 'BLASTWALL_ATTESTATION_CANARY_MAX_AGE_SECONDS') | default('', true) }}
  tasks:
    - name: Validate explicit vault health inputs
      ansible.builtin.assert:
        that:
          - blastwall_attestation_vault_primary | length > 0
          - blastwall_attestation_vault_servers | length > 0
          - blastwall_attestation_vault_primary in blastwall_attestation_vault_servers
          - blastwall_attestation_vault_scope in ['shared', 'service', 'user']
          - blastwall_attestation_vault_scope == 'shared' or blastwall_attestation_vault_owner | length > 0
          - ipa_login_principal | length > 0
          - ipa_keytab | length > 0 or ipa_password | length > 0
        fail_msg: >-
          Set explicit KRA vault primary/server list/scope and IdM credentials
          before running the Blastwall attestation vault health gate.

    - name: Resolve configured KRA vault servers
      ansible.builtin.command:
        argv:
          - getent
          - hosts
          - "{{ item }}"
      loop: "{{ blastwall_attestation_vault_servers }}"
      register: blastwall_attestation_vault_server_resolution
      changed_when: false

    - name: Write FreeIPA client config for KRA health gate
      ansible.builtin.copy:
        dest: /etc/ipa/default.conf
        mode: "0644"
        content: |
          [global]
          server = {{ ipa_server }}
          domain = {{ ipa_domain }}
          realm = {{ ipa_realm }}
          basedn = {{ ipa_basedn }}
          xmlrpc_uri = https://{{ ipa_server }}/ipa/xml

    - name: Install injected FreeIPA CA for KRA health gate
      ansible.builtin.copy:
        src: "{{ ipa_ca }}"
        dest: /etc/ipa/ca.crt
        mode: "0644"
        remote_src: true
      when:
        - ipa_ca | length > 0
        - ipa_ca != "/etc/ipa/ca.crt"

    - name: Check configured KRA vault health through eigenstate
      eigenstate.ipa.vault_health:
        server: "{{ blastwall_attestation_vault_primary }}"
        ipaadmin_principal: "{{ ipa_login_principal }}"
        ipaadmin_password: "{{ ipa_password }}"
        kerberos_keytab: "{{ ipa_keytab if ipa_keytab | length > 0 else omit }}"
        verify: "{{ ipa_ca }}"
        require_direct_kra: true
        shared: "{{ blastwall_attestation_vault_scope == 'shared' }}"
        service: "{{ blastwall_attestation_vault_owner if blastwall_attestation_vault_scope == 'service' else omit }}"
        username: "{{ blastwall_attestation_vault_owner if blastwall_attestation_vault_scope == 'user' else omit }}"
        canary_vault: "{{ blastwall_attestation_health_canary if blastwall_attestation_health_canary | length > 0 else omit }}"
        canary_max_age_seconds: >-
          {{ blastwall_attestation_canary_max_age_seconds
             if blastwall_attestation_canary_max_age_seconds | string | length > 0 else omit }}
      register: blastwall_attestation_vault_health
      no_log: "{{ ipa_password | length > 0 }}"

    - name: Build structured KRA vault health report
      ansible.builtin.set_fact:
        blastwall_attestation_vault_health_passed: >-
          {{
            blastwall_attestation_vault_health.idm_reachable | bool and
            blastwall_attestation_vault_health.vault_reachable | bool and
            blastwall_attestation_vault_health.kra_available is sameas true and
            blastwall_attestation_vault_health.failure_class == 'none' and
            blastwall_attestation_vault_health.canary_stale is not sameas true and
            (
              blastwall_attestation_health_canary | length == 0 or
              blastwall_attestation_vault_health.canary_present is sameas true
            )
          }}
        blastwall_attestation_vault_health_report:
          status: >-
            {{
              'PASS'
              if (
                blastwall_attestation_vault_health.idm_reachable | bool and
                blastwall_attestation_vault_health.vault_reachable | bool and
                blastwall_attestation_vault_health.kra_available is sameas true and
                blastwall_attestation_vault_health.failure_class == 'none' and
                blastwall_attestation_vault_health.canary_stale is not sameas true and
                (
                  blastwall_attestation_health_canary | length == 0 or
                  blastwall_attestation_vault_health.canary_present is sameas true
                )
              )
              else 'FAIL'
            }}
          failure_state: >-
            {% if blastwall_attestation_vault_health.failure_class == 'auth' -%}
            FAIL_INFRA_VAULT_AUTH
            {%- elif blastwall_attestation_vault_health.canary_stale is sameas true -%}
            FAIL_CANARY_STALE
            {%- elif blastwall_attestation_health_canary | length > 0 and blastwall_attestation_vault_health.canary_present is not sameas true -%}
            FAIL_CANARY_MISSING
            {%- elif blastwall_attestation_vault_health.failure_class in ['timeout', 'connection'] -%}
            FAIL_INFRA_VAULT_TIMEOUT
            {%- elif blastwall_attestation_vault_health.failure_class == 'none' -%}
            none
            {%- else -%}
            FAIL_INFRA_VAULT_KRA
            {%- endif %}
          vault_server: "{{ blastwall_attestation_vault_health.server | default(blastwall_attestation_vault_primary) }}"
          kra_available: "{{ blastwall_attestation_vault_health.kra_available | default(false) }}"
          vault_reachable: "{{ blastwall_attestation_vault_health.vault_reachable | default(false) }}"
          idm_reachable: "{{ blastwall_attestation_vault_health.idm_reachable | default(false) }}"
          failure_class: "{{ blastwall_attestation_vault_health.failure_class | default('unknown') }}"
          canary_present: "{{ blastwall_attestation_vault_health.canary_present | default(omit) }}"
          canary_stale: "{{ blastwall_attestation_vault_health.canary_stale | default(omit) }}"
          canary_age_seconds: "{{ blastwall_attestation_vault_health.canary_age_seconds | default(omit) }}"
          message: "{{ blastwall_attestation_vault_health.message | default('') }}"

    - name: Report KRA vault health gate
      ansible.builtin.debug:
        msg: "{{ blastwall_attestation_vault_health_report }}"

    - name: Assert KRA vault health gate passed
      ansible.builtin.assert:
        that:
          - blastwall_attestation_vault_health_passed | bool
        fail_msg: >-
          {{ blastwall_attestation_vault_health_report | to_json }}
