---
- name: Blastwall controller-side suitability gate
  hosts: all
  connection: local
  gather_facts: false
  run_once: true
  vars:
    ipa_server: "{{ lookup('env', 'IPA_SERVER') }}"
    ipa_domain: >-
      {{ lookup('env', 'IPA_DOMAIN') |
      default((ipa_server.split('.')[1:] | join('.')), true) }}
    ipa_realm: >-
      {{ lookup('env', 'IPA_REALM') |
      default((ipa_domain | upper), true) }}
    ipa_basedn: >-
      dc={{ ipa_domain | replace('.', ',dc=') }}
    ipa_principal: "{{ lookup('env', 'IPA_PRINCIPAL') | default('admin', true) }}"
    ipa_password: >-
      {{ lookup('env', 'IPA_PASSWORD') |
      default(lookup('env', 'IPA_ADMIN_PASSWORD'), true) }}
    ipa_keytab: "{{ lookup('env', 'IPA_KEYTAB') | default('', true) }}"
    ipa_ca: "{{ lookup('env', 'IPA_CERT') | default('/etc/ipa/ca.crt', true) }}"
    blastwall_identity: "{{ lookup('env', 'BLASTWALL_IDENTITY') }}"
    blastwall_selinux_map_name: blastwall-root-local-map
    blastwall_expected_selinux_user: blastwall_u:s0
    blastwall_hbac_rule_name: blastwall-ssh
    blastwall_sudo_rule_name: blastwall-root-local-sudo
    blastwall_required_policy_marker: >-
      {{ lookup('env', 'BLASTWALL_REQUIRED_POLICY_MARKER') | default('blastwall-selinux-0.6.1-0.rc1', true) }}
    blastwall_profile_registry_path: "{{ playbook_dir }}/../policy/profiles.yml"
    blastwall_profile_registry_sha256: "{{ lookup('file', blastwall_profile_registry_path, rstrip=False) | hash('sha256') }}"
    blastwall_marker_v2_registry_field: registry_sha256=
    blastwall_required_profiles_env: >-
      {{
        BLASTWALL_REQUIRED_POLICY_PROFILES |
        default(lookup('env', 'BLASTWALL_REQUIRED_POLICY_PROFILES') | default('', true), true)
      }}
    blastwall_allow_dry_run_profiles: >-
      {{
        BLASTWALL_ALLOW_DRY_RUN_PROFILES |
        default(lookup('env', 'BLASTWALL_ALLOW_DRY_RUN_PROFILES') | default('false', true), true) |
        bool
      }}
    required_blastwall_profiles: >-
      {{
        (blastwall_required_profiles_env.split(',') | map('trim') | reject('equalto', '') | list)
        if blastwall_required_profiles_env | length > 0
        else ['base']
      }}
    blastwall_base_scope_csv: alg_socket,bpf,capability2_bpf,packet_socket,userns,io_uring,xfrm,rxrpc,selfprotect
    blastwall_strange_socket_v1_scope_csv: bluetooth_socket,can_socket,kcm_socket,nfc_socket,rds_socket,tipc_socket,xdp_socket
    blastwall_required_scope_csv: >-
      {{
        blastwall_base_scope_csv ~
        ((',' ~ blastwall_strange_socket_v1_scope_csv) if 'strange-socket-v1' in required_blastwall_profiles else '')
      }}
    blastwall_required_profile_csv: "{{ required_blastwall_profiles | join(',') }}"
    blastwall_strange_socket_v1_requested: "{{ 'strange-socket-v1' in required_blastwall_profiles }}"
    blastwall_strange_socket_v1_legacy_dry_run_raw: >-
      {{
        BLASTWALL_STRANGE_SOCKET_V1_DRY_RUN |
        default(lookup('env', 'BLASTWALL_STRANGE_SOCKET_V1_DRY_RUN') | default('', true), true)
      }}
    blastwall_strange_socket_v1_legacy_dry_run_set: "{{ blastwall_strange_socket_v1_legacy_dry_run_raw | string | length > 0 }}"
    blastwall_strange_socket_v1_legacy_dry_run: "{{ blastwall_strange_socket_v1_legacy_dry_run_raw | bool }}"
    blastwall_enable_strange_socket_v1_dry_run: "{{ blastwall_strange_socket_v1_requested | bool and blastwall_allow_dry_run_profiles | bool }}"
    blastwall_profile_preflight_group: >-
      {{
        'blastwall_profile_strange_socket_v1'
        if blastwall_strange_socket_v1_requested | bool
        else 'blastwall_profile_base'
      }}
    blastwall_preflight_target_group_override_raw: >-
      {{
        blastwall_preflight_target_group_override |
        default(
          BLASTWALL_PREFLIGHT_TARGET_GROUP |
          default(lookup('env', 'BLASTWALL_PREFLIGHT_TARGET_GROUP') | default('', true), true),
          true
        )
      }}
    blastwall_preflight_effective_group: >-
      {{
        blastwall_preflight_target_group_override_raw
        if blastwall_preflight_target_group_override_raw | length > 0
        else blastwall_profile_preflight_group
      }}
    blastwall_fail_on_stale_policy: true
    blastwall_target_hosts: >-
      {{ groups[blastwall_preflight_effective_group] | default([]) }}
    blastwall_stale_hosts: >-
      {{ groups['blastwall_policy_stale'] | default([]) }}
    blastwall_candidate_hosts: >-
      {{ (blastwall_target_hosts + blastwall_stale_hosts) | unique | list }}
  tasks:
    - name: Require preflight inputs
      ansible.builtin.assert:
        that:
          - ipa_server | length > 0
          - ipa_domain | length > 0
          - ipa_realm | length > 0
          - ipa_keytab | length > 0 or ipa_password | length > 0
          - blastwall_identity | length > 0
        fail_msg: >-
          Set IPA_SERVER, IPA_DOMAIN, IPA_REALM, BLASTWALL_IDENTITY, and
          either IPA_KEYTAB or IPA_PASSWORD for preflight.

    - name: Assert strange-socket-v1 dry-run intent is consistent
      ansible.builtin.assert:
        that:
          - not blastwall_strange_socket_v1_requested | bool or blastwall_allow_dry_run_profiles | bool
          - >-
            not blastwall_strange_socket_v1_legacy_dry_run_set | bool or
            (blastwall_strange_socket_v1_legacy_dry_run | bool) == (blastwall_enable_strange_socket_v1_dry_run | bool)
        fail_msg: >-
          strange-socket-v1 requires canonical dry-run intent:
          include strange-socket-v1 in BLASTWALL_REQUIRED_POLICY_PROFILES and set
          BLASTWALL_ALLOW_DRY_RUN_PROFILES=true. If legacy
          BLASTWALL_STRANGE_SOCKET_V1_DRY_RUN is set, it must agree with the
          derived profile intent.

    - name: Write FreeIPA client config for controller-side lookups
      ansible.builtin.copy:
        dest: /etc/ipa/default.conf
        mode: "0644"
        content: |
          [global]
          server = {{ ipa_server }}
          domain = {{ ipa_domain }}
          realm = {{ ipa_realm }}
          basedn = {{ ipa_basedn }}
          xmlrpc_uri = https://{{ ipa_server }}/ipa/xml

    - name: Read Blastwall SELinux user map
      ansible.builtin.set_fact:
        blastwall_selinux_map: >-
          {{ lookup('eigenstate.ipa.selinuxmap',
                    '%s' | format(blastwall_selinux_map_name),
                    server=ipa_server,
                    ipaadmin_principal=ipa_principal,
                    ipaadmin_password=ipa_password,
                    kerberos_keytab=ipa_keytab,
                    verify=ipa_ca) }}

    - name: Assert SELinux map is active and correct
      ansible.builtin.assert:
        that:
          - blastwall_selinux_map.exists
          - blastwall_selinux_map.enabled
          - blastwall_selinux_map.selinuxuser == blastwall_expected_selinux_user
          - blastwall_selinux_map.hbacrule == blastwall_hbac_rule_name
        fail_msg: >-
          Blastwall SELinux map is not suitable:
          exists={{ blastwall_selinux_map.exists }},
          enabled={{ blastwall_selinux_map.enabled }},
          selinuxuser={{ blastwall_selinux_map.selinuxuser | default('null') }},
          hbacrule={{ blastwall_selinux_map.hbacrule | default('null') }}.

    - name: Read linked HBAC rule
      ansible.builtin.set_fact:
        blastwall_hbac_rule: >-
          {{ lookup('eigenstate.ipa.hbacrule',
                    '%s' | format(blastwall_hbac_rule_name),
                    server=ipa_server,
                    ipaadmin_principal=ipa_principal,
                    ipaadmin_password=ipa_password,
                    kerberos_keytab=ipa_keytab,
                    verify=ipa_ca) }}

    - name: Assert HBAC rule is active and includes SSH
      ansible.builtin.assert:
        that:
          - blastwall_hbac_rule.exists
          - blastwall_hbac_rule.enabled
          - >-
            blastwall_hbac_rule.servicecategory == 'all' or
            'sshd' in blastwall_hbac_rule.services
        fail_msg: >-
          Linked HBAC rule is missing, disabled, or does not permit sshd.

    - name: Read sudo policy
      ansible.builtin.set_fact:
        blastwall_sudo_rule: >-
          {{ lookup('eigenstate.ipa.sudo',
                    '%s' | format(blastwall_sudo_rule_name),
                    sudo_object='rule',
                    server=ipa_server,
                    ipaadmin_principal=ipa_principal,
                    ipaadmin_password=ipa_password,
                    kerberos_keytab=ipa_keytab,
                    verify=ipa_ca) }}

    - name: Assert sudo policy preserves SELinux confinement
      ansible.builtin.assert:
        that:
          - blastwall_sudo_rule.exists
          - blastwall_sudo_rule.enabled
          - "'role=unconfined_r' not in blastwall_sudo_rule.sudooptions"
          - "'type=unconfined_t' not in blastwall_sudo_rule.sudooptions"
          - >-
            blastwall_sudo_rule.runasusercategory == 'all' or
            'root' in blastwall_sudo_rule.runasusers or
            'root' in blastwall_sudo_rule.external_runasusers
        fail_msg: >-
          Blastwall sudo rule is missing, disabled, unconfined, or cannot run
          as root.

    - name: Fail closed when no eligible Blastwall hosts exist
      ansible.builtin.assert:
        that:
          - blastwall_target_hosts | length > 0
        fail_msg: >-
          No current hosts are eligible for Blastwall managed-host verification.
          Current hosts: {{ blastwall_target_hosts | join(', ') }}.
          Stale hosts: {{ blastwall_stale_hosts | join(', ') }}.
      when: blastwall_fail_on_stale_policy | bool

    - name: Fail closed when selected hosts lack required Blastwall profile evidence
      ansible.builtin.command:
        argv: "{{ blastwall_marker_check_argv }}"
        stdin: "{{ host_marker_values | to_json }}"
      register: blastwall_marker_check
      changed_when: false
      failed_when: blastwall_marker_check.rc != 0
      vars:
        raw_host_userclass_values: "{{ hostvars[item].idm_userclass | default([]) }}"
        host_userclass_values: >-
          {{
            raw_host_userclass_values
            if raw_host_userclass_values is not string
            else [raw_host_userclass_values]
          }}
        host_marker_values: "{{ host_userclass_values | select('match', '^blastwall:') | list }}"
        blastwall_marker_check_argv: >-
          {{
            [
              ansible_playbook_python | default('/usr/bin/python3'),
              playbook_dir ~ '/../tools/blastwall_marker.py',
              'check',
              '--registry',
              blastwall_profile_registry_path,
              '--expected-registry-sha256',
              blastwall_profile_registry_sha256,
              '--accepted-rpm',
              blastwall_required_policy_marker,
              '--expected-target',
              'rhel-login',
              '--required-profiles-csv',
              blastwall_required_profile_csv,
              '--markers-stdin'
            ]
            + (['--allow-dry-run-profiles'] if blastwall_allow_dry_run_profiles | bool else [])
          }}
      loop: "{{ blastwall_target_hosts }}"
      when: blastwall_fail_on_stale_policy | bool

    - name: Report selected candidates
      ansible.builtin.debug:
        msg:
          selected_hosts: "{{ blastwall_target_hosts }}"
          stale_hosts: "{{ blastwall_stale_hosts }}"
          candidate_hosts: "{{ blastwall_candidate_hosts }}"
          required_profiles: "{{ required_blastwall_profiles }}"
          registry_sha256: "{{ blastwall_profile_registry_sha256 }}"
          hbac_rule: "{{ blastwall_hbac_rule_name }}"
          selinux_user: "{{ blastwall_selinux_map.selinuxuser }}"
