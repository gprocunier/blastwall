---
- name: Blastwall controller-side suitability gate
  hosts: all
  connection: local
  gather_facts: false
  run_once: true
  vars:
    ipa_server: "{{ lookup('env', 'IPA_SERVER') }}"
    ipa_domain: >-
      {{ lookup('env', 'IPA_DOMAIN') |
      default((ipa_server.split('.')[1:] | join('.')), true) }}
    ipa_realm: >-
      {{ lookup('env', 'IPA_REALM') |
      default((ipa_domain | upper), true) }}
    ipa_basedn: >-
      dc={{ ipa_domain | replace('.', ',dc=') }}
    ipa_principal: "{{ lookup('env', 'IPA_PRINCIPAL') | default('admin', true) }}"
    ipa_password: >-
      {{ lookup('env', 'IPA_PASSWORD') |
      default(lookup('env', 'IPA_ADMIN_PASSWORD'), true) }}
    ipa_login_principal: >-
      {{ ipa_principal if '@' in ipa_principal else ipa_principal ~ '@' ~ ipa_realm }}
    ipa_keytab: "{{ lookup('env', 'IPA_KEYTAB') | default('', true) }}"
    ipa_ca: "{{ lookup('env', 'IPA_CERT') | default('/etc/ipa/ca.crt', true) }}"
    krb5_config: "{{ lookup('env', 'KRB5_CONFIG') | default('', true) }}"
    krb5_ccache: FILE:/tmp/blastwall_preflight_krb5cc
    blastwall_identity: "{{ lookup('env', 'BLASTWALL_IDENTITY') }}"
    blastwall_selinux_map_name: blastwall-root-local-map
    blastwall_expected_selinux_user: blastwall_u:s0
    blastwall_hbac_rule_name: blastwall-ssh
    blastwall_sudo_rule_name: blastwall-root-local-sudo
    blastwall_required_policy_marker: >-
      {{ lookup('env', 'BLASTWALL_REQUIRED_POLICY_MARKER') | default('blastwall-selinux-0.6.1-0.rc1', true) }}
    blastwall_profile_registry_path: "{{ playbook_dir }}/../policy/profiles.yml"
    blastwall_profile_registry_sha256: "{{ lookup('file', blastwall_profile_registry_path, rstrip=False) | hash('sha256') }}"
    blastwall_marker_v2_registry_field: registry_sha256=
    blastwall_required_profiles_env: >-
      {{
        BLASTWALL_REQUIRED_POLICY_PROFILES |
        default(lookup('env', 'BLASTWALL_REQUIRED_POLICY_PROFILES') | default('', true), true)
      }}
    blastwall_allow_dry_run_profiles: >-
      {{
        BLASTWALL_ALLOW_DRY_RUN_PROFILES |
        default(lookup('env', 'BLASTWALL_ALLOW_DRY_RUN_PROFILES') | default('false', true), true) |
        bool
      }}
    required_blastwall_profiles: >-
      {{
        (blastwall_required_profiles_env.split(',') | map('trim') | reject('equalto', '') | list)
        if blastwall_required_profiles_env | length > 0
        else ['base']
      }}
    blastwall_base_scope_csv: alg_socket,bpf,capability2_bpf,packet_socket,userns,io_uring,xfrm,rxrpc,selfprotect
    blastwall_strange_socket_v1_scope_csv: bluetooth_socket,can_socket,kcm_socket,nfc_socket,rds_socket,tipc_socket,xdp_socket
    blastwall_required_scope_csv: >-
      {{
        blastwall_base_scope_csv ~
        ((',' ~ blastwall_strange_socket_v1_scope_csv) if 'strange-socket-v1' in required_blastwall_profiles else '')
      }}
    blastwall_required_profile_csv: "{{ required_blastwall_profiles | join(',') }}"
    blastwall_strange_socket_v1_requested: "{{ 'strange-socket-v1' in required_blastwall_profiles }}"
    blastwall_strange_socket_v1_legacy_dry_run_raw: >-
      {{
        BLASTWALL_STRANGE_SOCKET_V1_DRY_RUN |
        default(lookup('env', 'BLASTWALL_STRANGE_SOCKET_V1_DRY_RUN') | default('', true), true)
      }}
    blastwall_strange_socket_v1_legacy_dry_run_set: "{{ blastwall_strange_socket_v1_legacy_dry_run_raw | string | length > 0 }}"
    blastwall_strange_socket_v1_legacy_dry_run: "{{ blastwall_strange_socket_v1_legacy_dry_run_raw | bool }}"
    blastwall_enable_strange_socket_v1_dry_run: "{{ blastwall_strange_socket_v1_requested | bool and blastwall_allow_dry_run_profiles | bool }}"
    blastwall_profile_preflight_group: >-
      {{
        'blastwall_profile_strange_socket_v1'
        if blastwall_strange_socket_v1_requested | bool
        else 'blastwall_profile_base'
      }}
    blastwall_preflight_target_group_override_raw: >-
      {{
        blastwall_preflight_target_group_override |
        default(
          BLASTWALL_PREFLIGHT_TARGET_GROUP |
          default(lookup('env', 'BLASTWALL_PREFLIGHT_TARGET_GROUP') | default('', true), true),
          true
        )
      }}
    blastwall_preflight_effective_group: >-
      {{
        blastwall_preflight_target_group_override_raw
        if blastwall_preflight_target_group_override_raw | length > 0
        else blastwall_profile_preflight_group
      }}
    blastwall_fail_on_stale_policy: >-
      {{
        BLASTWALL_FAIL_ON_STALE_POLICY |
        default(lookup('env', 'BLASTWALL_FAIL_ON_STALE_POLICY') | default('true', true), true) |
        bool
      }}
    blastwall_fail_on_no_eligible_hosts: >-
      {{
        BLASTWALL_FAIL_ON_NO_ELIGIBLE_HOSTS |
        default(
          lookup('env', 'BLASTWALL_FAIL_ON_NO_ELIGIBLE_HOSTS') |
          default(blastwall_fail_on_stale_policy | string, true),
          true
        ) |
        bool
      }}
    blastwall_validate_selected_markers: >-
      {{
        BLASTWALL_VALIDATE_SELECTED_MARKERS |
        default(lookup('env', 'BLASTWALL_VALIDATE_SELECTED_MARKERS') | default('true', true), true) |
        bool
      }}
    blastwall_danger_skip_marker_validation: >-
      {{
        BLASTWALL_DANGER_SKIP_MARKER_VALIDATION |
        default(lookup('env', 'BLASTWALL_DANGER_SKIP_MARKER_VALIDATION') | default('false', true), true) |
        bool
      }}
    blastwall_danger_skip_marker_validation_reason: >-
      {{
        BLASTWALL_DANGER_SKIP_MARKER_VALIDATION_REASON |
        default(lookup('env', 'BLASTWALL_DANGER_SKIP_MARKER_VALIDATION_REASON') | default('', true), true)
      }}
    blastwall_attestation_mode: >-
      {{
        BLASTWALL_ATTESTATION_MODE |
        default(lookup('env', 'BLASTWALL_ATTESTATION_MODE') | default('reference-v2', true), true)
      }}
    blastwall_attestation_signed_mode: "{{ blastwall_attestation_mode in ['stable-v3', 'breakglass'] }}"
    blastwall_breakglass: >-
      {{
        BLASTWALL_BREAKGLASS |
        default(lookup('env', 'BLASTWALL_BREAKGLASS') | default('false', true), true) |
        bool
      }}
    blastwall_breakglass_host: >-
      {{
        BLASTWALL_BREAKGLASS_HOST |
        default(lookup('env', 'BLASTWALL_BREAKGLASS_HOST') | default('', true), true)
      }}
    blastwall_breakglass_profiles_csv: >-
      {{
        BLASTWALL_BREAKGLASS_PROFILES_CSV |
        default(lookup('env', 'BLASTWALL_BREAKGLASS_PROFILES_CSV') | default('', true), true)
      }}
    blastwall_breakglass_approved_by: >-
      {{
        BLASTWALL_BREAKGLASS_APPROVED_BY |
        default(lookup('env', 'BLASTWALL_BREAKGLASS_APPROVED_BY') | default('', true), true)
      }}
    blastwall_breakglass_ticket: >-
      {{
        BLASTWALL_BREAKGLASS_TICKET |
        default(lookup('env', 'BLASTWALL_BREAKGLASS_TICKET') | default('', true), true)
      }}
    blastwall_breakglass_reason: >-
      {{
        BLASTWALL_BREAKGLASS_REASON |
        default(lookup('env', 'BLASTWALL_BREAKGLASS_REASON') | default('', true), true)
      }}
    blastwall_breakglass_until: >-
      {{
        BLASTWALL_BREAKGLASS_UNTIL |
        default(lookup('env', 'BLASTWALL_BREAKGLASS_UNTIL') | default('', true), true)
      }}
    blastwall_attestation_vault_primary: >-
      {{
        BLASTWALL_ATTESTATION_VAULT_PRIMARY |
        default(lookup('env', 'BLASTWALL_ATTESTATION_VAULT_PRIMARY') | default('', true), true)
      }}
    blastwall_attestation_envelope_dir: >-
      {{
        BLASTWALL_ATTESTATION_ENVELOPE_DIR |
        default(lookup('env', 'BLASTWALL_ATTESTATION_ENVELOPE_DIR') | default('', true), true)
      }}
    blastwall_attestation_index_dir: >-
      {{
        BLASTWALL_ATTESTATION_INDEX_DIR |
        default(lookup('env', 'BLASTWALL_ATTESTATION_INDEX_DIR') | default('', true), true)
      }}
    blastwall_attestation_signer_certificate: >-
      {{
        BLASTWALL_ATTESTATION_SIGNER_CERTIFICATE |
        default(lookup('env', 'BLASTWALL_ATTESTATION_SIGNER_CERTIFICATE') | default('', true), true)
      }}
    blastwall_attestation_ca_bundle: >-
      {{
        BLASTWALL_ATTESTATION_CA_BUNDLE |
        default(lookup('env', 'BLASTWALL_ATTESTATION_CA_BUNDLE') | default(ipa_ca, true), true)
      }}
    blastwall_attestation_signer_allowlist_csv: >-
      {{
        BLASTWALL_ATTESTATION_SIGNER_ALLOWLIST |
        default(lookup('env', 'BLASTWALL_ATTESTATION_SIGNER_ALLOWLIST') | default('', true), true)
      }}
    blastwall_current_policy_sha256: >-
      {{
        BLASTWALL_CURRENT_POLICY_SHA256 |
        default(lookup('env', 'BLASTWALL_CURRENT_POLICY_SHA256') | default('', true), true)
      }}
    blastwall_target_hosts: >-
      {{ groups[blastwall_preflight_effective_group] | default([]) }}
    blastwall_stale_hosts: >-
      {{ groups['blastwall_policy_stale'] | default([]) }}
    blastwall_candidate_hosts: >-
      {{ (blastwall_target_hosts + blastwall_stale_hosts) | unique | list }}
  tasks:
    - name: Require preflight inputs
      ansible.builtin.assert:
        that:
          - ipa_server | length > 0
          - ipa_domain | length > 0
          - ipa_realm | length > 0
          - ipa_keytab | length > 0 or ipa_password | length > 0
          - blastwall_identity | length > 0
        fail_msg: >-
          Set IPA_SERVER, IPA_DOMAIN, IPA_REALM, BLASTWALL_IDENTITY, and
          either IPA_KEYTAB or IPA_PASSWORD for preflight.

    - name: Assert strange-socket-v1 dry-run intent is consistent
      ansible.builtin.assert:
        that:
          - not blastwall_strange_socket_v1_requested | bool or blastwall_allow_dry_run_profiles | bool
          - >-
            not blastwall_strange_socket_v1_legacy_dry_run_set | bool or
            (blastwall_strange_socket_v1_legacy_dry_run | bool) == (blastwall_enable_strange_socket_v1_dry_run | bool)
        fail_msg: >-
          strange-socket-v1 requires canonical dry-run intent:
          include strange-socket-v1 in BLASTWALL_REQUIRED_POLICY_PROFILES and set
          BLASTWALL_ALLOW_DRY_RUN_PROFILES=true. If legacy
          BLASTWALL_STRANGE_SOCKET_V1_DRY_RUN is set, it must agree with the
            derived profile intent.

    - name: Assert marker validation cannot be disabled accidentally
      ansible.builtin.assert:
        that:
          - >-
            blastwall_validate_selected_markers | bool or
            (
              blastwall_danger_skip_marker_validation | bool and
              blastwall_danger_skip_marker_validation_reason | length > 0
            )
        fail_msg: >-
          Marker validation is a safety-critical gate. Do not disable it with
          stale-host tolerance. To bypass for an incident-only diagnostic run,
          set BLASTWALL_DANGER_SKIP_MARKER_VALIDATION=true and provide
          BLASTWALL_DANGER_SKIP_MARKER_VALIDATION_REASON.

    - name: Assert attestation mode is supported
      ansible.builtin.assert:
        that:
          - blastwall_attestation_mode in ['reference-v2', 'transition-v3', 'stable-v3', 'breakglass']
        fail_msg: >-
          BLASTWALL_ATTESTATION_MODE must be one of reference-v2, transition-v3,
          stable-v3, or breakglass.

    - name: Assert stable-v3 attestation inputs are explicit
      ansible.builtin.assert:
        that:
          - blastwall_attestation_vault_primary | length > 0
          - blastwall_attestation_envelope_dir | length > 0
          - blastwall_attestation_index_dir | length > 0
          - blastwall_attestation_signer_certificate | length > 0
          - blastwall_attestation_ca_bundle | length > 0
          - blastwall_attestation_signer_allowlist_csv | length > 0
          - blastwall_current_policy_sha256 is match('^[0-9a-f]{64}$')
        fail_msg: >-
          stable-v3 requires explicit KRA vault primary, retrieved envelope/index
          artifact directories, signer certificate, CA bundle, signer allowlist,
          and live current policy hash. A v3 marker alone is not evidence.
      when: blastwall_attestation_signed_mode

    - name: Assert breakglass metadata is complete when breakglass is active
      ansible.builtin.assert:
        that:
          - blastwall_breakglass_approved_by | length > 0
          - blastwall_breakglass_ticket | length > 0
          - blastwall_breakglass_reason | length > 0
          - blastwall_breakglass_until | length > 0
          - blastwall_breakglass_until | int > 0
        fail_msg: >-
          BLASTWALL_BREAKGLASS requires approved_by, ticket, reason, and unix
          until metadata.
      when:
        - blastwall_attestation_mode == 'breakglass'
        - blastwall_breakglass | bool

    - name: Warn when marker validation is explicitly bypassed
      ansible.builtin.debug:
        msg:
          marker_validation_bypassed: true
          reason: "{{ blastwall_danger_skip_marker_validation_reason }}"
          warning: >-
            BLASTWALL_DANGER_SKIP_MARKER_VALIDATION disables parser-backed
            selected-host marker checks for this run only.
      when:
        - not blastwall_validate_selected_markers | bool
        - blastwall_danger_skip_marker_validation | bool

    - name: Write FreeIPA client config for controller-side lookups
      ansible.builtin.copy:
        dest: /etc/ipa/default.conf
        mode: "0644"
        content: |
          [global]
          server = {{ ipa_server }}
          domain = {{ ipa_domain }}
          realm = {{ ipa_realm }}
          basedn = {{ ipa_basedn }}
          xmlrpc_uri = https://{{ ipa_server }}/ipa/xml

    - name: Install injected FreeIPA CA for controller-side lookups
      ansible.builtin.copy:
        src: "{{ ipa_ca }}"
        dest: /etc/ipa/ca.crt
        mode: "0644"
        remote_src: true
      when:
        - ipa_ca | length > 0
        - ipa_ca != "/etc/ipa/ca.crt"

    - name: Read Blastwall SELinux user map
      ansible.builtin.set_fact:
        blastwall_selinux_map: >-
          {{ lookup('eigenstate.ipa.selinuxmap',
                    '%s' | format(blastwall_selinux_map_name),
                    server=ipa_server,
                    ipaadmin_principal=ipa_principal,
                    ipaadmin_password=ipa_password,
                    kerberos_keytab=ipa_keytab,
                    verify=ipa_ca) }}

    - name: Assert SELinux map is active and correct
      ansible.builtin.assert:
        that:
          - blastwall_selinux_map.exists
          - blastwall_selinux_map.enabled
          - blastwall_selinux_map.selinuxuser == blastwall_expected_selinux_user
          - blastwall_selinux_map.hbacrule == blastwall_hbac_rule_name
        fail_msg: >-
          Blastwall SELinux map is not suitable:
          exists={{ blastwall_selinux_map.exists }},
          enabled={{ blastwall_selinux_map.enabled }},
          selinuxuser={{ blastwall_selinux_map.selinuxuser | default('null') }},
          hbacrule={{ blastwall_selinux_map.hbacrule | default('null') }}.

    - name: Read linked HBAC rule
      ansible.builtin.set_fact:
        blastwall_hbac_rule: >-
          {{ lookup('eigenstate.ipa.hbacrule',
                    '%s' | format(blastwall_hbac_rule_name),
                    server=ipa_server,
                    ipaadmin_principal=ipa_principal,
                    ipaadmin_password=ipa_password,
                    kerberos_keytab=ipa_keytab,
                    verify=ipa_ca) }}

    - name: Assert HBAC rule is active and includes SSH
      ansible.builtin.assert:
        that:
          - blastwall_hbac_rule.exists
          - blastwall_hbac_rule.enabled
          - >-
            blastwall_hbac_rule.servicecategory == 'all' or
            'sshd' in blastwall_hbac_rule.services
        fail_msg: >-
          Linked HBAC rule is missing, disabled, or does not permit sshd.

    - name: Read sudo policy
      ansible.builtin.set_fact:
        blastwall_sudo_rule: >-
          {{ lookup('eigenstate.ipa.sudo',
                    '%s' | format(blastwall_sudo_rule_name),
                    sudo_object='rule',
                    server=ipa_server,
                    ipaadmin_principal=ipa_principal,
                    ipaadmin_password=ipa_password,
                    kerberos_keytab=ipa_keytab,
                    verify=ipa_ca) }}

    - name: Assert sudo policy preserves SELinux confinement
      ansible.builtin.assert:
        that:
          - blastwall_sudo_rule.exists
          - blastwall_sudo_rule.enabled
          - "'role=unconfined_r' not in blastwall_sudo_rule.sudooptions"
          - "'type=unconfined_t' not in blastwall_sudo_rule.sudooptions"
          - >-
            blastwall_sudo_rule.runasusercategory == 'all' or
            'root' in blastwall_sudo_rule.runasusers or
            'root' in blastwall_sudo_rule.external_runasusers
        fail_msg: >-
          Blastwall sudo rule is missing, disabled, unconfined, or cannot run
          as root.

    - name: Fail closed when no eligible Blastwall hosts exist
      ansible.builtin.assert:
        that:
          - blastwall_target_hosts | length > 0
        fail_msg: >-
          No current hosts are eligible for Blastwall managed-host verification.
          Current hosts: {{ blastwall_target_hosts | join(', ') }}.
          Stale hosts: {{ blastwall_stale_hosts | join(', ') }}.
      when: blastwall_fail_on_no_eligible_hosts | bool

    - name: Authenticate FreeIPA client for live stable-v3 marker lookups
      ansible.builtin.shell: |
        set -euo pipefail
        if [ -n "${IPA_KEYTAB}" ]; then
          kinit -k -t "${IPA_KEYTAB}" "${IPA_LOGIN_PRINCIPAL}" >/dev/null
        else
          printf '%s\n' "${IPA_PASSWORD}" | kinit "${IPA_LOGIN_PRINCIPAL}" >/dev/null
        fi
      args:
        executable: /bin/bash
      environment:
        IPA_KEYTAB: "{{ ipa_keytab }}"
        IPA_LOGIN_PRINCIPAL: "{{ ipa_login_principal }}"
        IPA_PASSWORD: "{{ ipa_password }}"
        KRB5_CONFIG: "{{ krb5_config }}"
        KRB5CCNAME: "{{ krb5_ccache }}"
      changed_when: false
      no_log: true
      when:
        - blastwall_attestation_signed_mode
        - blastwall_validate_selected_markers | bool

    - name: Read live stable-v3 host marker hints from FreeIPA
      ansible.builtin.shell: |
        set -euo pipefail
        ipa -e "server=${IPA_SERVER}" -f -n host-show "${BLASTWALL_HOST}" --all --raw |
          sed -n 's/^  userclass: //p'
      args:
        executable: /bin/bash
      environment:
        IPA_SERVER: "{{ ipa_server }}"
        BLASTWALL_HOST: "{{ item }}"
        KRB5_CONFIG: "{{ krb5_config }}"
        KRB5CCNAME: "{{ krb5_ccache }}"
      register: blastwall_live_host_show
      changed_when: false
      failed_when: blastwall_live_host_show.rc != 0
      loop: "{{ blastwall_target_hosts }}"
      when:
        - blastwall_attestation_signed_mode
        - blastwall_validate_selected_markers | bool

    - name: Store live stable-v3 host marker hints
      ansible.builtin.set_fact:
        blastwall_live_userclass_by_host: >-
          {{
            blastwall_live_userclass_by_host | default({}) |
            combine({
              item.item: item.stdout_lines | default([]) | select('match', '^blastwall:') | list
            })
          }}
      loop: "{{ blastwall_live_host_show.results | default([]) }}"
      when:
        - blastwall_attestation_signed_mode
        - blastwall_validate_selected_markers | bool

    - name: Fail closed when selected hosts lack required Blastwall profile evidence
      ansible.builtin.command:
        argv: "{{ blastwall_marker_check_argv }}"
        stdin: "{{ host_marker_values | to_json }}"
      register: blastwall_marker_check
      changed_when: false
      failed_when: blastwall_marker_check.rc != 0
      vars:
        raw_host_userclass_values: "{{ hostvars[item].idm_userclass | default([]) }}"
        host_userclass_values: >-
          {{
            raw_host_userclass_values
            if raw_host_userclass_values is not string
            else [raw_host_userclass_values]
          }}
        host_marker_values: "{{ host_userclass_values | select('match', '^blastwall:') | list }}"
        blastwall_marker_check_argv: >-
          {{
            [
              ansible_playbook_python | default('/usr/bin/python3'),
              playbook_dir ~ '/../tools/blastwall_marker.py',
              'check',
              '--registry',
              blastwall_profile_registry_path,
              '--expected-registry-sha256',
              blastwall_profile_registry_sha256,
              '--accepted-rpm',
              blastwall_required_policy_marker,
              '--expected-target',
              'rhel-login',
              '--required-profiles-csv',
              blastwall_required_profile_csv,
              '--markers-stdin'
            ]
            + (['--allow-dry-run-profiles'] if blastwall_allow_dry_run_profiles | bool else [])
          }}
      loop: "{{ blastwall_target_hosts }}"
      when:
        - blastwall_validate_selected_markers | bool
        - not blastwall_attestation_signed_mode

    - name: Fail closed when stable-v3 selected host lacks a v3 marker hint
      ansible.builtin.assert:
        that:
          - host_v3_marker | length > 0
        fail_msg: >-
          stable-v3 selected host {{ item }} does not expose a v3 attestation marker hint.
      vars:
        raw_inventory_userclass_values: "{{ hostvars[item].idm_userclass | default([]) }}"
        inventory_userclass_values: >-
          {{
            raw_inventory_userclass_values
            if raw_inventory_userclass_values is not string
            else [raw_inventory_userclass_values]
          }}
        live_userclass_values: "{{ (blastwall_live_userclass_by_host | default({})).get(item, []) }}"
        host_userclass_values: >-
          {{
            (inventory_userclass_values + live_userclass_values) | unique | list
          }}
        host_marker_values: "{{ host_userclass_values | select('match', '^blastwall:') | list }}"
        host_v3_marker: >-
          {{
            (
              host_marker_values |
              select('match', '^blastwall:.*(?:^blastwall:|;)v=3(?:;|$)') |
              list |
              first
            ) | default('', true)
          }}
      loop: "{{ blastwall_target_hosts }}"
      when: blastwall_attestation_signed_mode

    - name: Verify stable-v3 signed attestation before launch
      ansible.builtin.command:
        argv: "{{ blastwall_attestation_verify_argv }}"
      register: blastwall_attestation_verify
      changed_when: false
      failed_when: blastwall_attestation_verify.rc != 0
      vars:
        raw_inventory_userclass_values: "{{ hostvars[item].idm_userclass | default([]) }}"
        inventory_userclass_values: >-
          {{
            raw_inventory_userclass_values
            if raw_inventory_userclass_values is not string
            else [raw_inventory_userclass_values]
          }}
        live_userclass_values: "{{ (blastwall_live_userclass_by_host | default({})).get(item, []) }}"
        host_userclass_values: >-
          {{
            (inventory_userclass_values + live_userclass_values) | unique | list
          }}
        host_marker_values: "{{ host_userclass_values | select('match', '^blastwall:') | list }}"
        host_v3_marker: >-
          {{
            (
              host_marker_values |
              select('match', '^blastwall:.*(?:^blastwall:|;)v=3(?:;|$)') |
              list |
              first
            ) | default('', true)
          }}
        blastwall_attestation_verify_argv: >-
          {{
            [
              ansible_playbook_python | default('/usr/bin/python3'),
              playbook_dir ~ '/../tools/blastwall_attestation_verify.py',
              '--marker',
              host_v3_marker,
              '--envelope-json',
              blastwall_attestation_envelope_dir ~ '/' ~ item ~ '.json',
              '--index-json',
              blastwall_attestation_index_dir ~ '/' ~ item ~ '.json',
              '--signer-certificate',
              blastwall_attestation_signer_certificate,
              '--ca-bundle',
              blastwall_attestation_ca_bundle,
              '--signer-allowlist-csv',
              blastwall_attestation_signer_allowlist_csv,
              '--expected-host',
              item,
              '--expected-target',
              'rhel-login',
              '--expected-rpm',
              blastwall_required_policy_marker,
              '--expected-registry-sha256',
              blastwall_profile_registry_sha256,
              '--current-policy-sha256',
              blastwall_current_policy_sha256,
              '--required-profiles-csv',
              blastwall_required_profile_csv
            ]
            + ([
              '--breakglass',
              '--breakglass-host',
              blastwall_breakglass_host | default(item, true),
              '--breakglass-profiles-csv',
              blastwall_breakglass_profiles_csv | default(blastwall_required_profile_csv, true),
              '--breakglass-approved-by',
              blastwall_breakglass_approved_by,
              '--breakglass-ticket',
              blastwall_breakglass_ticket,
              '--breakglass-reason',
              blastwall_breakglass_reason,
              '--breakglass-until',
              blastwall_breakglass_until,
            ] if blastwall_breakglass | bool else [])
          }}
      loop: "{{ blastwall_target_hosts }}"
      when: blastwall_attestation_signed_mode

    - name: Report selected candidates
      ansible.builtin.debug:
        msg:
          selected_hosts: "{{ blastwall_target_hosts }}"
          stale_hosts: "{{ blastwall_stale_hosts }}"
          candidate_hosts: "{{ blastwall_candidate_hosts }}"
          effective_group: "{{ blastwall_preflight_effective_group }}"
          required_profiles: "{{ required_blastwall_profiles }}"
          fail_on_no_eligible_hosts: "{{ blastwall_fail_on_no_eligible_hosts }}"
          marker_validation_enabled: "{{ blastwall_validate_selected_markers }}"
          marker_validation_bypass_reason: "{{ blastwall_danger_skip_marker_validation_reason }}"
          attestation_mode: "{{ blastwall_attestation_mode }}"
          attestation_vault_primary: "{{ blastwall_attestation_vault_primary }}"
          stable_v3_verification: "{{ blastwall_attestation_verify.results | default([]) }}"
          registry_sha256: "{{ blastwall_profile_registry_sha256 }}"
          hbac_rule: "{{ blastwall_hbac_rule_name }}"
          selinux_user: "{{ blastwall_selinux_map.selinuxuser }}"
