---
- name: Apply a controlled Blastwall negative-gate IdM marker state
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ipa_server: "{{ lookup('env', 'IPA_SERVER') }}"
    ipa_domain: >-
      {{ lookup('env', 'IPA_DOMAIN') |
      default((ipa_server.split('.')[1:] | join('.')), true) }}
    ipa_realm: >-
      {{ lookup('env', 'IPA_REALM') |
      default((ipa_domain | upper), true) }}
    ipa_basedn: >-
      dc={{ ipa_domain | replace('.', ',dc=') }}
    ipa_principal: "{{ lookup('env', 'IPA_PRINCIPAL') }}"
    ipa_login_principal: >-
      {{ ipa_principal if '@' in ipa_principal else ipa_principal ~ '@' ~ ipa_realm }}
    ipa_password: >-
      {{ lookup('env', 'IPA_PASSWORD') |
      default(lookup('env', 'IPA_ADMIN_PASSWORD'), true) }}
    ipa_ca: "{{ lookup('env', 'IPA_CERT') | default('/etc/ipa/ca.crt', true) }}"
    blastwall_negative_gate_host: >-
      {{
        BLASTWALL_NEGATIVE_GATE_HOST |
        default(lookup('env', 'BLASTWALL_NEGATIVE_GATE_HOST') | default('', true), true)
      }}
    blastwall_negative_gate_userclass_json: >-
      {{
        BLASTWALL_NEGATIVE_GATE_USERCLASS_JSON |
        default(lookup('env', 'BLASTWALL_NEGATIVE_GATE_USERCLASS_JSON') | default('[]', true), true)
      }}
    blastwall_negative_gate_reason: >-
      {{
        BLASTWALL_NEGATIVE_GATE_REASON |
        default(lookup('env', 'BLASTWALL_NEGATIVE_GATE_REASON') | default('', true), true)
      }}
    blastwall_negative_gate_userclass: >-
      {{
        blastwall_negative_gate_userclass_json
        if (
          blastwall_negative_gate_userclass_json is sequence
          and blastwall_negative_gate_userclass_json is not string
        )
        else (blastwall_negative_gate_userclass_json | from_json)
      }}
  tasks:
    - name: Require explicit negative-gate marker inputs
      ansible.builtin.assert:
        that:
          - ipa_server | length > 0
          - ipa_domain | length > 0
          - ipa_realm | length > 0
          - ipa_principal | length > 0
          - ipa_password | length > 0
          - blastwall_negative_gate_host | length > 0
          - blastwall_negative_gate_reason | length > 0
          - blastwall_negative_gate_userclass is sequence
          - blastwall_negative_gate_userclass is not string
        fail_msg: >-
          Set BLASTWALL_NEGATIVE_GATE_HOST,
          BLASTWALL_NEGATIVE_GATE_USERCLASS_JSON, and
          BLASTWALL_NEGATIVE_GATE_REASON before mutating IdM marker state.

    - name: Write FreeIPA client config for negative-gate marker mutation
      ansible.builtin.copy:
        dest: /etc/ipa/default.conf
        mode: "0644"
        content: |
          [global]
          server = {{ ipa_server }}
          domain = {{ ipa_domain }}
          realm = {{ ipa_realm }}
          basedn = {{ ipa_basedn }}
          xmlrpc_uri = https://{{ ipa_server }}/ipa/xml

    - name: Install injected FreeIPA CA for negative-gate marker mutation
      ansible.builtin.copy:
        src: "{{ ipa_ca }}"
        dest: /etc/ipa/ca.crt
        mode: "0644"
        remote_src: true
      when:
        - ipa_ca | length > 0
        - ipa_ca != "/etc/ipa/ca.crt"

    - name: Apply controlled Blastwall negative-gate userClass state
      block:
        - name: Apply controlled Blastwall negative-gate userClass state with collection
          freeipa.ansible_freeipa.ipahost:
            ipaadmin_principal: "{{ ipa_principal }}"
            ipaadmin_password: "{{ ipa_password }}"
            name: "{{ blastwall_negative_gate_host }}"
            userclass: "{{ blastwall_negative_gate_userclass }}"
            force: true
            state: present
          no_log: true
      rescue:
        - name: Apply controlled Blastwall negative-gate userClass state with FreeIPA CLI fallback
          ansible.builtin.shell: |
            set -euo pipefail
            printf '%s\n' "${IPA_PASSWORD}" | kinit "${IPA_LOGIN_PRINCIPAL}" >/dev/null
            ipa -e "server=${IPA_SERVER}" -f -n host-show "${BLASTWALL_HOST}" >/dev/null

            attrs_file="$(mktemp)"
            python3 - <<'PY' > "${attrs_file}"
            import json
            import os

            for value in json.loads(os.environ["BLASTWALL_USERCLASS_JSON"]):
                print(value)
            PY

            mapfile -t desired_classes < "${attrs_file}"
            first_class="${desired_classes[0]:-}"
            [ -n "${first_class}" ]
            ipa -e "server=${IPA_SERVER}" -f -n host-mod "${BLASTWALL_HOST}" \
              --setattr="userclass=${first_class}" >/dev/null

            for desired in "${desired_classes[@]:1}"; do
              [ -n "${desired}" ] || continue
              ipa -e "server=${IPA_SERVER}" -f -n host-mod "${BLASTWALL_HOST}" \
                --addattr="userclass=${desired}" >/dev/null
            done
            rm -f "${attrs_file}"
          args:
            executable: /bin/bash
          environment:
            IPA_LOGIN_PRINCIPAL: "{{ ipa_login_principal }}"
            IPA_PASSWORD: "{{ ipa_password }}"
            IPA_SERVER: "{{ ipa_server }}"
            KRB5CCNAME: FILE:/tmp/blastwall_negative_gate_krb5cc
            BLASTWALL_HOST: "{{ blastwall_negative_gate_host }}"
            BLASTWALL_USERCLASS_JSON: "{{ blastwall_negative_gate_userclass | to_json }}"
            BLASTWALL_NEGATIVE_GATE_REASON: "{{ blastwall_negative_gate_reason }}"
          no_log: true
          changed_when: true

    - name: Report controlled negative-gate marker mutation
      ansible.builtin.debug:
        msg:
          host: "{{ blastwall_negative_gate_host }}"
          userclass_count: "{{ blastwall_negative_gate_userclass | length }}"
          blastwall_markers: >-
            {{
              blastwall_negative_gate_userclass |
              select('match', '^blastwall:') |
              list
            }}
          reason: "{{ blastwall_negative_gate_reason }}"
