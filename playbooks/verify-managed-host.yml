---
- name: Verify Blastwall managed-host confinement
  hosts: "{{ blastwall_verify_target_hosts | default('blastwall_policy_current') }}"
  gather_facts: false
  vars:
    ipa_principal: "{{ lookup('env', 'IPA_PRINCIPAL') }}"
    ipa_realm: "{{ lookup('env', 'IPA_REALM') | default('', true) }}"
    ipa_login_principal: >-
      {{ ipa_principal if '@' in ipa_principal else ipa_principal ~ '@' ~ ipa_realm }}
    ipa_password: >-
      {{ lookup('env', 'IPA_PASSWORD') |
      default(lookup('env', 'IPA_ADMIN_PASSWORD'), true) }}
    ipa_keytab: "{{ lookup('env', 'IPA_KEYTAB') | default('', true) }}"
    krb5_config: "{{ lookup('env', 'KRB5_CONFIG') | default('', true) }}"
    krb5_ccache: FILE:/tmp/blastwall_krb5cc
    blastwall_expected_contexts:
      - blastwall_u:blastwall_r:blastwall_root_local_t:s0
      - blastwall_u:blastwall_r:blastwall_t:s0
    blastwall_trigger_path: >-
      {{ playbook_dir }}/../tests/trigger-copyfail-afalg.py
    blastwall_bpf_trigger_path: >-
      {{ playbook_dir }}/../tests/trigger-bpf-deny.py
    blastwall_packet_socket_trigger_path: >-
      {{ playbook_dir }}/../tests/trigger-packet-socket-deny.py
    blastwall_io_uring_trigger_path: >-
      {{ playbook_dir }}/../tests/trigger-io-uring-deny.py
    blastwall_userns_trigger_path: >-
      {{ playbook_dir }}/../tests/trigger-userns-deny.py
    blastwall_dirtyfrag_trigger_path: >-
      {{ playbook_dir }}/../tests/trigger-dirtyfrag-deny.py
  tasks:
    - name: Require Kerberos inputs for target SSH
      ansible.builtin.assert:
        that:
          - ipa_principal | length > 0
          - ipa_realm | length > 0 or '@' in ipa_principal
          - ipa_keytab | length > 0 or ipa_password | length > 0
        fail_msg: >-
          Set IPA_PRINCIPAL, IPA_REALM, and either IPA_KEYTAB or IPA_PASSWORD for GSSAPI
          target SSH.
      run_once: true
      delegate_to: localhost

    - name: Authenticate automation identity for GSSAPI target SSH
      ansible.builtin.shell: |
        set -euo pipefail
        if [ -n "${IPA_KEYTAB}" ]; then
          kinit -k -t "${IPA_KEYTAB}" "${IPA_LOGIN_PRINCIPAL}"
        else
          printf '%s\n' "${IPA_PASSWORD}" | kinit "${IPA_LOGIN_PRINCIPAL}"
        fi
      args:
        executable: /bin/bash
      environment:
        IPA_LOGIN_PRINCIPAL: "{{ ipa_login_principal }}"
        IPA_PASSWORD: "{{ ipa_password }}"
        IPA_KEYTAB: "{{ ipa_keytab }}"
        KRB5_CONFIG: "{{ krb5_config }}"
        KRB5CCNAME: "{{ krb5_ccache }}"
      changed_when: false
      no_log: true
      run_once: true
      delegate_to: localhost

    - name: Capture login SELinux context
      ansible.builtin.command: id -Z
      register: blastwall_idz
      changed_when: false

    - name: Assert login context is confined
      ansible.builtin.assert:
        that:
          - blastwall_idz.stdout in blastwall_expected_contexts
        fail_msg: >-
          Expected one of {{ blastwall_expected_contexts }}, got
          {{ blastwall_idz.stdout }}.

    - name: Capture sudo identity and SELinux context
      ansible.builtin.command: sudo sh -c 'id -u; id -Z'
      register: blastwall_sudo_id
      changed_when: false

    - name: Assert sudo reaches UID 0 without leaving Blastwall type
      ansible.builtin.assert:
        that:
          - blastwall_sudo_id.stdout_lines[0] == '0'
          - blastwall_sudo_id.stdout_lines[1] in blastwall_expected_contexts
        fail_msg: >-
          sudo did not preserve Blastwall confinement:
          {{ blastwall_sudo_id.stdout_lines }}

    - name: Copy AF_ALG trigger to target
      ansible.builtin.copy:
        src: "{{ blastwall_trigger_path }}"
        dest: /tmp/trigger-copyfail-afalg.py
        mode: "0755"

    - name: Verify AF_ALG authencesn bind is blocked
      ansible.builtin.command: /tmp/trigger-copyfail-afalg.py
      register: blastwall_trigger
      changed_when: false
      failed_when:
        - blastwall_trigger.rc not in [0, 77]

    - name: Show AF_ALG trigger result
      ansible.builtin.debug:
        var: blastwall_trigger.stdout

    - name: Copy BPF trigger to target
      ansible.builtin.copy:
        src: "{{ blastwall_bpf_trigger_path }}"
        dest: /tmp/trigger-bpf-deny.py
        mode: "0755"

    - name: Verify BPF map creation is blocked
      ansible.builtin.command: /tmp/trigger-bpf-deny.py
      register: blastwall_bpf_trigger
      changed_when: false

    - name: Show BPF trigger result
      ansible.builtin.debug:
        var: blastwall_bpf_trigger.stdout

    - name: Copy packet_socket trigger to target
      ansible.builtin.copy:
        src: "{{ blastwall_packet_socket_trigger_path }}"
        dest: /tmp/trigger-packet-socket-deny.py
        mode: "0755"

    - name: Verify AF_PACKET socket creation is blocked
      ansible.builtin.command: /tmp/trigger-packet-socket-deny.py
      register: blastwall_packet_socket_trigger
      changed_when: false

    - name: Show packet_socket trigger result
      ansible.builtin.debug:
        var: blastwall_packet_socket_trigger.stdout

    - name: Copy userns trigger to target
      ansible.builtin.copy:
        src: "{{ blastwall_userns_trigger_path }}"
        dest: /tmp/trigger-userns-deny.py
        mode: "0755"

    - name: Verify user namespace creation is blocked
      ansible.builtin.command: /tmp/trigger-userns-deny.py
      register: blastwall_userns_trigger
      changed_when: false

    - name: Show userns trigger result
      ansible.builtin.debug:
        var: blastwall_userns_trigger.stdout

    - name: Copy io_uring trigger to target
      ansible.builtin.copy:
        src: "{{ blastwall_io_uring_trigger_path }}"
        dest: /tmp/trigger-io-uring-deny.py
        mode: "0755"

    - name: Verify io_uring_setup is blocked (may SKIP on older kernels)
      ansible.builtin.command: /tmp/trigger-io-uring-deny.py
      register: blastwall_io_uring_trigger
      changed_when: false
      failed_when:
        - blastwall_io_uring_trigger.rc == 1

    - name: Show io_uring trigger result
      ansible.builtin.debug:
        var: blastwall_io_uring_trigger.stdout

    - name: Copy Dirty Frag trigger to target
      ansible.builtin.copy:
        src: "{{ blastwall_dirtyfrag_trigger_path }}"
        dest: /tmp/trigger-dirtyfrag-deny.py
        mode: "0755"

    - name: Verify Dirty Frag xfrm and RxRPC entry points are blocked
      ansible.builtin.command: /tmp/trigger-dirtyfrag-deny.py
      register: blastwall_dirtyfrag_trigger
      changed_when: false

    - name: Show Dirty Frag trigger result
      ansible.builtin.debug:
        var: blastwall_dirtyfrag_trigger.stdout
