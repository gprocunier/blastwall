---
- name: Verify Blastwall managed-host confinement
  hosts: "{{ blastwall_verify_target_hosts | default('blastwall_profile_base') }}"
  gather_facts: false
  vars:
    ipa_principal: "{{ lookup('env', 'IPA_PRINCIPAL') }}"
    ipa_realm: "{{ lookup('env', 'IPA_REALM') | default('', true) }}"
    ipa_login_principal: >-
      {{ ipa_principal if '@' in ipa_principal else ipa_principal ~ '@' ~ ipa_realm }}
    ipa_password: >-
      {{ lookup('env', 'IPA_PASSWORD') |
      default(lookup('env', 'IPA_ADMIN_PASSWORD'), true) }}
    ipa_keytab: "{{ lookup('env', 'IPA_KEYTAB') | default('', true) }}"
    krb5_config: "{{ lookup('env', 'KRB5_CONFIG') | default('', true) }}"
    krb5_ccache: FILE:/tmp/blastwall_krb5cc
    blastwall_expected_contexts:
      - blastwall_u:blastwall_r:blastwall_root_local_t:s0
      - blastwall_u:blastwall_r:blastwall_t:s0
    blastwall_trigger_path: >-
      {{ playbook_dir }}/../tests/trigger-copyfail-afalg.py
    blastwall_bpf_trigger_path: >-
      {{ playbook_dir }}/../tests/trigger-bpf-deny.py
    blastwall_packet_socket_trigger_path: >-
      {{ playbook_dir }}/../tests/trigger-packet-socket-deny.py
    blastwall_io_uring_trigger_path: >-
      {{ playbook_dir }}/../tests/trigger-io-uring-deny.py
    blastwall_userns_trigger_path: >-
      {{ playbook_dir }}/../tests/trigger-userns-deny.py
    blastwall_dirtyfrag_trigger_path: >-
      {{ playbook_dir }}/../tests/trigger-dirtyfrag-deny.py
    blastwall_strange_socket_v1_trigger_path: >-
      {{ playbook_dir }}/../tests/trigger-strange-socket-v1-deny.py
    blastwall_allow_dry_run_profiles: >-
      {{
        BLASTWALL_ALLOW_DRY_RUN_PROFILES |
        default(lookup('env', 'BLASTWALL_ALLOW_DRY_RUN_PROFILES') | default('false', true), true) |
        bool
      }}
    blastwall_required_profiles_env: >-
      {{
        BLASTWALL_REQUIRED_POLICY_PROFILES |
        default(lookup('env', 'BLASTWALL_REQUIRED_POLICY_PROFILES') | default('', true), true)
      }}
    required_blastwall_profiles: >-
      {{
        (blastwall_required_profiles_env.split(',') | map('trim') | reject('equalto', '') | list)
        if blastwall_required_profiles_env | length > 0
        else ['base']
      }}
    blastwall_strange_socket_v1_requested: "{{ 'strange-socket-v1' in required_blastwall_profiles }}"
    blastwall_strange_socket_v1_legacy_dry_run_raw: >-
      {{
        BLASTWALL_STRANGE_SOCKET_V1_DRY_RUN |
        default(lookup('env', 'BLASTWALL_STRANGE_SOCKET_V1_DRY_RUN') | default('', true), true)
      }}
    blastwall_strange_socket_v1_legacy_dry_run_set: "{{ blastwall_strange_socket_v1_legacy_dry_run_raw | string | length > 0 }}"
    blastwall_strange_socket_v1_legacy_dry_run: "{{ blastwall_strange_socket_v1_legacy_dry_run_raw | bool }}"
    blastwall_enable_strange_socket_v1_dry_run: "{{ blastwall_strange_socket_v1_requested | bool and blastwall_allow_dry_run_profiles | bool }}"
  tasks:
    - name: Require Kerberos inputs for target SSH
      ansible.builtin.assert:
        that:
          - ipa_principal | length > 0
          - ipa_realm | length > 0 or '@' in ipa_principal
          - ipa_keytab | length > 0 or ipa_password | length > 0
        fail_msg: >-
          Set IPA_PRINCIPAL, IPA_REALM, and either IPA_KEYTAB or IPA_PASSWORD for GSSAPI
          target SSH.
      run_once: true
      delegate_to: localhost

    - name: Assert strange-socket-v1 dry-run intent is consistent
      ansible.builtin.assert:
        that:
          - not blastwall_strange_socket_v1_requested | bool or blastwall_allow_dry_run_profiles | bool
          - >-
            not blastwall_strange_socket_v1_legacy_dry_run_set | bool or
            (blastwall_strange_socket_v1_legacy_dry_run | bool) == (blastwall_enable_strange_socket_v1_dry_run | bool)
        fail_msg: >-
          strange-socket-v1 requires canonical dry-run intent:
          include strange-socket-v1 in BLASTWALL_REQUIRED_POLICY_PROFILES and set
          BLASTWALL_ALLOW_DRY_RUN_PROFILES=true. If legacy
          BLASTWALL_STRANGE_SOCKET_V1_DRY_RUN is set, it must agree with the
          derived profile intent.
      run_once: true
      delegate_to: localhost

    - name: Authenticate automation identity for GSSAPI target SSH
      ansible.builtin.shell: |
        set -euo pipefail
        if [ -n "${IPA_KEYTAB}" ]; then
          kinit -k -t "${IPA_KEYTAB}" "${IPA_LOGIN_PRINCIPAL}"
        else
          printf '%s\n' "${IPA_PASSWORD}" | kinit "${IPA_LOGIN_PRINCIPAL}"
        fi
      args:
        executable: /bin/bash
      environment:
        IPA_LOGIN_PRINCIPAL: "{{ ipa_login_principal }}"
        IPA_PASSWORD: "{{ ipa_password }}"
        IPA_KEYTAB: "{{ ipa_keytab }}"
        KRB5_CONFIG: "{{ krb5_config }}"
        KRB5CCNAME: "{{ krb5_ccache }}"
      changed_when: false
      no_log: true
      run_once: true
      delegate_to: localhost

    - name: Capture login SELinux context
      ansible.builtin.command: id -Z
      register: blastwall_idz
      changed_when: false

    - name: Assert login context is confined
      ansible.builtin.assert:
        that:
          - blastwall_idz.stdout in blastwall_expected_contexts
        fail_msg: >-
          Expected one of {{ blastwall_expected_contexts }}, got
          {{ blastwall_idz.stdout }}.

    - name: Capture sudo UID through allowed command
      ansible.builtin.command: sudo /usr/bin/id -u
      register: blastwall_sudo_uid
      changed_when: false

    - name: Capture sudo SELinux context through allowed command
      ansible.builtin.command: sudo /usr/bin/id -Z
      register: blastwall_sudo_context
      changed_when: false

    - name: Assert sudo reaches UID 0 without leaving Blastwall type
      ansible.builtin.assert:
        that:
          - blastwall_sudo_uid.stdout == '0'
          - blastwall_sudo_context.stdout in blastwall_expected_contexts
        fail_msg: >-
          sudo did not preserve Blastwall confinement:
          uid={{ blastwall_sudo_uid.stdout | default('') }},
          context={{ blastwall_sudo_context.stdout | default('') }}.

    - name: Copy AF_ALG trigger to target
      ansible.builtin.copy:
        src: "{{ blastwall_trigger_path }}"
        dest: /tmp/trigger-copyfail-afalg.py
        mode: "0755"

    - name: Verify AF_ALG authencesn bind is blocked
      ansible.builtin.command: /tmp/trigger-copyfail-afalg.py
      register: blastwall_trigger
      changed_when: false
      failed_when: false

    - name: Evaluate AF_ALG probe output
      ansible.builtin.set_fact:
        blastwall_af_alg_probe_output: "{{ blastwall_trigger.stdout | default('') | trim + '\n' + blastwall_trigger.stderr | default('') | trim }}"

    - name: Assert AF_ALG evidence is blocked
      ansible.builtin.assert:
        that:
          - >
            (blastwall_trigger.rc == 0 and 'BLOCKED:' in blastwall_af_alg_probe_output)
            and 'FAIL_UNKNOWN' not in blastwall_af_alg_probe_output
        fail_msg: >-
          AF_ALG confinement check did not return blocked evidence:
          rc={{ blastwall_trigger.rc }}.
          output={{ blastwall_af_alg_probe_output }}

    - name: Show AF_ALG trigger result
      ansible.builtin.debug:
        var: blastwall_trigger.stdout

    - name: Copy BPF trigger to target
      ansible.builtin.copy:
        src: "{{ blastwall_bpf_trigger_path }}"
        dest: /tmp/trigger-bpf-deny.py
        mode: "0755"

    - name: Verify BPF map creation is blocked
      ansible.builtin.command: /tmp/trigger-bpf-deny.py
      register: blastwall_bpf_trigger
      changed_when: false

    - name: Show BPF trigger result
      ansible.builtin.debug:
        var: blastwall_bpf_trigger.stdout

    - name: Copy packet_socket trigger to target
      ansible.builtin.copy:
        src: "{{ blastwall_packet_socket_trigger_path }}"
        dest: /tmp/trigger-packet-socket-deny.py
        mode: "0755"

    - name: Verify AF_PACKET socket creation is blocked
      ansible.builtin.command: /tmp/trigger-packet-socket-deny.py
      register: blastwall_packet_socket_trigger
      changed_when: false

    - name: Show packet_socket trigger result
      ansible.builtin.debug:
        var: blastwall_packet_socket_trigger.stdout

    - name: Copy userns trigger to target
      ansible.builtin.copy:
        src: "{{ blastwall_userns_trigger_path }}"
        dest: /tmp/trigger-userns-deny.py
        mode: "0755"

    - name: Verify user namespace creation is blocked
      ansible.builtin.command: /tmp/trigger-userns-deny.py
      register: blastwall_userns_trigger
      changed_when: false

    - name: Show userns trigger result
      ansible.builtin.debug:
        var: blastwall_userns_trigger.stdout

    - name: Copy io_uring trigger to target
      ansible.builtin.copy:
        src: "{{ blastwall_io_uring_trigger_path }}"
        dest: /tmp/trigger-io-uring-deny.py
        mode: "0755"

    - name: Verify io_uring_setup is blocked
      ansible.builtin.command: /tmp/trigger-io-uring-deny.py
      register: blastwall_io_uring_trigger
      changed_when: false
      failed_when: false

    - name: Evaluate io_uring trigger output
      ansible.builtin.set_fact:
        blastwall_io_uring_probe_output: "{{ blastwall_io_uring_trigger.stdout | default('') | trim + '\n' + blastwall_io_uring_trigger.stderr | default('') | trim }}"

    - name: Assert io_uring evidence is blocked
      ansible.builtin.assert:
        that:
          - >
            (blastwall_io_uring_trigger.rc == 0 and 'BLOCKED:' in blastwall_io_uring_probe_output)
            and 'FAIL_UNKNOWN' not in blastwall_io_uring_probe_output
        fail_msg: >-
          io_uring confinement check did not return blocked evidence:
          rc={{ blastwall_io_uring_trigger.rc }}.
          output={{ blastwall_io_uring_probe_output }}

    - name: Show io_uring trigger result
      ansible.builtin.debug:
        var: blastwall_io_uring_trigger.stdout

    - name: Copy Dirty Frag / Fragnesia trigger to target
      ansible.builtin.copy:
        src: "{{ blastwall_dirtyfrag_trigger_path }}"
        dest: /tmp/trigger-dirtyfrag-deny.py
        mode: "0755"

    - name: Verify Dirty Frag / Fragnesia entry points are blocked
      ansible.builtin.command: /tmp/trigger-dirtyfrag-deny.py
      register: blastwall_dirtyfrag_trigger
      changed_when: false

    - name: Show Dirty Frag / Fragnesia trigger result
      ansible.builtin.debug:
        var: blastwall_dirtyfrag_trigger.stdout

    - name: Copy strange-socket-v1 trigger to target
      ansible.builtin.copy:
        src: "{{ blastwall_strange_socket_v1_trigger_path }}"
        dest: /tmp/trigger-strange-socket-v1-deny.py
        mode: "0755"
      when: blastwall_enable_strange_socket_v1_dry_run | bool

    - name: Verify strange-socket-v1 socket creation is blocked or absent
      ansible.builtin.command: /tmp/trigger-strange-socket-v1-deny.py
      register: blastwall_strange_socket_v1_trigger
      changed_when: false
      when: blastwall_enable_strange_socket_v1_dry_run | bool

    - name: Show strange-socket-v1 trigger result
      ansible.builtin.debug:
        var: blastwall_strange_socket_v1_trigger.stdout
      when: blastwall_enable_strange_socket_v1_dry_run | bool

    - name: Build managed-host probe evidence report
      ansible.builtin.set_fact:
        blastwall_probe_report:
          subject_host: "{{ inventory_hostname }}"
          target: rhel-login
          required_profiles: "{{ required_blastwall_profiles }}"
          login_context: "{{ blastwall_idz.stdout }}"
          sudo_uid: "{{ blastwall_sudo_uid.stdout }}"
          sudo_context: "{{ blastwall_sudo_context.stdout }}"
          probes:
            af_alg:
              rc: "{{ blastwall_trigger.rc }}"
              stdout: "{{ blastwall_trigger.stdout | default('') }}"
              stderr: "{{ blastwall_trigger.stderr | default('') }}"
            bpf:
              rc: "{{ blastwall_bpf_trigger.rc }}"
              stdout: "{{ blastwall_bpf_trigger.stdout | default('') }}"
              stderr: "{{ blastwall_bpf_trigger.stderr | default('') }}"
            packet_socket:
              rc: "{{ blastwall_packet_socket_trigger.rc }}"
              stdout: "{{ blastwall_packet_socket_trigger.stdout | default('') }}"
              stderr: "{{ blastwall_packet_socket_trigger.stderr | default('') }}"
            userns:
              rc: "{{ blastwall_userns_trigger.rc }}"
              stdout: "{{ blastwall_userns_trigger.stdout | default('') }}"
              stderr: "{{ blastwall_userns_trigger.stderr | default('') }}"
            io_uring:
              rc: "{{ blastwall_io_uring_trigger.rc }}"
              stdout: "{{ blastwall_io_uring_trigger.stdout | default('') }}"
              stderr: "{{ blastwall_io_uring_trigger.stderr | default('') }}"
            dirtyfrag_fragnesia:
              rc: "{{ blastwall_dirtyfrag_trigger.rc }}"
              stdout: "{{ blastwall_dirtyfrag_trigger.stdout | default('') }}"
              stderr: "{{ blastwall_dirtyfrag_trigger.stderr | default('') }}"
            strange_socket_v1:
              requested: "{{ blastwall_enable_strange_socket_v1_dry_run | bool }}"
              rc: "{{ blastwall_strange_socket_v1_trigger.rc | default('') }}"
              stdout: "{{ blastwall_strange_socket_v1_trigger.stdout | default('') }}"
              stderr: "{{ blastwall_strange_socket_v1_trigger.stderr | default('') }}"

    - name: Hash managed-host probe evidence report
      ansible.builtin.set_fact:
        blastwall_probe_report_sha256: "{{ blastwall_probe_report | to_json | hash('sha256') }}"

    - name: Publish managed-host probe evidence hash
      ansible.builtin.set_stats:
        data:
          blastwall_probe_report_sha256: "{{ blastwall_probe_report_sha256 }}"
          BLASTWALL_PROBE_REPORT_SHA256: "{{ blastwall_probe_report_sha256 }}"

    - name: Publish managed-host probe evidence hashes by host
      ansible.builtin.set_stats:
        data:
          blastwall_probe_report_sha256_by_host: >-
            {{
              dict(ansible_play_hosts_all | zip(
                ansible_play_hosts_all |
                map('extract', hostvars, 'blastwall_probe_report_sha256')
              ))
            }}
      run_once: true
      delegate_to: localhost

    - name: Report managed-host probe evidence digest
      ansible.builtin.debug:
        msg:
          managed_host_probe_report: passed
          subject_host: "{{ inventory_hostname }}"
          probe_report_sha256: "{{ blastwall_probe_report_sha256 }}"
