---
- name: Apply and validate Blastwall OpenShift/SPO policy CR bundle
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    blastwall_spo_bundle_content: "{{ blastwall_spo_bundle_yaml | default('', true) }}"
    blastwall_spo_bundle_source_path: "{{ blastwall_spo_bundle_path | default('AAP workflow artifact', true) }}"
    blastwall_spo_bundle_hash: "{{ blastwall_spo_bundle_sha256 | default('', true) }}"
    blastwall_spo_validate_strange_socket_v1: >-
      {{
        BLASTWALL_SPO_VALIDATE_STRANGE_SOCKET_V1 |
        default(lookup('env', 'BLASTWALL_SPO_VALIDATE_STRANGE_SOCKET_V1') | default('false', true), true) |
        bool
      }}
    blastwall_spo_selinux_type_resolution_mode_default: "calabi-ocp420-rawprofile-underscore"
    blastwall_spo_selinux_type_resolution_mode_effective: "{{ blastwall_spo_selinux_type_resolution_mode | default(blastwall_spo_selinux_type_resolution_mode_default, true) }}"
    blastwall_spo_profile_namespace: blastwall-spo
    blastwall_spo_workload_namespace: blastwall-workloads
    blastwall_spo_profiles_base:
      - blastwall
      - blastwallnested
    blastwall_spo_profiles_strange:
      - blastwallstrange
      - blastwallnestedstrange
    blastwall_spo_profiles: "{{ blastwall_spo_profiles_base + (blastwall_spo_validate_strange_socket_v1 | ternary(blastwall_spo_profiles_strange, [])) }}"
    blastwall_spo_sccs_base:
      - blastwall-confined
      - blastwall-nested
    blastwall_spo_sccs_strange:
      - blastwall-strange
      - blastwall-nested-strange
    blastwall_spo_sccs: "{{ blastwall_spo_sccs_base + (blastwall_spo_validate_strange_socket_v1 | ternary(blastwall_spo_sccs_strange, [])) }}"
    blastwall_spo_validation_jobs_base:
      - name: blastwall-spo-validation
        profile_resource: blastwall
        expected_type_placeholder: __BLASTWALL_SPO_STANDARD_SELINUX_TYPE__
        summary: "standard_profile: passed"
      - name: blastwall-nested-spo-validation
        profile_resource: blastwallnested
        expected_type_placeholder: __BLASTWALL_SPO_NESTED_SELINUX_TYPE__
        summary: "nested_profile: passed"
    blastwall_spo_validation_jobs_strange:
      - name: blastwall-strange-spo-validation
        profile_resource: blastwallstrange
        expected_type_placeholder: __BLASTWALL_SPO_STRANGE_SELINUX_TYPE__
        summary: "standard-strange_profile: passed"
      - name: blastwall-nested-strange-spo-validation
        profile_resource: blastwallnestedstrange
        expected_type_placeholder: __BLASTWALL_SPO_NESTED_STRANGE_SELINUX_TYPE__
        summary: "nested-strange_profile: passed"
    blastwall_spo_validation_jobs: "{{ blastwall_spo_validation_jobs_base + (blastwall_spo_validate_strange_socket_v1 | ternary(blastwall_spo_validation_jobs_strange, [])) }}"
    blastwall_spo_all_validation_jobs: "{{ blastwall_spo_validation_jobs_base + blastwall_spo_validation_jobs_strange }}"
    blastwall_spo_validation_summaries_base:
      - standard_profile: passed
      - nested_profile: passed
    blastwall_spo_validation_summaries_strange:
      - standard-strange_profile: passed
      - nested-strange_profile: passed
    blastwall_spo_validation_summaries: "{{ blastwall_spo_validation_summaries_base + (blastwall_spo_validate_strange_socket_v1 | ternary(blastwall_spo_validation_summaries_strange, [])) }}"
  tasks:
    - name: Load rendered OpenShift/SPO bundle from source path when needed
      ansible.builtin.set_fact:
        blastwall_spo_bundle_content: "{{ lookup('ansible.builtin.file', blastwall_spo_bundle_source_path, rstrip=False) }}"
      when:
        - blastwall_spo_bundle_content | length == 0
        - blastwall_spo_bundle_source_path != 'AAP workflow artifact'

    - name: Require rendered OpenShift/SPO workflow artifact
      ansible.builtin.assert:
        that:
          - blastwall_spo_bundle_content | length > 0
        fail_msg: >-
          Missing blastwall_spo_bundle_yaml. Run this job after
          render_spo_policy_crs in the Blastwall policy pipeline workflow.

    - name: Compute rendered OpenShift/SPO bundle hash when not provided
      ansible.builtin.set_fact:
        blastwall_spo_bundle_hash: "{{ blastwall_spo_bundle_content | hash('sha256') }}"
      when: blastwall_spo_bundle_hash | length == 0

    - name: Require OpenShift kubeconfig credential
      ansible.builtin.assert:
        that:
          - lookup('env', 'K8S_AUTH_KUBECONFIG') | length > 0
        fail_msg: >-
          Missing K8S_AUTH_KUBECONFIG. Attach the Blastwall OpenShift
          Kubeconfig credential to this job template.

    - name: Parse rendered OpenShift/SPO bundle
      ansible.builtin.set_fact:
        blastwall_spo_bundle_objects: >-
          {{
            blastwall_spo_bundle_content
            | from_yaml_all
            | reject('equalto', None)
            | list
          }}

    - name: Assert rendered bundle excludes fleet-governance kinds
      ansible.builtin.assert:
        that:
          - >-
            blastwall_spo_bundle_objects
            | selectattr('kind', 'in', ['Policy', 'ConfigurationPolicy', 'Placement', 'PlacementBinding'])
            | list
            | length == 0
        fail_msg: "Rendered OpenShift/SPO bundle contains fleet-governance objects."

    - name: Stage rendered bundle for operator inspection
      ansible.builtin.tempfile:
        state: file
        suffix: -blastwall-spo-crs.yaml
      register: blastwall_spo_bundle_tempfile

    - name: Write staged OpenShift/SPO bundle
      ansible.builtin.copy:
        dest: "{{ blastwall_spo_bundle_tempfile.path }}"
        mode: "0600"
        content: "{{ blastwall_spo_bundle_content }}"

    - name: Remove prior validation jobs before applying bundle
      kubernetes.core.k8s:
        state: absent
        api_version: batch/v1
        kind: Job
        namespace: "{{ blastwall_spo_workload_namespace }}"
        name: "{{ item.name }}"
        wait: true
        wait_timeout: 120
      loop: "{{ blastwall_spo_all_validation_jobs }}"

    - name: Apply rendered OpenShift/SPO bundle prerequisites
      kubernetes.core.k8s:
        state: present
        definition: "{{ item }}"
      loop: "{{ blastwall_spo_bundle_objects }}"
      loop_control:
        label: "{{ item.kind }}/{{ item.metadata.name | default('unnamed') }}"
      when:
        - item.kind not in ['SecurityContextConstraints', 'Job', 'Deployment']
        - >-
          blastwall_spo_validate_strange_socket_v1 | bool or
          (item.metadata.labels | default({})).get('blastwall.io/policy-profile', '') != 'strange-socket-v1'

    - name: Wait for Blastwall SPO profiles to become ready
      kubernetes.core.k8s_info:
        api_version: security-profiles-operator.x-k8s.io/v1alpha2
        kind: RawSelinuxProfile
        namespace: "{{ blastwall_spo_profile_namespace }}"
        name: "{{ item }}"
      register: blastwall_spo_profile_info
      until: >-
        blastwall_spo_profile_info.resources | length > 0 and
        (
          blastwall_spo_profile_info.resources[0].status.state | default('') == 'Installed' or
          (
            blastwall_spo_profile_info.resources[0].status.conditions | default([])
            | selectattr('type', 'equalto', 'Ready')
            | selectattr('status', 'equalto', 'True')
            | list
            | length
          ) > 0
        )
      retries: 30
      delay: 10
      loop: "{{ blastwall_spo_profiles }}"

    - name: Capture status-derived OpenShift/SPO usage strings
      ansible.builtin.set_fact:
        blastwall_spo_usage_by_profile: >-
          {{
            (blastwall_spo_usage_by_profile | default({}))
            | combine({item.item: item.resources[0].status.usage | default('', true)})
          }}
      loop: "{{ blastwall_spo_profile_info.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Require OpenShift/SPO profiles to publish status.usage
      ansible.builtin.assert:
        that:
          - blastwall_spo_usage_by_profile[item] | default('', true) | length > 0
        fail_msg: "RawSelinuxProfile/{{ item }} did not expose status.usage."
      loop: "{{ blastwall_spo_profiles }}"

    - name: Validate OpenShift/SPO SELinux type resolution mode
      ansible.builtin.assert:
        that:
          - blastwall_spo_selinux_type_resolution_mode_effective in
            ["calabi-ocp420-rawprofile-underscore", "status-usage-direct"]
        fail_msg: >-
          blastwall_spo_selinux_type_resolution_mode must be either
          calabi-ocp420-rawprofile-underscore or status-usage-direct.

    - name: Assert OpenShift/SPO status.usage format is recognized
      ansible.builtin.assert:
        that:
          - blastwall_spo_usage_by_profile[item] is match('^[A-Za-z0-9_.-]+_?\\.process$')
        fail_msg: >-
          Unknown OpenShift/SPO status.usage format for RawSelinuxProfile/{{ item }}:
          {{ blastwall_spo_usage_by_profile[item] | default('') }}.
          Refusing to derive an SCC SELinux type from an unrecognized value.
      loop: "{{ blastwall_spo_profiles }}"

    - name: Derive SCC SELinux types from OpenShift/SPO usage
      ansible.builtin.set_fact:
        blastwall_spo_selinux_type_by_profile:
          blastwall: >-
            {{
              (blastwall_spo_selinux_type_resolution_mode_effective == 'status-usage-direct')
              | ternary(
                blastwall_spo_usage_by_profile['blastwall'],
                (blastwall_spo_usage_by_profile['blastwall'] | regex_replace('(?<!_)\.process$', '_.process'))
              )
            }}
          blastwallnested: >-
            {{
              (blastwall_spo_selinux_type_resolution_mode_effective == 'status-usage-direct')
              | ternary(
                blastwall_spo_usage_by_profile['blastwallnested'],
                (blastwall_spo_usage_by_profile['blastwallnested'] | regex_replace('(?<!_)\.process$', '_.process'))
              )
            }}
          blastwallstrange: >-
            {{
              (blastwall_spo_validate_strange_socket_v1 and (blastwall_spo_selinux_type_resolution_mode_effective == 'status-usage-direct'))
              | ternary(
                (blastwall_spo_usage_by_profile.get('blastwallstrange', '')),
                (blastwall_spo_usage_by_profile.get('blastwallstrange', '') | regex_replace('(?<!_)\.process$', '_.process'))
              )
            }}
          blastwallnestedstrange: >-
            {{
              (blastwall_spo_validate_strange_socket_v1 and (blastwall_spo_selinux_type_resolution_mode_effective == 'status-usage-direct'))
              | ternary(
                (blastwall_spo_usage_by_profile.get('blastwallnestedstrange', '')),
                (blastwall_spo_usage_by_profile.get('blastwallnestedstrange', '') | regex_replace('(?<!_)\.process$', '_.process'))
              )
            }}

    - name: Record OpenShift/SPO SELinux type resolution mode
      ansible.builtin.set_stats:
        data:
          blastwall_spo_selinux_type_resolution_mode: "{{ blastwall_spo_selinux_type_resolution_mode_effective }}"

    - name: Log OpenShift/SPO SELinux type resolution mode
      ansible.builtin.debug:
        msg: "blastwall_spo_selinux_type_resolution_mode={{ blastwall_spo_selinux_type_resolution_mode_effective }}"

    - name: Hydrate OpenShift/SPO bundle with status-derived SELinux types
      ansible.builtin.set_fact:
        blastwall_spo_hydrated_bundle_content: >-
          {{
            blastwall_spo_bundle_content
            | replace('__BLASTWALL_SPO_STANDARD_SELINUX_TYPE__', blastwall_spo_selinux_type_by_profile['blastwall'])
            | replace('__BLASTWALL_SPO_NESTED_SELINUX_TYPE__', blastwall_spo_selinux_type_by_profile['blastwallnested'])
            | replace('__BLASTWALL_SPO_STRANGE_SELINUX_TYPE__', blastwall_spo_selinux_type_by_profile.get('blastwallstrange', ''))
            | replace('__BLASTWALL_SPO_NESTED_STRANGE_SELINUX_TYPE__', blastwall_spo_selinux_type_by_profile.get('blastwallnestedstrange', ''))
          }}

    - name: Parse status-hydrated OpenShift/SPO bundle
      ansible.builtin.set_fact:
        blastwall_spo_hydrated_bundle_objects: >-
          {{
            blastwall_spo_hydrated_bundle_content
            | from_yaml_all
            | reject('equalto', None)
            | list
          }}

    - name: Apply status-hydrated OpenShift/SPO runtime objects
      kubernetes.core.k8s:
        state: present
        definition: "{{ item }}"
      loop: "{{ blastwall_spo_hydrated_bundle_objects }}"
      loop_control:
        label: "{{ item.kind }}/{{ item.metadata.name | default('unnamed') }}"
      when:
        - item.kind != 'Job'
        - >-
          blastwall_spo_validate_strange_socket_v1 | bool or
          (item.metadata.labels | default({})).get('blastwall.io/policy-profile', '') != 'strange-socket-v1'

    - name: Confirm Blastwall SCCs exist
      kubernetes.core.k8s_info:
        api_version: security.openshift.io/v1
        kind: SecurityContextConstraints
        name: "{{ item }}"
      register: blastwall_spo_scc_info
      failed_when: blastwall_spo_scc_info.resources | length == 0
      loop: "{{ blastwall_spo_sccs }}"

    - name: Apply status-hydrated OpenShift/SPO validation jobs
      kubernetes.core.k8s:
        state: present
        definition: "{{ item }}"
      loop: "{{ blastwall_spo_hydrated_bundle_objects }}"
      loop_control:
        label: "{{ item.kind }}/{{ item.metadata.name | default('unnamed') }}"
      when:
        - item.kind == 'Job'
        - item.metadata.name in (blastwall_spo_validation_jobs | map(attribute='name') | list)

    - name: Wait for OpenShift/SPO validation jobs to complete
      kubernetes.core.k8s_info:
        api_version: batch/v1
        kind: Job
        namespace: "{{ blastwall_spo_workload_namespace }}"
        name: "{{ item.name }}"
      register: blastwall_spo_job_info
      until: >-
        blastwall_spo_job_info.resources | length > 0 and
        (
          blastwall_spo_job_info.resources[0].status.succeeded | default(0) | int
        ) >= 1
      retries: 36
      delay: 10
      loop: "{{ blastwall_spo_validation_jobs }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Collect OpenShift/SPO validation pods
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        namespace: "{{ blastwall_spo_workload_namespace }}"
        label_selectors:
          - "job-name={{ item.name }}"
      register: blastwall_spo_validation_pods
      loop: "{{ blastwall_spo_validation_jobs }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Collect OpenShift/SPO validation logs
      kubernetes.core.k8s_log:
        namespace: "{{ blastwall_spo_workload_namespace }}"
        name: "{{ (item.resources | sort(attribute='metadata.creationTimestamp') | last).metadata.name }}"
      register: blastwall_spo_validation_logs
      loop: "{{ blastwall_spo_validation_pods.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      when: item.resources | length > 0

    - name: Build OpenShift/SPO validation log corpus
      ansible.builtin.set_fact:
        blastwall_spo_validation_log_text: >-
          {{
            blastwall_spo_validation_logs.results
            | default([])
            | map(attribute='log')
            | list
            | join('\n')
          }}

    - name: Require standard and nested validation summaries
      ansible.builtin.assert:
        that:
          - item.summary in blastwall_spo_validation_log_text
        fail_msg: "OpenShift/SPO validation output did not contain {{ item.summary }}."
      loop: "{{ blastwall_spo_validation_jobs }}"
      loop_control:
        label: "{{ item.summary }}"

    - name: Report OpenShift/SPO apply and validation evidence
      ansible.builtin.debug:
        msg:
          spo_policy_apply_validate: passed
          spo_policy_bundle_source: "{{ blastwall_spo_bundle_source_path }}"
          spo_policy_bundle_sha256: "{{ blastwall_spo_bundle_hash }}"
          spo_profiles_ready: "{{ blastwall_spo_profiles | join(', ') }}"
          spo_usage:
            standard: "{{ blastwall_spo_usage_by_profile['blastwall'] }}"
            nested: "{{ blastwall_spo_usage_by_profile['blastwallnested'] }}"
            standard_strange: "{{ blastwall_spo_usage_by_profile.get('blastwallstrange', '') }}"
            nested_strange: "{{ blastwall_spo_usage_by_profile.get('blastwallnestedstrange', '') }}"
          spo_selinux_type_resolution_mode: "{{ blastwall_spo_selinux_type_resolution_mode_effective }}"
          spo_selinux_type:
            standard: "{{ blastwall_spo_selinux_type_by_profile['blastwall'] }}"
            nested: "{{ blastwall_spo_selinux_type_by_profile['blastwallnested'] }}"
            standard_strange: "{{ blastwall_spo_selinux_type_by_profile.get('blastwallstrange', '') }}"
            nested_strange: "{{ blastwall_spo_selinux_type_by_profile.get('blastwallnestedstrange', '') }}"
          spo_sccs_present: "{{ blastwall_spo_sccs | join(', ') }}"
          spo_validation_classes: "{{ blastwall_spo_validation_jobs | map(attribute='profile_resource') | list }}"
          spo_validation_summaries: "{{ blastwall_spo_validation_summaries }}"
