---
- name: Promote verified Blastwall policy marker
  hosts: "{{ blastwall_policy_pipeline_target_hosts | default('blastwall_policy_stale') }}"
  become: false
  gather_facts: false
  vars:
    ipa_server: "{{ lookup('env', 'IPA_SERVER') }}"
    ipa_domain: >-
      {{ lookup('env', 'IPA_DOMAIN') |
      default((ipa_server.split('.')[1:] | join('.')), true) }}
    ipa_realm: >-
      {{ lookup('env', 'IPA_REALM') |
      default((ipa_domain | upper), true) }}
    ipa_ca: "{{ lookup('env', 'IPA_CERT') | default('/etc/ipa/ca.crt', true) }}"
    ipa_basedn: >-
      dc={{ ipa_domain | replace('.', ',dc=') }}
    ipa_principal: "{{ lookup('env', 'IPA_PRINCIPAL') }}"
    ipa_login_principal: >-
      {{ ipa_principal if '@' in ipa_principal else ipa_principal ~ '@' ~ ipa_realm }}
    ipa_password: >-
      {{ lookup('env', 'IPA_PASSWORD') |
      default(lookup('env', 'IPA_ADMIN_PASSWORD'), true) }}
    krb5_config: "{{ lookup('env', 'KRB5_CONFIG') | default('', true) }}"
    krb5_ccache: FILE:/tmp/blastwall_krb5cc
    blastwall_policy_name: blastwall-selinux
    blastwall_policy_version: >-
      {{ BLASTWALL_POLICY_VERSION | default(lookup('env', 'BLASTWALL_POLICY_VERSION') | default('0.5.2', true), true) }}
    blastwall_policy_release: >-
      {{ BLASTWALL_POLICY_RELEASE | default(lookup('env', 'BLASTWALL_POLICY_RELEASE') | default('1', true), true) }}
    blastwall_policy_nevra: "{{ blastwall_policy_name }}-{{ blastwall_policy_version }}-{{ blastwall_policy_release }}"
    blastwall_policy_marker_rpm_sha256: >-
      {{ blastwall_policy_rpm_sha256 | default(lookup('env', 'BLASTWALL_POLICY_RPM_SHA256') | default('', true), true) }}
    blastwall_existing_userclass_values: >-
      {{
        idm_userclass
        if (idm_userclass is defined and idm_userclass is not string)
        else ([idm_userclass] if (idm_userclass is defined and idm_userclass | length > 0) else [])
      }}
    blastwall_existing_description: "{{ idm_description | default('') }}"
    blastwall_clear_legacy_description_marker: true
    blastwall_clear_description_marker: >-
      {{
        blastwall_clear_legacy_description_marker | bool and
        blastwall_existing_description is match('^(bw_|blastwall:)')
      }}
    blastwall_preserved_userclass_values: >-
      {{
        blastwall_existing_userclass_values
        | reject('match', '^blastwall:')
        | list
      }}
    blastwall_update_idm_marker: true
    blastwall_policy_marker: >-
      blastwall:state=active;rpm={{ blastwall_policy_nevra }};rpm_sha256={{ blastwall_policy_marker_rpm_sha256 }};alg=deny;bpf=deny;self=deny;pkt=deny;userns=deny;iou=deny;xfrm=deny;rxrpc=deny
    blastwall_policy_failed_marker: >-
      blastwall:state=failed;rpm={{ blastwall_policy_nevra }};rpm_sha256={{ blastwall_policy_marker_rpm_sha256 | default('unknown', true) }}
    blastwall_policy_userclass_values: >-
      {{ blastwall_preserved_userclass_values + [blastwall_policy_marker] }}
    blastwall_policy_failed_userclass_values: >-
      {{ blastwall_preserved_userclass_values + [blastwall_policy_failed_marker] }}
  tasks:
    - name: Require IdM marker write inputs
      ansible.builtin.assert:
        that:
          - ipa_server | length > 0
          - ipa_domain | length > 0
          - ipa_realm | length > 0
          - ipa_principal | length > 0
          - ipa_password | length > 0
          - not blastwall_update_idm_marker | bool or blastwall_policy_marker_rpm_sha256 is match('^[0-9a-f]{64}$')
        fail_msg: >-
          Set IPA_SERVER, IPA_DOMAIN, IPA_REALM, IPA_PRINCIPAL, IPA_PASSWORD,
          and a 64-character BLASTWALL_POLICY_RPM_SHA256 value for the FreeIPA
          host marker update.
      run_once: true
      delegate_to: localhost

    - name: Write FreeIPA client config for marker update
      ansible.builtin.copy:
        dest: /etc/ipa/default.conf
        mode: "0644"
        content: |
          [global]
          server = {{ ipa_server }}
          domain = {{ ipa_domain }}
          realm = {{ ipa_realm }}
          basedn = {{ ipa_basedn }}
          xmlrpc_uri = https://{{ ipa_server }}/ipa/xml
      run_once: true
      delegate_to: localhost

    - name: Install injected FreeIPA CA for marker update
      ansible.builtin.copy:
        src: "{{ ipa_ca }}"
        dest: /etc/ipa/ca.crt
        mode: "0644"
        remote_src: true
      when:
        - ipa_ca | length > 0
        - ipa_ca != "/etc/ipa/ca.crt"
      run_once: true
      delegate_to: localhost

    - name: Publish verified Blastwall host marker to IdM
      block:
        - name: Publish promoted Blastwall host marker through FreeIPA
          block:
            - name: Publish promoted Blastwall host marker with collection
              freeipa.ansible_freeipa.ipahost:
                ipaadmin_principal: "{{ ipa_principal }}"
                ipaadmin_password: "{{ ipa_password }}"
                name: "{{ inventory_hostname }}"
                description: "{{ '' if blastwall_clear_description_marker | bool else omit }}"
                userclass: "{{ blastwall_policy_userclass_values }}"
                state: present
              no_log: true
              delegate_to: localhost
          rescue:
            - name: Publish promoted Blastwall host marker with FreeIPA CLI fallback
              ansible.builtin.shell: |
                set -euo pipefail
                printf '%s\n' "${IPA_PASSWORD}" | kinit "${IPA_LOGIN_PRINCIPAL}" >/dev/null
                printf '%s\n' "${BLASTWALL_OLD_MARKERS}" | while IFS= read -r marker; do
                  [ -n "${marker}" ] || continue
                  ipa host-mod "${BLASTWALL_HOST}" --delattr="userclass=${marker}" >/dev/null || true
                done
                ipa host-mod "${BLASTWALL_HOST}" --addattr="userclass=${BLASTWALL_MARKER}" >/dev/null
              args:
                executable: /bin/bash
              environment:
                IPA_LOGIN_PRINCIPAL: "{{ ipa_login_principal }}"
                IPA_PASSWORD: "{{ ipa_password }}"
                KRB5_CONFIG: "{{ krb5_config }}"
                KRB5CCNAME: "{{ krb5_ccache }}"
                BLASTWALL_HOST: "{{ inventory_hostname }}"
                BLASTWALL_MARKER: "{{ blastwall_policy_marker }}"
                BLASTWALL_OLD_MARKERS: >-
                  {{
                    blastwall_existing_userclass_values
                    | select('match', '^blastwall:')
                    | join('\n')
                  }}
              changed_when: true
              no_log: true
              delegate_to: localhost
          when: blastwall_update_idm_marker | bool

        - name: Report policy promotion evidence
          ansible.builtin.debug:
            msg:
              policy_pipeline_promotion: passed
              policy_nevra: "{{ blastwall_policy_nevra }}"
              marker: "{{ blastwall_policy_marker }}"

      rescue:
        - name: Publish failed Blastwall host marker through FreeIPA
          block:
            - name: Publish failed Blastwall host marker with collection
              freeipa.ansible_freeipa.ipahost:
                ipaadmin_principal: "{{ ipa_principal }}"
                ipaadmin_password: "{{ ipa_password }}"
                name: "{{ inventory_hostname }}"
                description: "{{ '' if blastwall_clear_description_marker | bool else omit }}"
                userclass: "{{ blastwall_policy_failed_userclass_values }}"
                state: present
              no_log: true
              delegate_to: localhost
          rescue:
            - name: Publish failed Blastwall host marker with FreeIPA CLI fallback
              ansible.builtin.shell: |
                set -euo pipefail
                printf '%s\n' "${IPA_PASSWORD}" | kinit "${IPA_LOGIN_PRINCIPAL}" >/dev/null
                printf '%s\n' "${BLASTWALL_OLD_MARKERS}" | while IFS= read -r marker; do
                  [ -n "${marker}" ] || continue
                  ipa host-mod "${BLASTWALL_HOST}" --delattr="userclass=${marker}" >/dev/null || true
                done
                ipa host-mod "${BLASTWALL_HOST}" --addattr="userclass=${BLASTWALL_MARKER}" >/dev/null
              args:
                executable: /bin/bash
              environment:
                IPA_LOGIN_PRINCIPAL: "{{ ipa_login_principal }}"
                IPA_PASSWORD: "{{ ipa_password }}"
                KRB5_CONFIG: "{{ krb5_config }}"
                KRB5CCNAME: "{{ krb5_ccache }}"
                BLASTWALL_HOST: "{{ inventory_hostname }}"
                BLASTWALL_MARKER: "{{ blastwall_policy_failed_marker }}"
                BLASTWALL_OLD_MARKERS: >-
                  {{
                    blastwall_existing_userclass_values
                    | select('match', '^blastwall:')
                    | join('\n')
                  }}
              changed_when: false
              no_log: true
              delegate_to: localhost
          ignore_errors: true
          when: blastwall_update_idm_marker | bool

        - name: Stop after failed policy promotion
          ansible.builtin.fail:
            msg: >-
              Blastwall policy marker promotion failed on {{ inventory_hostname }}.
              The host marker was set to failed when marker updates were enabled.
