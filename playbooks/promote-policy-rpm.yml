---
- name: Promote verified Blastwall policy marker
  hosts: "{{ blastwall_policy_pipeline_target_hosts | default('blastwall_policy_stale') }}"
  become: false
  gather_facts: false
  vars:
    ipa_server: "{{ lookup('env', 'IPA_SERVER') }}"
    ipa_domain: >-
      {{ lookup('env', 'IPA_DOMAIN') |
      default((ipa_server.split('.')[1:] | join('.')), true) }}
    ipa_realm: >-
      {{ lookup('env', 'IPA_REALM') |
      default((ipa_domain | upper), true) }}
    ipa_ca: "{{ lookup('env', 'IPA_CERT') | default('/etc/ipa/ca.crt', true) }}"
    ipa_basedn: >-
      dc={{ ipa_domain | replace('.', ',dc=') }}
    ipa_principal: "{{ lookup('env', 'IPA_PRINCIPAL') }}"
    ipa_login_principal: >-
      {{ ipa_principal if '@' in ipa_principal else ipa_principal ~ '@' ~ ipa_realm }}
    ipa_password: >-
      {{ lookup('env', 'IPA_PASSWORD') |
      default(lookup('env', 'IPA_ADMIN_PASSWORD'), true) }}
    krb5_config: "{{ lookup('env', 'KRB5_CONFIG') | default('', true) }}"
    krb5_ccache: FILE:/tmp/blastwall_krb5cc
    blastwall_policy_name: blastwall-selinux
    blastwall_policy_version: >-
      {{ BLASTWALL_POLICY_VERSION | default(lookup('env', 'BLASTWALL_POLICY_VERSION') | default('0.6.1', true), true) }}
    blastwall_policy_release: >-
      {{ BLASTWALL_POLICY_RELEASE | default(lookup('env', 'BLASTWALL_POLICY_RELEASE') | default('0.rc1', true), true) }}
    blastwall_policy_nevra: "{{ blastwall_policy_name }}-{{ blastwall_policy_version }}-{{ blastwall_policy_release }}"
    blastwall_policy_marker_rpm_sha256: >-
      {{ blastwall_policy_rpm_sha256 | default(lookup('env', 'BLASTWALL_POLICY_RPM_SHA256') | default('', true), true) }}
    blastwall_profile_registry_path: "{{ playbook_dir }}/../policy/profiles.yml"
    blastwall_profile_registry_sha256: "{{ lookup('file', blastwall_profile_registry_path, rstrip=False) | hash('sha256') }}"
    blastwall_policy_sha256: "{{ blastwall_policy_marker_rpm_sha256 }}"
    blastwall_allow_dry_run_profiles: >-
      {{
        BLASTWALL_ALLOW_DRY_RUN_PROFILES |
        default(lookup('env', 'BLASTWALL_ALLOW_DRY_RUN_PROFILES') | default('false', true), true) |
        bool
      }}
    blastwall_required_profiles_env: >-
      {{
        BLASTWALL_REQUIRED_POLICY_PROFILES |
        default(lookup('env', 'BLASTWALL_REQUIRED_POLICY_PROFILES') | default('', true), true)
      }}
    required_blastwall_profiles: >-
      {{
        (blastwall_required_profiles_env.split(',') | map('trim') | reject('equalto', '') | list)
        if blastwall_required_profiles_env | length > 0
        else ['base']
      }}
    blastwall_strange_socket_v1_requested: "{{ 'strange-socket-v1' in required_blastwall_profiles }}"
    blastwall_strange_socket_v1_legacy_dry_run_raw: >-
      {{
        BLASTWALL_STRANGE_SOCKET_V1_DRY_RUN |
        default(lookup('env', 'BLASTWALL_STRANGE_SOCKET_V1_DRY_RUN') | default('', true), true)
      }}
    blastwall_strange_socket_v1_legacy_dry_run_set: "{{ blastwall_strange_socket_v1_legacy_dry_run_raw | string | length > 0 }}"
    blastwall_strange_socket_v1_legacy_dry_run: "{{ blastwall_strange_socket_v1_legacy_dry_run_raw | bool }}"
    blastwall_enable_strange_socket_v1_dry_run: "{{ blastwall_strange_socket_v1_requested | bool and blastwall_allow_dry_run_profiles | bool }}"
    blastwall_existing_userclass_values: >-
      {{
        idm_userclass
        if (idm_userclass is defined and idm_userclass is not string)
        else ([idm_userclass] if (idm_userclass is defined and idm_userclass | length > 0) else [])
      }}
    blastwall_existing_description: "{{ idm_description | default('') }}"
    blastwall_clear_legacy_description_marker: true
    blastwall_clear_description_marker: >-
      {{
        blastwall_clear_legacy_description_marker | bool and
        blastwall_existing_description is match('^(bw_|blastwall:)')
      }}
    blastwall_preserved_userclass_values: >-
      {{
        blastwall_existing_userclass_values
        | reject('match', '^blastwall:')
        | list
      }}
    blastwall_update_idm_marker: true
    blastwall_marker_emit_command: >-
      {{ ansible_playbook_python | default('/usr/bin/python3') }}
      {{ playbook_dir }}/../tools/blastwall_marker.py --emit --target=rhel-login
      {% if blastwall_allow_dry_run_profiles | bool %}
      --allow-dry-run-profiles
      {% endif %}
      --rpm={{ blastwall_policy_nevra }}
      --policy-sha256={{ blastwall_policy_sha256 }}
      {% for profile in required_blastwall_profiles %}
      --profile={{ profile }}
      {% endfor %}
  tasks:
    - name: Require IdM marker write inputs
      ansible.builtin.assert:
        that:
          - ipa_server | length > 0
          - ipa_domain | length > 0
          - ipa_realm | length > 0
          - ipa_principal | length > 0
          - ipa_password | length > 0
          - not blastwall_update_idm_marker | bool or blastwall_policy_marker_rpm_sha256 is match('^[0-9a-f]{64}$')
          - not blastwall_update_idm_marker | bool or blastwall_profile_registry_sha256 is match('^[0-9a-f]{64}$')
        fail_msg: >-
          Set IPA_SERVER, IPA_DOMAIN, IPA_REALM, IPA_PRINCIPAL, IPA_PASSWORD,
          and a 64-character BLASTWALL_POLICY_RPM_SHA256 value for the FreeIPA
          host marker update.
      run_once: true
      delegate_to: localhost

    - name: Assert strange-socket-v1 dry-run intent is consistent
      ansible.builtin.assert:
        that:
          - not blastwall_strange_socket_v1_requested | bool or blastwall_allow_dry_run_profiles | bool
          - >-
            not blastwall_strange_socket_v1_legacy_dry_run_set | bool or
            (blastwall_strange_socket_v1_legacy_dry_run | bool) == (blastwall_enable_strange_socket_v1_dry_run | bool)
        fail_msg: >-
          strange-socket-v1 requires canonical dry-run intent:
          include strange-socket-v1 in BLASTWALL_REQUIRED_POLICY_PROFILES and set
          BLASTWALL_ALLOW_DRY_RUN_PROFILES=true. If legacy
          BLASTWALL_STRANGE_SOCKET_V1_DRY_RUN is set, it must agree with the
          derived profile intent.
      run_once: true
      delegate_to: localhost

    - name: Write FreeIPA client config for marker update
      ansible.builtin.copy:
        dest: /etc/ipa/default.conf
        mode: "0644"
        content: |
          [global]
          server = {{ ipa_server }}
          domain = {{ ipa_domain }}
          realm = {{ ipa_realm }}
          basedn = {{ ipa_basedn }}
          xmlrpc_uri = https://{{ ipa_server }}/ipa/xml
      run_once: true
      delegate_to: localhost

    - name: Install injected FreeIPA CA for marker update
      ansible.builtin.copy:
        src: "{{ ipa_ca }}"
        dest: /etc/ipa/ca.crt
        mode: "0644"
        remote_src: true
      when:
        - ipa_ca | length > 0
        - ipa_ca != "/etc/ipa/ca.crt"
      run_once: true
      delegate_to: localhost

    - name: Render active Blastwall marker for collection writes
      ansible.builtin.shell:
        cmd: "{{ blastwall_marker_emit_command }} --state=active"
      register: blastwall_policy_marker
      changed_when: false
      delegate_to: localhost
      become: false
      when: blastwall_update_idm_marker | bool

    - name: Render failed Blastwall marker for collection fallback
      ansible.builtin.shell:
        cmd: "{{ blastwall_marker_emit_command }} --state=failed"
      register: blastwall_policy_failed_marker
      changed_when: false
      delegate_to: localhost
      become: false
      when: blastwall_update_idm_marker | bool

    - name: Publish verified Blastwall host marker to IdM
      block:
        - name: Publish promoted Blastwall host marker through FreeIPA
          block:
            - name: Publish promoted Blastwall host marker with collection
              freeipa.ansible_freeipa.ipahost:
                ipaadmin_principal: "{{ ipa_principal }}"
                ipaadmin_password: "{{ ipa_password }}"
                name: "{{ inventory_hostname }}"
                description: "{{ '' if blastwall_clear_description_marker | bool else omit }}"
                userclass: "{{ blastwall_preserved_userclass_values + [blastwall_policy_marker.stdout] }}"
                state: present
              no_log: true
              delegate_to: localhost
          rescue:
            - name: Publish promoted Blastwall host marker with FreeIPA CLI fallback
              ansible.builtin.shell: |
                set -euo pipefail
                printf '%s\n' "${IPA_PASSWORD}" | kinit "${IPA_LOGIN_PRINCIPAL}" >/dev/null
                printf '%s\n' "${BLASTWALL_OLD_MARKERS}" | while IFS= read -r marker; do
                  [ -n "${marker}" ] || continue
                  ipa host-mod "${BLASTWALL_HOST}" --delattr="userclass=${marker}" >/dev/null || true
                done
                ipa host-mod "${BLASTWALL_HOST}" --addattr="userclass=${BLASTWALL_MARKER}" >/dev/null
              args:
                executable: /bin/bash
              environment:
                IPA_LOGIN_PRINCIPAL: "{{ ipa_login_principal }}"
                IPA_PASSWORD: "{{ ipa_password }}"
                KRB5_CONFIG: "{{ krb5_config }}"
                KRB5CCNAME: "{{ krb5_ccache }}"
                BLASTWALL_HOST: "{{ inventory_hostname }}"
                BLASTWALL_MARKER: "{{ blastwall_policy_marker.stdout }}"
                BLASTWALL_OLD_MARKERS: >-
                  {{
                    blastwall_existing_userclass_values
                    | select('match', '^blastwall:')
                    | join('\n')
                  }}
              changed_when: true
              no_log: true
              delegate_to: localhost
          when: blastwall_update_idm_marker | bool

        - name: Report policy promotion evidence
          ansible.builtin.debug:
            msg:
              policy_pipeline_promotion: passed
              policy_nevra: "{{ blastwall_policy_nevra }}"
              marker: "{{ blastwall_policy_marker.stdout }}"

      rescue:
        - name: Publish failed Blastwall host marker through FreeIPA
          block:
            - name: Publish failed Blastwall host marker with collection
              freeipa.ansible_freeipa.ipahost:
                ipaadmin_principal: "{{ ipa_principal }}"
                ipaadmin_password: "{{ ipa_password }}"
                name: "{{ inventory_hostname }}"
                description: "{{ '' if blastwall_clear_description_marker | bool else omit }}"
                userclass: "{{ blastwall_preserved_userclass_values + [blastwall_policy_failed_marker.stdout] }}"
                state: present
              no_log: true
              delegate_to: localhost
          rescue:
            - name: Publish failed Blastwall host marker with FreeIPA CLI fallback
              ansible.builtin.shell: |
                set -euo pipefail
                printf '%s\n' "${IPA_PASSWORD}" | kinit "${IPA_LOGIN_PRINCIPAL}" >/dev/null
                printf '%s\n' "${BLASTWALL_OLD_MARKERS}" | while IFS= read -r marker; do
                  [ -n "${marker}" ] || continue
                  ipa host-mod "${BLASTWALL_HOST}" --delattr="userclass=${marker}" >/dev/null || true
                done
                ipa host-mod "${BLASTWALL_HOST}" --addattr="userclass=${BLASTWALL_MARKER}" >/dev/null
              args:
                executable: /bin/bash
              environment:
                IPA_LOGIN_PRINCIPAL: "{{ ipa_login_principal }}"
                IPA_PASSWORD: "{{ ipa_password }}"
                KRB5_CONFIG: "{{ krb5_config }}"
                KRB5CCNAME: "{{ krb5_ccache }}"
                BLASTWALL_HOST: "{{ inventory_hostname }}"
                BLASTWALL_MARKER: "{{ blastwall_policy_failed_marker.stdout }}"
                BLASTWALL_OLD_MARKERS: >-
                  {{
                    blastwall_existing_userclass_values
                    | select('match', '^blastwall:')
                    | join('\n')
                  }}
              changed_when: false
              no_log: true
              delegate_to: localhost
          ignore_errors: true
          when: blastwall_update_idm_marker | bool

        - name: Stop after failed policy promotion
          ansible.builtin.fail:
            msg: >-
              Blastwall policy marker promotion failed on {{ inventory_hostname }}.
              The host marker was set to failed when marker updates were enabled.
