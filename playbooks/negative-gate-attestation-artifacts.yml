---
- name: Build controlled Blastwall negative-gate attestation artifacts
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ipa_server: "{{ lookup('env', 'IPA_SERVER') }}"
    ipa_domain: >-
      {{ lookup('env', 'IPA_DOMAIN') |
      default((ipa_server.split('.')[1:] | join('.')), true) }}
    ipa_realm: >-
      {{ lookup('env', 'IPA_REALM') |
      default((ipa_domain | upper), true) }}
    ipa_basedn: >-
      dc={{ ipa_domain | replace('.', ',dc=') }}
    ipa_principal: "{{ lookup('env', 'IPA_PRINCIPAL') }}"
    ipa_login_principal: >-
      {{ ipa_principal if '@' in ipa_principal else ipa_principal ~ '@' ~ ipa_realm }}
    ipa_password: >-
      {{ lookup('env', 'IPA_PASSWORD') |
      default(lookup('env', 'IPA_ADMIN_PASSWORD'), true) }}
    ipa_keytab: "{{ lookup('env', 'IPA_KEYTAB') | default('', true) }}"
    ipa_ca: "{{ lookup('env', 'IPA_CERT') | default('/etc/ipa/ca.crt', true) }}"
    blastwall_negative_gate_case: >-
      {{
        BLASTWALL_NEGATIVE_GATE_CASE |
        default(lookup('env', 'BLASTWALL_NEGATIVE_GATE_CASE') | default('', true), true)
      }}
    blastwall_negative_gate_host: >-
      {{
        BLASTWALL_NEGATIVE_GATE_HOST |
        default(lookup('env', 'BLASTWALL_NEGATIVE_GATE_HOST') | default('', true), true)
      }}
    blastwall_negative_gate_mismatch_host: >-
      {{
        BLASTWALL_NEGATIVE_GATE_MISMATCH_HOST |
        default(lookup('env', 'BLASTWALL_NEGATIVE_GATE_MISMATCH_HOST') | default('mirror-registry.workshop.lan', true), true)
      }}
    blastwall_negative_gate_generation: >-
      {{
        BLASTWALL_NEGATIVE_GATE_GENERATION |
        default(lookup('env', 'BLASTWALL_NEGATIVE_GATE_GENERATION') | default(lookup('pipe', 'date +%s'), true), true)
      }}
    blastwall_negative_gate_profiles_csv: >-
      {{
        BLASTWALL_NEGATIVE_GATE_PROFILES_CSV |
        default(lookup('env', 'BLASTWALL_NEGATIVE_GATE_PROFILES_CSV') | default('base', true), true)
      }}
    blastwall_negative_gate_mismatch_profiles_csv: >-
      {{
        BLASTWALL_NEGATIVE_GATE_MISMATCH_PROFILES_CSV |
        default(lookup('env', 'BLASTWALL_NEGATIVE_GATE_MISMATCH_PROFILES_CSV') | default('strange-socket-v1', true), true)
      }}
    blastwall_policy_name: blastwall-selinux
    blastwall_policy_version: >-
      {{ BLASTWALL_POLICY_VERSION |
      default(lookup('env', 'BLASTWALL_POLICY_VERSION') | default('0.6.1', true), true) }}
    blastwall_policy_release: >-
      {{ BLASTWALL_POLICY_RELEASE |
      default(lookup('env', 'BLASTWALL_POLICY_RELEASE') | default('0.rc1', true), true) }}
    blastwall_policy_nevra: "{{ blastwall_policy_name }}-{{ blastwall_policy_version }}-{{ blastwall_policy_release }}"
    blastwall_current_policy_sha256: >-
      {{
        BLASTWALL_CURRENT_POLICY_SHA256 |
        default(lookup('env', 'BLASTWALL_CURRENT_POLICY_SHA256') | default('', true), true)
      }}
    blastwall_probe_report_sha256: >-
      {{
        BLASTWALL_PROBE_REPORT_SHA256 |
        default(lookup('env', 'BLASTWALL_PROBE_REPORT_SHA256') | default('', true), true)
      }}
    blastwall_profile_registry_path: "{{ playbook_dir }}/../policy/profiles.yml"
    blastwall_profile_registry_sha256: "{{ lookup('file', blastwall_profile_registry_path, rstrip=False) | hash('sha256') }}"
    blastwall_attestation_signer_key: >-
      {{ lookup('env', 'BLASTWALL_ATTESTATION_SIGNER_KEY') | default('', true) }}
    blastwall_attestation_signer_certificate: >-
      {{ lookup('env', 'BLASTWALL_ATTESTATION_SIGNER_CERTIFICATE') | default('', true) }}
    blastwall_attestation_ca_bundle: >-
      {{ lookup('env', 'BLASTWALL_ATTESTATION_CA_BUNDLE') | default('', true) }}
    blastwall_attestation_signer_allowlist: >-
      {{ lookup('env', 'BLASTWALL_ATTESTATION_SIGNER_ALLOWLIST') | default('', true) }}
    blastwall_attestation_vault_primary: >-
      {{ lookup('env', 'BLASTWALL_ATTESTATION_VAULT_PRIMARY') | default('', true) }}
    blastwall_attestation_vault_servers: >-
      {{ lookup('env', 'BLASTWALL_ATTESTATION_VAULT_SERVERS') | default('', true) }}
    blastwall_attestation_vault_scope: >-
      {{ lookup('env', 'BLASTWALL_ATTESTATION_VAULT_SCOPE') | default('shared', true) }}
    blastwall_attestation_vault_owner: >-
      {{ lookup('env', 'BLASTWALL_ATTESTATION_VAULT_OWNER') | default('blastwall-attestation', true) }}
    blastwall_negative_gate_output_dir: /tmp/blastwall-negative-gate-artifacts
  tasks:
    - name: Require explicit negative-gate attestation artifact inputs
      ansible.builtin.assert:
        that:
          - blastwall_negative_gate_case in ['valid', 'replayed-generation', 'expired', 'revoked-index', 'revoked-marker', 'signature-tamper', 'profile-mismatch', 'host-binding-mismatch']
          - blastwall_negative_gate_host | length > 0
          - blastwall_negative_gate_generation | int >= 0
          - blastwall_current_policy_sha256 is match('^[0-9a-f]{64}$')
          - blastwall_probe_report_sha256 is match('^[0-9a-f]{64}$')
          - blastwall_attestation_signer_key | length > 0
          - blastwall_attestation_signer_certificate | length > 0
          - blastwall_attestation_ca_bundle | length > 0
          - blastwall_attestation_signer_allowlist | length > 0
          - blastwall_attestation_vault_primary | length > 0
          - blastwall_attestation_vault_servers | length > 0
          - ipa_server | length > 0
          - ipa_domain | length > 0
          - ipa_principal | length > 0
          - ipa_realm | length > 0 or '@' in ipa_principal
          - ipa_keytab | length > 0 or ipa_password | length > 0
        fail_msg: >-
          Negative attestation artifact construction requires an explicit
          case, host, hashes, signer credential, vault topology, and IdM
          custody credential.

    - name: Write FreeIPA client config for negative-gate artifact custody
      ansible.builtin.copy:
        dest: /etc/ipa/default.conf
        mode: "0644"
        content: |
          [global]
          server = {{ ipa_server }}
          domain = {{ ipa_domain }}
          realm = {{ ipa_realm }}
          basedn = {{ ipa_basedn }}
          xmlrpc_uri = https://{{ ipa_server }}/ipa/xml

    - name: Install injected FreeIPA CA for negative-gate artifact custody
      ansible.builtin.copy:
        src: "{{ ipa_ca }}"
        dest: /etc/ipa/ca.crt
        mode: "0644"
        remote_src: true
      when:
        - ipa_ca | length > 0
        - ipa_ca != "/etc/ipa/ca.crt"

    - name: Build controlled negative-gate attestation artifacts
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python | default('/usr/bin/python3') }}"
          - "{{ playbook_dir }}/../tools/blastwall_negative_gate_artifacts.py"
          - --case
          - "{{ blastwall_negative_gate_case }}"
          - --registry
          - "{{ blastwall_profile_registry_path }}"
          - --host
          - "{{ blastwall_negative_gate_host }}"
          - --mismatch-host
          - "{{ blastwall_negative_gate_mismatch_host }}"
          - --rpm
          - "{{ blastwall_policy_nevra }}"
          - --policy-sha256
          - "{{ blastwall_current_policy_sha256 }}"
          - --registry-sha256
          - "{{ blastwall_profile_registry_sha256 }}"
          - --probe-report-sha256
          - "{{ blastwall_probe_report_sha256 }}"
          - --profiles-csv
          - "{{ blastwall_negative_gate_profiles_csv }}"
          - --mismatch-profiles-csv
          - "{{ blastwall_negative_gate_mismatch_profiles_csv }}"
          - --generation
          - "{{ blastwall_negative_gate_generation | string }}"
          - --source-revision
          - "{{ awx_project_revision | default(tower_project_revision | default('negative-gate', true), true) }}"
          - --aap-workflow-job-id
          - "{{ awx_job_id | default(tower_job_id | default('0', true), true) | string }}"
          - --signer-key
          - "{{ blastwall_attestation_signer_key }}"
          - --signer-certificate
          - "{{ blastwall_attestation_signer_certificate }}"
          - --ca-bundle
          - "{{ blastwall_attestation_ca_bundle }}"
          - --signer-allowlist-csv
          - "{{ blastwall_attestation_signer_allowlist }}"
          - --vault-scope
          - "{{ blastwall_attestation_vault_scope }}"
          - --vault-owner
          - "{{ blastwall_attestation_vault_owner }}"
          - --output-dir
          - "{{ blastwall_negative_gate_output_dir }}"
      register: blastwall_negative_gate_artifact_build
      changed_when: false
      failed_when: blastwall_negative_gate_artifact_build.rc != 0

    - name: Parse controlled negative-gate artifact evidence
      ansible.builtin.set_fact:
        blastwall_negative_gate_artifact_evidence: "{{ blastwall_negative_gate_artifact_build.stdout | from_json }}"
      no_log: true

    - name: Archive controlled negative-gate attestation envelope
      eigenstate.ipa.vault_artifact:
        name: "{{ blastwall_negative_gate_artifact_evidence.vault_artifacts.envelope.name }}"
        state: archived
        server: "{{ blastwall_attestation_vault_primary }}"
        ipaadmin_principal: "{{ ipa_login_principal }}"
        ipaadmin_password: "{{ ipa_password }}"
        kerberos_keytab: "{{ ipa_keytab if ipa_keytab | length > 0 else omit }}"
        verify: "{{ ipa_ca }}"
        shared: "{{ true if blastwall_attestation_vault_scope == 'shared' else omit }}"
        service: "{{ blastwall_attestation_vault_owner if blastwall_attestation_vault_scope == 'service' else omit }}"
        username: "{{ blastwall_attestation_vault_owner if blastwall_attestation_vault_scope == 'user' else omit }}"
        payload_file: "{{ blastwall_negative_gate_artifact_evidence.envelope_file }}"
        expected_sha256: "{{ blastwall_negative_gate_artifact_evidence.attestation_sha256 }}"
        read_back: true
        description: "{{ blastwall_negative_gate_artifact_evidence.attestation_ref }}"
      register: blastwall_negative_gate_envelope_custody
      no_log: true

    - name: Archive controlled negative-gate latest index
      eigenstate.ipa.vault_artifact:
        name: "{{ blastwall_negative_gate_artifact_evidence.vault_artifacts.index.name }}"
        state: archived
        server: "{{ blastwall_attestation_vault_primary }}"
        ipaadmin_principal: "{{ ipa_login_principal }}"
        ipaadmin_password: "{{ ipa_password }}"
        kerberos_keytab: "{{ ipa_keytab if ipa_keytab | length > 0 else omit }}"
        verify: "{{ ipa_ca }}"
        shared: "{{ true if blastwall_attestation_vault_scope == 'shared' else omit }}"
        service: "{{ blastwall_attestation_vault_owner if blastwall_attestation_vault_scope == 'service' else omit }}"
        username: "{{ blastwall_attestation_vault_owner if blastwall_attestation_vault_scope == 'user' else omit }}"
        payload_file: "{{ blastwall_negative_gate_artifact_evidence.index_file }}"
        expected_sha256: "{{ blastwall_negative_gate_artifact_evidence.index_sha256 }}"
        read_back: true
        description: "{{ blastwall_negative_gate_artifact_evidence.index_ref }}"
      register: blastwall_negative_gate_index_custody
      no_log: true

    - name: Assert controlled negative-gate artifact read-back verified
      ansible.builtin.assert:
        that:
          - blastwall_negative_gate_envelope_custody.read_back_verified | bool
          - blastwall_negative_gate_envelope_custody.artifact_sha256 == blastwall_negative_gate_artifact_evidence.attestation_sha256
          - blastwall_negative_gate_index_custody.read_back_verified | bool
          - blastwall_negative_gate_index_custody.artifact_sha256 == blastwall_negative_gate_artifact_evidence.index_sha256
        fail_msg: >-
          Negative-gate attestation artifact read-back verification failed.

    - name: Report controlled negative-gate artifact evidence
      ansible.builtin.debug:
        msg:
          case: "{{ blastwall_negative_gate_artifact_evidence.case }}"
          host: "{{ blastwall_negative_gate_artifact_evidence.host }}"
          marker: "{{ blastwall_negative_gate_artifact_evidence.marker }}"
          attestation_ref: "{{ blastwall_negative_gate_artifact_evidence.attestation_ref }}"
          attestation_sha256: "{{ blastwall_negative_gate_artifact_evidence.attestation_sha256 }}"
          index_ref: "{{ blastwall_negative_gate_artifact_evidence.index_ref }}"
          index_sha256: "{{ blastwall_negative_gate_artifact_evidence.index_sha256 }}"
          index_generation: "{{ blastwall_negative_gate_artifact_evidence.index_generation }}"
          signer_kid: "{{ blastwall_negative_gate_artifact_evidence.signer_kid }}"
