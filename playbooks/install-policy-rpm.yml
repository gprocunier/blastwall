---
- name: Install candidate Blastwall policy RPM
  hosts: "{{ blastwall_policy_pipeline_target_hosts | default('blastwall_policy_stale') }}"
  become: true
  gather_facts: false
  vars:
    blastwall_policy_name: blastwall-selinux
    blastwall_policy_version: >-
      {{ BLASTWALL_POLICY_VERSION | default(lookup('env', 'BLASTWALL_POLICY_VERSION') | default('0.6.1', true), true) }}
    blastwall_policy_release: >-
      {{ BLASTWALL_POLICY_RELEASE | default(lookup('env', 'BLASTWALL_POLICY_RELEASE') | default('0.rc1', true), true) }}
    blastwall_policy_nevra: "{{ blastwall_policy_name }}-{{ blastwall_policy_version }}-{{ blastwall_policy_release }}"
    blastwall_pipeline_root: /var/tmp/blastwall-policy-pipeline
    blastwall_policy_artifact_path: "{{ blastwall_pipeline_root }}/artifacts/{{ blastwall_policy_nevra }}.noarch.rpm"
    blastwall_policy_package_dir: /usr/share/selinux/packages/blastwall
    blastwall_allow_dry_run_profiles: >-
      {{
        BLASTWALL_ALLOW_DRY_RUN_PROFILES |
        default(lookup('env', 'BLASTWALL_ALLOW_DRY_RUN_PROFILES') | default('false', true), true) |
        bool
      }}
    blastwall_required_profiles_env: >-
      {{
        BLASTWALL_REQUIRED_POLICY_PROFILES |
        default(lookup('env', 'BLASTWALL_REQUIRED_POLICY_PROFILES') | default('', true), true)
      }}
    required_blastwall_profiles: >-
      {{
        (blastwall_required_profiles_env.split(',') | map('trim') | reject('equalto', '') | list)
        if blastwall_required_profiles_env | length > 0
        else ['base']
      }}
    blastwall_strange_socket_v1_requested: "{{ 'strange-socket-v1' in required_blastwall_profiles }}"
    blastwall_strange_socket_v1_legacy_dry_run_raw: >-
      {{
        BLASTWALL_STRANGE_SOCKET_V1_DRY_RUN |
        default(lookup('env', 'BLASTWALL_STRANGE_SOCKET_V1_DRY_RUN') | default('', true), true)
      }}
    blastwall_strange_socket_v1_legacy_dry_run_set: "{{ blastwall_strange_socket_v1_legacy_dry_run_raw | string | length > 0 }}"
    blastwall_strange_socket_v1_legacy_dry_run: "{{ blastwall_strange_socket_v1_legacy_dry_run_raw | bool }}"
    blastwall_enable_strange_socket_v1_dry_run: "{{ blastwall_strange_socket_v1_requested | bool and blastwall_allow_dry_run_profiles | bool }}"
    blastwall_selinux_type: targeted
    blastwall_selinux_user: blastwall_u
    blastwall_selinux_role: blastwall_r
    blastwall_selinux_range: s0
    blastwall_policy_bootstrap_modules:
      - blastwall-role
    blastwall_policy_support_modules:
      - blastwall-sshd-login
    blastwall_policy_cil_modules:
      - blastwall-alg-socket-deny
      - blastwall-bpf-deny
      - blastwall-policy-selfprotect
      - blastwall-packet-socket-deny
      - blastwall-userns-deny
      - blastwall-io-uring-deny
      - blastwall-xfrm-deny
      - blastwall-rxrpc-deny
    blastwall_policy_dry_run_modules:
      - blastwall-strange-socket-v1-deny
    blastwall_policy_modules: >-
      {{
        blastwall_policy_bootstrap_modules +
        ['blastwall'] +
        blastwall_policy_support_modules +
        blastwall_policy_cil_modules +
        (blastwall_policy_dry_run_modules if blastwall_enable_strange_socket_v1_dry_run else [])
      }}
    ipa_principal: "{{ lookup('env', 'IPA_PRINCIPAL') }}"
    ipa_realm: "{{ lookup('env', 'IPA_REALM') | default('', true) }}"
    ipa_login_principal: >-
      {{ ipa_principal if '@' in ipa_principal else ipa_principal ~ '@' ~ ipa_realm }}
    ipa_password: >-
      {{ lookup('env', 'IPA_PASSWORD') |
      default(lookup('env', 'IPA_ADMIN_PASSWORD'), true) }}
    ipa_keytab: "{{ lookup('env', 'IPA_KEYTAB') | default('', true) }}"
    krb5_config: "{{ lookup('env', 'KRB5_CONFIG') | default('', true) }}"
    krb5_ccache: FILE:/tmp/blastwall_krb5cc
  tasks:
    - name: Require Kerberos inputs for target SSH
      ansible.builtin.assert:
        that:
          - ipa_principal | length > 0
          - ipa_realm | length > 0 or '@' in ipa_principal
          - ipa_keytab | length > 0 or ipa_password | length > 0
        fail_msg: >-
          Set IPA_PRINCIPAL, IPA_REALM, and either IPA_KEYTAB or IPA_PASSWORD for GSSAPI
          target SSH.
      run_once: true
      delegate_to: localhost
      become: false

    - name: Assert strange-socket-v1 dry-run intent is consistent
      ansible.builtin.assert:
        that:
          - not blastwall_strange_socket_v1_requested | bool or blastwall_allow_dry_run_profiles | bool
          - >-
            not blastwall_strange_socket_v1_legacy_dry_run_set | bool or
            (blastwall_strange_socket_v1_legacy_dry_run | bool) == (blastwall_enable_strange_socket_v1_dry_run | bool)
        fail_msg: >-
          strange-socket-v1 requires canonical dry-run intent:
          include strange-socket-v1 in BLASTWALL_REQUIRED_POLICY_PROFILES and set
          BLASTWALL_ALLOW_DRY_RUN_PROFILES=true. If legacy
          BLASTWALL_STRANGE_SOCKET_V1_DRY_RUN is set, it must agree with the
          derived profile intent.
      run_once: true
      delegate_to: localhost
      become: false

    - name: Authenticate automation identity for GSSAPI target SSH
      ansible.builtin.shell: |
        set -euo pipefail
        if [ -n "${IPA_KEYTAB}" ]; then
          kinit -k -t "${IPA_KEYTAB}" "${IPA_LOGIN_PRINCIPAL}"
        else
          printf '%s\n' "${IPA_PASSWORD}" | kinit "${IPA_LOGIN_PRINCIPAL}"
        fi
      args:
        executable: /bin/bash
      environment:
        IPA_LOGIN_PRINCIPAL: "{{ ipa_login_principal }}"
        IPA_PASSWORD: "{{ ipa_password }}"
        IPA_KEYTAB: "{{ ipa_keytab }}"
        KRB5_CONFIG: "{{ krb5_config }}"
        KRB5CCNAME: "{{ krb5_ccache }}"
      changed_when: false
      no_log: true
      run_once: true
      delegate_to: localhost
      become: false

    - name: Assert candidate policy RPM exists
      ansible.builtin.stat:
        path: "{{ blastwall_policy_artifact_path }}"
      register: blastwall_policy_artifact

    - name: Require candidate policy RPM
      ansible.builtin.assert:
        that:
          - blastwall_policy_artifact.stat.exists
        fail_msg: "Missing candidate RPM {{ blastwall_policy_artifact_path }}."

    - name: Compute candidate policy RPM SHA-256
      ansible.builtin.stat:
        path: "{{ blastwall_policy_artifact_path }}"
        checksum_algorithm: sha256
      register: blastwall_policy_artifact_checksum

    - name: Ensure policy RPM runtime dependencies are present
      ansible.builtin.dnf:
        name:
          - policycoreutils
          - policycoreutils-python-utils
          - selinux-policy-targeted
        state: present

    - name: Install or refresh candidate Blastwall policy RPM payload
      ansible.builtin.command:
        argv:
          - rpm
          - -Uvh
          - --oldpackage
          - --replacepkgs
          - --replacefiles
          - "{{ blastwall_policy_artifact_path }}"
      changed_when: true

    - name: Activate candidate SELinux policy modules from RPM payload
      ansible.builtin.command: >-
        semodule -i
        {% for module in blastwall_policy_bootstrap_modules %}
        {{ blastwall_policy_package_dir }}/{{ module }}.cil
        {% endfor %}
        {{ blastwall_policy_package_dir }}/blastwall.pp
        {% for module in blastwall_policy_support_modules %}
        {{ blastwall_policy_package_dir }}/{{ module }}.cil
        {% endfor %}
        {% for module in blastwall_policy_cil_modules %}
        {{ blastwall_policy_package_dir }}/{{ module }}.cil
        {% endfor %}
        {% if blastwall_enable_strange_socket_v1_dry_run %}
        {% for module in blastwall_policy_dry_run_modules %}
        {{ blastwall_policy_package_dir }}/dry-run/{{ module }}.cil
        {% endfor %}
        {% endif %}
      changed_when: true

    - name: Install Blastwall SELinux login context from RPM payload
      ansible.builtin.copy:
        src: "{{ blastwall_policy_package_dir }}/contexts/{{ blastwall_selinux_user }}"
        dest: >-
          /etc/selinux/{{ blastwall_selinux_type }}/contexts/users/{{ blastwall_selinux_user }}
        owner: root
        group: root
        mode: "0644"
        remote_src: true

    - name: List SELinux users before candidate registration
      ansible.builtin.command:
        argv:
          - semanage
          - user
          - -l
      register: blastwall_selinux_users_before
      changed_when: false

    - name: Parse existing SELinux user names
      ansible.builtin.set_fact:
        blastwall_selinux_user_names: >-
          {{
            blastwall_selinux_users_before.stdout_lines
            | map('trim')
            | reject('equalto', '')
            | map('split')
            | map('first')
            | list
          }}

    - name: Update existing Blastwall SELinux user
      ansible.builtin.command:
        argv:
          - semanage
          - user
          - -m
          - -R
          - "{{ blastwall_selinux_role }}"
          - -r
          - "{{ blastwall_selinux_range }}"
          - "{{ blastwall_selinux_user }}"
      changed_when: true
      when: blastwall_selinux_user in blastwall_selinux_user_names

    - name: Add Blastwall SELinux user
      ansible.builtin.command:
        argv:
          - semanage
          - user
          - -a
          - -R
          - "{{ blastwall_selinux_role }}"
          - -r
          - "{{ blastwall_selinux_range }}"
          - "{{ blastwall_selinux_user }}"
      changed_when: true
      when: blastwall_selinux_user not in blastwall_selinux_user_names

    - name: Restore SELinux login context labels
      ansible.builtin.command:
        argv:
          - restorecon
          - -R
          - /etc/selinux/targeted/contexts/users
      changed_when: false

    - name: List installed SELinux policy modules
      ansible.builtin.command:
        argv:
          - semodule
          - -l
      register: blastwall_semodule_list
      changed_when: false

    - name: Validate installed SELinux policy modules
      ansible.builtin.assert:
        that:
          - item in (blastwall_semodule_list.stdout_lines | map('split') | map('first') | list)
        fail_msg: "SELinux module {{ item }} is not installed."
      loop: "{{ blastwall_policy_modules }}"

    - name: Validate candidate RPM is installed
      ansible.builtin.command:
        argv:
          - rpm
          - -q
          - "{{ blastwall_policy_nevra }}"
      changed_when: false

    - name: Verify installed candidate RPM payload
      ansible.builtin.command:
        argv:
          - rpm
          - -V
          - "{{ blastwall_policy_name }}"
      register: blastwall_policy_rpm_verify
      changed_when: false
      failed_when: blastwall_policy_rpm_verify.rc not in [0, 1]

    - name: Assert installed candidate RPM payload is unchanged
      ansible.builtin.assert:
        that:
          - blastwall_policy_rpm_verify.rc == 0
        fail_msg: >-
          rpm -V {{ blastwall_policy_name }} reported drift:
          {{ blastwall_policy_rpm_verify.stdout | default('') }}

    - name: Publish installed policy RPM metadata
      ansible.builtin.set_stats:
        data:
          policy_nevra: "{{ blastwall_policy_nevra }}"
          policy_rpm: "{{ blastwall_policy_artifact_path }}"
          blastwall_policy_rpm_sha256: "{{ blastwall_policy_artifact_checksum.stat.checksum }}"

    - name: Report policy installation evidence
      ansible.builtin.debug:
        msg:
          policy_pipeline_install: passed
          policy_nevra: "{{ blastwall_policy_nevra }}"
          policy_rpm_sha256: "{{ blastwall_policy_artifact_checksum.stat.checksum }}"
          strange_socket_v1_dry_run: "{{ blastwall_enable_strange_socket_v1_dry_run }}"
