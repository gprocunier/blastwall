<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="470" viewBox="0 0 1280 470" role="img" aria-labelledby="v3-marker-locator-flow-title v3-marker-locator-flow-desc">
<title id="v3-marker-locator-flow-title">Marker Is Locator, Evidence Is Proof</title>
<desc id="v3-marker-locator-flow-desc">Inventory may select a candidate from IdM, but stable-v3 trusts only verified signed evidence.</desc>
<defs>
<marker id="arrow-default" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ee0000" /></marker>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4d4d4d" /></marker>
<marker id="arrow-success" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3d7317" /></marker>
<marker id="arrow-warning" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f0ab00" /></marker>
</defs>
<style>
svg { background: #ffffff; font-family: 'Red Hat Text', 'Helvetica Neue', Arial, sans-serif; }
.diagram-title { fill: #151515; font: 700 26px 'Red Hat Display', 'Red Hat Text', Arial, sans-serif; }
.diagram-subtitle { fill: #4d4d4d; font: 400 15px 'Red Hat Text', Arial, sans-serif; }
.lane rect { fill: #f5f5f5; stroke: #e0e0e0; stroke-width: 1.5; }
.lane--red rect { fill: #fff5f5; stroke: #f4b7b7; }
.lane--blue rect { fill: #f1f7ff; stroke: #b8d8ff; }
.lane-title { fill: #a30000; font: 700 16px 'Red Hat Display', 'Red Hat Text', Arial, sans-serif; }
.card rect { fill: #ffffff; stroke: #e0e0e0; stroke-width: 1.5; }
.card--gate rect { stroke: #ee0000; stroke-width: 2.2; }
.card--proof rect { stroke: #0066cc; stroke-width: 2; }
.card--success rect { stroke: #3d7317; stroke-width: 2; }
.card--warning rect { stroke: #f0ab00; stroke-width: 2; }
.card--muted rect { fill: #f5f5f5; stroke: #c7c7c7; }
.card-title { fill: #151515; font: 700 17px 'Red Hat Display', 'Red Hat Text', Arial, sans-serif; }
.card-body { fill: #4d4d4d; font: 400 13.5px 'Red Hat Text', Arial, sans-serif; }
.connector { fill: none; stroke: #ee0000; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.connector--muted { stroke: #4d4d4d; }
.connector--success { stroke: #3d7317; }
.connector--warning { stroke: #f0ab00; }
.connector--dashed { stroke-dasharray: 7 7; }
.connector-label { fill: #4d4d4d; font: 700 12px 'Red Hat Text', Arial, sans-serif; }
.standalone-label { fill: #151515; font: 700 15px 'Red Hat Text', Arial, sans-serif; }
.standalone-label--muted { fill: #4d4d4d; font-weight: 500; }
.standalone-label--red { fill: #a30000; }
</style>
<text class="diagram-title" x="32" y="42">Marker Is Locator, Evidence Is Proof</text>
<text class="diagram-subtitle" x="32" y="68">Inventory may select a candidate from IdM, but stable-v3 trusts only verified signed evidence.</text>
<g class="lane lane--blue">
<rect x="32" y="95" width="350" height="305" rx="8" />
<text class="lane-title" x="50" y="123" text-anchor="start">
<tspan x="50" dy="0">Selection plane</tspan>
</text>
</g>
<g class="lane lane--red">
<rect x="430" y="95" width="818" height="305" rx="8" />
<text class="lane-title" x="448" y="123" text-anchor="start">
<tspan x="448" dy="0">Proof and launch plane</tspan>
</text>
</g>
<polyline class="connector connector--muted" points="200,208 224,208" marker-end="url(#arrow-muted)" />
<polyline class="connector connector--default connector--dashed" points="352,208 462,208" marker-end="url(#arrow-default)" />
<text class="connector-label" x="407" y="192" text-anchor="middle">locator</text>
<polyline class="connector connector--default" points="604,208 640,208" marker-end="url(#arrow-default)" />
<polyline class="connector connector--default" points="792,208 830,208" marker-end="url(#arrow-default)" />
<polyline class="connector connector--success" points="984,208 1022,208" marker-end="url(#arrow-success)" />
<g class="card card--default">
<rect x="62" y="155" width="138" height="105" rx="6" />
<text class="card-title" x="80" y="185" text-anchor="start">
<tspan x="80" dy="0">IdM host</tspan>
<tspan x="80" dy="16">marker</tspan>
</text>
<text class="card-body" x="80" y="219" text-anchor="start">
<tspan x="80" dy="0">blastwall=v3</tspan>
<tspan x="80" dy="13">attest_ref</tspan>
<tspan x="80" dy="13">attest_sha256</tspan>
</text>
</g>
<g class="card card--muted">
<rect x="224" y="155" width="128" height="105" rx="6" />
<text class="card-title" x="242" y="185" text-anchor="start">
<tspan x="242" dy="0">AAP</tspan>
<tspan x="242" dy="16">inventory</tspan>
</text>
<text class="card-body" x="242" y="219" text-anchor="start">
<tspan x="242" dy="0">candidate</tspan>
<tspan x="242" dy="13">group only</tspan>
</text>
</g>
<g class="card card--proof">
<rect x="462" y="155" width="142" height="105" rx="6" />
<text class="card-title" x="480" y="185" text-anchor="start">
<tspan x="480" dy="0">KRA vault</tspan>
<tspan x="480" dy="16">artifact</tspan>
</text>
<text class="card-body" x="480" y="219" text-anchor="start">
<tspan x="480" dy="0">signed envelope</tspan>
<tspan x="480" dy="13">latest index</tspan>
</text>
</g>
<g class="card card--gate">
<rect x="640" y="155" width="152" height="105" rx="6" />
<text class="card-title" x="658" y="185" text-anchor="start">
<tspan x="658" dy="0">Verifier</tspan>
<tspan x="658" dy="16">preflight</tspan>
</text>
<text class="card-body" x="658" y="219" text-anchor="start">
<tspan x="658" dy="0">parse</tspan>
<tspan x="658" dy="13">signature</tspan>
<tspan x="658" dy="13">binding</tspan>
</text>
</g>
<g class="card card--proof">
<rect x="830" y="155" width="154" height="105" rx="6" />
<text class="card-title" x="848" y="185" text-anchor="start">
<tspan x="848" dy="0">Live host</tspan>
<tspan x="848" dy="16">checks</tspan>
</text>
<text class="card-body" x="848" y="219" text-anchor="start">
<tspan x="848" dy="0">policy hash</tspan>
<tspan x="848" dy="13">profile set</tspan>
<tspan x="848" dy="13">state</tspan>
</text>
</g>
<g class="card card--success">
<rect x="1022" y="155" width="164" height="105" rx="6" />
<text class="card-title" x="1040" y="185" text-anchor="start">
<tspan x="1040" dy="0">Launch</tspan>
<tspan x="1040" dy="16">decision</tspan>
</text>
<text class="card-body" x="1040" y="219" text-anchor="start">
<tspan x="1040" dy="0">allow only after</tspan>
<tspan x="1040" dy="13">all checks pass</tspan>
</text>
</g>
<text class="standalone-label standalone-label--red" x="406" y="318" text-anchor="middle">
<tspan x="406" dy="0">Trust boundary:</tspan>
<tspan x="406" dy="16">marker text is never enough</tspan>
</text>
<text class="standalone-label standalone-label--red" x="1106" y="318" text-anchor="middle">
<tspan x="1106" dy="0">Security failures</tspan>
<tspan x="1106" dy="16">fail closed</tspan>
</text>
</svg>
