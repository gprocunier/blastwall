<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="v3-adopter-readiness-title v3-adopter-readiness-desc">
<title id="v3-adopter-readiness-title">Adopter Readiness Path</title>
<desc id="v3-adopter-readiness-desc">The exemplar is useful when local owners turn the demonstrated path into their own operating control.</desc>
<defs>
<marker id="arrow-default" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ee0000" /></marker>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4d4d4d" /></marker>
<marker id="arrow-success" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3d7317" /></marker>
<marker id="arrow-warning" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f0ab00" /></marker>
</defs>
<style>
svg { background: #ffffff; font-family: 'Red Hat Text', 'Helvetica Neue', Arial, sans-serif; }
.diagram-title { fill: #151515; font: 700 26px 'Red Hat Display', 'Red Hat Text', Arial, sans-serif; }
.diagram-subtitle { fill: #4d4d4d; font: 400 15px 'Red Hat Text', Arial, sans-serif; }
.lane rect { fill: #f5f5f5; stroke: #e0e0e0; stroke-width: 1.5; }
.lane--red rect { fill: #fff5f5; stroke: #f4b7b7; }
.lane--blue rect { fill: #f1f7ff; stroke: #b8d8ff; }
.lane-title { fill: #a30000; font: 700 16px 'Red Hat Display', 'Red Hat Text', Arial, sans-serif; }
.card rect { fill: #ffffff; stroke: #e0e0e0; stroke-width: 1.5; }
.card--gate rect { stroke: #ee0000; stroke-width: 2.2; }
.card--proof rect { stroke: #0066cc; stroke-width: 2; }
.card--success rect { stroke: #3d7317; stroke-width: 2; }
.card--warning rect { stroke: #f0ab00; stroke-width: 2; }
.card--muted rect { fill: #f5f5f5; stroke: #c7c7c7; }
.card-title { fill: #151515; font: 700 17px 'Red Hat Display', 'Red Hat Text', Arial, sans-serif; }
.card-body { fill: #4d4d4d; font: 400 13.5px 'Red Hat Text', Arial, sans-serif; }
.connector { fill: none; stroke: #ee0000; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.connector--muted { stroke: #4d4d4d; }
.connector--success { stroke: #3d7317; }
.connector--warning { stroke: #f0ab00; }
.connector--dashed { stroke-dasharray: 7 7; }
.connector-label { fill: #4d4d4d; font: 700 12px 'Red Hat Text', Arial, sans-serif; }
.standalone-label { fill: #151515; font: 700 15px 'Red Hat Text', Arial, sans-serif; }
.standalone-label--muted { fill: #4d4d4d; font-weight: 500; }
.standalone-label--red { fill: #a30000; }
</style>
<text class="diagram-title" x="32" y="42">Adopter Readiness Path</text>
<text class="diagram-subtitle" x="32" y="68">The exemplar is useful when local owners turn the demonstrated path into their own operating control.</text>
<polyline class="connector connector--default" points="230,191 275,191" marker-end="url(#arrow-default)" />
<polyline class="connector connector--default" points="445,191 490,191" marker-end="url(#arrow-default)" />
<polyline class="connector connector--default" points="660,191 705,191" marker-end="url(#arrow-default)" />
<polyline class="connector connector--default" points="875,191 920,191" marker-end="url(#arrow-default)" />
<polyline class="connector connector--success" points="1005,237 1005,392 875,392" marker-end="url(#arrow-success)" />
<polyline class="connector connector--warning" points="705,392 660,392" marker-end="url(#arrow-warning)" />
<polyline class="connector connector--muted" points="490,392 445,392" marker-end="url(#arrow-muted)" />
<g class="card card--muted">
<rect x="70" y="145" width="160" height="115" rx="6" />
<text class="card-title" x="88" y="175" text-anchor="start">
<tspan x="88" dy="0">Assign</tspan>
<tspan x="88" dy="16">owners</tspan>
</text>
<text class="card-body" x="88" y="209" text-anchor="start">
<tspan x="88" dy="0">boundary</tspan>
<tspan x="88" dy="13">signer/KRA</tspan>
<tspan x="88" dy="13">response</tspan>
</text>
</g>
<g class="card card--proof">
<rect x="275" y="145" width="170" height="115" rx="6" />
<text class="card-title" x="293" y="175" text-anchor="start">
<tspan x="293" dy="0">Choose</tspan>
<tspan x="293" dy="16">custody</tspan>
</text>
<text class="card-body" x="293" y="209" text-anchor="start">
<tspan x="293" dy="0">service principals</tspan>
<tspan x="293" dy="13">rotation</tspan>
<tspan x="293" dy="13">revocation</tspan>
</text>
</g>
<g class="card card--proof">
<rect x="490" y="145" width="170" height="115" rx="6" />
<text class="card-title" x="508" y="175" text-anchor="start">
<tspan x="508" dy="0">Validate</tspan>
<tspan x="508" dy="16">topology</tspan>
</text>
<text class="card-body" x="508" y="209" text-anchor="start">
<tspan x="508" dy="0">IdM/KRA</tspan>
<tspan x="508" dy="13">AAP</tspan>
<tspan x="508" dy="13">host access</tspan>
</text>
</g>
<g class="card card--gate">
<rect x="705" y="145" width="170" height="115" rx="6" />
<text class="card-title" x="723" y="175" text-anchor="start">
<tspan x="723" dy="0">Run</tspan>
<tspan x="723" dy="16">evidence gate</tspan>
</text>
<text class="card-body" x="723" y="209" text-anchor="start">
<tspan x="723" dy="0">healthy path</tspan>
<tspan x="723" dy="13">failure states</tspan>
</text>
</g>
<g class="card card--muted">
<rect x="920" y="145" width="170" height="115" rx="6" />
<text class="card-title" x="938" y="175" text-anchor="start">
<tspan x="938" dy="0">Replay</tspan>
<tspan x="938" dy="16">corpus</tspan>
</text>
<text class="card-body" x="938" y="209" text-anchor="start">
<tspan x="938" dy="0">ordinary</tspan>
<tspan x="938" dy="13">automation jobs</tspan>
</text>
</g>
<g class="card card--success">
<rect x="705" y="350" width="170" height="100" rx="6" />
<text class="card-title" x="723" y="380" text-anchor="start">
<tspan x="723" dy="0">Record</tspan>
<tspan x="723" dy="16">decision</tspan>
</text>
<text class="card-body" x="723" y="414" text-anchor="start">
<tspan x="723" dy="0">evidence, dates,</tspan>
<tspan x="723" dy="13">owners</tspan>
</text>
</g>
<g class="card card--warning">
<rect x="490" y="350" width="170" height="100" rx="6" />
<text class="card-title" x="508" y="380" text-anchor="start">
<tspan x="508" dy="0">Plan</tspan>
<tspan x="508" dy="16">recapture</tspan>
</text>
<text class="card-body" x="508" y="414" text-anchor="start">
<tspan x="508" dy="0">contract changes</tspan>
<tspan x="508" dy="13">signing changes</tspan>
</text>
</g>
<g class="card card--proof">
<rect x="275" y="350" width="170" height="100" rx="6" />
<text class="card-title" x="293" y="380" text-anchor="start">
<tspan x="293" dy="0">Schedule</tspan>
<tspan x="293" dy="16">audit</tspan>
</text>
<text class="card-body" x="293" y="414" text-anchor="start">
<tspan x="293" dy="0">KRA health</tspan>
<tspan x="293" dy="13">inventory drift</tspan>
</text>
</g>
</svg>
