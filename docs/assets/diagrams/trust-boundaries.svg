<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Blastwall trust boundaries Red Hat styled diagram" width="1280" height="520" viewBox="0 0 1280 520">
  <defs>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.14"/>
    </filter>
    <filter id="paper">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.025"/></feComponentTransfer>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 13 7 L 1 13 z" fill="#ee0000"/>
    </marker>
    <style>
      .canvas { fill: #f7f7f7; }
      .grain { filter: url(#paper); opacity: 0.65; }
      .boundary rect { fill: #fafafa; stroke: #c7c7c7; stroke-width: 1.4; filter: url(#shadow); }
      .boundary-title { fill: #151515; font: 700 22px "Red Hat Display", "Red Hat Text", Arial, sans-serif; text-anchor: middle; letter-spacing: 0; }
      .card { fill: #ffffff; stroke: #c7c7c7; stroke-width: 1.35; filter: url(#shadow); }
      .title { fill: #151515; font: 700 17px "Red Hat Display", "Red Hat Text", Arial, sans-serif; letter-spacing: 0; }
      .subtitle { fill: #151515; font: 400 13.2px "Red Hat Text", Arial, sans-serif; letter-spacing: 0; }
      .connector { fill: none; stroke: #ee0000; stroke-width: 2.45; stroke-linecap: round; stroke-linejoin: round; }
      .connector.dashed { stroke-dasharray: 8 8; }
      .chip rect { fill: #f7f7f7; stroke: #ee0000; stroke-width: 1.1; }
      .chip text { fill: #be0000; font: 600 12.5px "Red Hat Text", Arial, sans-serif; text-anchor: middle; letter-spacing: 0; }
      .icon { fill: none; stroke: #ee0000; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect class="canvas" width="1280" height="520"/>
  <rect class="grain" width="1280" height="520"/>

  <g class="boundary">
    <rect x="42" y="54" width="452" height="386" rx="14"/>
    <text class="boundary-title" x="268" y="92">Trusted control plane</text>
  </g>
  <g class="boundary">
    <rect x="586" y="54" width="652" height="386" rx="14"/>
    <text class="boundary-title" x="912" y="92">Managed host enforcement boundary</text>
  </g>

  <g class="edges">
    <path class="connector" d="M 268 176 V 216" marker-end="url(#arrow)"/>
    <path class="connector" d="M 268 306 V 342" marker-end="url(#arrow)"/>
    <path class="connector" d="M 448 260 H 658" marker-end="url(#arrow)"/>
    <path class="connector" d="M 760 236 V 306" marker-end="url(#arrow)"/>
    <path class="connector" d="M 860 350 H 934" marker-end="url(#arrow)"/>
    <path class="connector" d="M 1038 298 V 314" marker-end="url(#arrow)"/>
    <path class="connector dashed" d="M 1142 366 H 1180 V 168" marker-end="url(#arrow)"/>
  </g>

  <g class="node">
    <rect class="card" x="88" y="116" width="360" height="60" rx="8"/>
    <g class="icon" transform="translate(110 130)">
      <path d="M 16 0 L 30 6 V 18 C 30 27 24 34 16 38 C 8 34 2 27 2 18 V 6 Z"/>
    </g>
    <text class="title" x="166" y="143">AAP controller</text>
    <text class="subtitle" x="166" y="162">trusted gate and evidence surface</text>
  </g>

  <g class="node">
    <rect class="card" x="88" y="216" width="360" height="90" rx="8"/>
    <g class="icon" transform="translate(110 242)">
      <ellipse cx="17" cy="8" rx="17" ry="7"/>
      <path d="M 0 8 V 28 C 0 32 8 36 17 36 C 26 36 34 32 34 28 V 8"/>
      <path d="M 0 18 C 0 22 8 26 17 26 C 26 26 34 22 34 18"/>
    </g>
    <text class="title" x="166" y="250">IdM / FreeIPA</text>
    <text class="subtitle" x="166" y="270">identity, HBAC, sudo, maps</text>
    <text class="subtitle" x="166" y="288">and verified host markers</text>
  </g>

  <g class="node">
    <rect class="card" x="88" y="342" width="360" height="60" rx="8"/>
    <g class="icon" transform="translate(110 354)">
      <rect x="1" y="5" width="34" height="28" rx="3"/>
      <path d="M 9 14 H 27"/>
      <path d="M 9 23 H 21"/>
    </g>
    <text class="title" x="166" y="369">Policy delivery</text>
    <text class="subtitle" x="166" y="388">RPM and module integrity assumed</text>
  </g>

  <g class="node">
    <rect class="card" x="658" y="196" width="204" height="80" rx="8"/>
    <g class="icon" transform="translate(680 218)">
      <path d="M 24 14 H 28 C 32 14 34 17 34 20 C 34 23 32 26 28 26 H 24"/>
      <path d="M 12 14 H 8 C 4 14 2 17 2 20 C 2 23 4 26 8 26 H 12"/>
      <path d="M 11 20 H 25"/>
    </g>
    <text class="title" x="734" y="231">SSH + SSSD</text>
    <text class="subtitle" x="734" y="251">pam_selinux maps</text>
  </g>

  <g class="node">
    <rect class="card" x="658" y="306" width="204" height="88" rx="8"/>
    <g class="icon" transform="translate(680 329)">
      <circle cx="17" cy="17" r="16"/>
      <path d="M 10 17 H 24"/>
      <path d="M 17 10 V 24"/>
    </g>
    <text class="title" x="734" y="340">Automation</text>
    <text class="title" x="734" y="361">session</text>
    <text class="subtitle" x="734" y="379">untrusted subject</text>
  </g>

  <g class="node">
    <rect class="card" x="934" y="176" width="208" height="122" rx="8"/>
    <g class="icon" transform="translate(956 214)">
      <path d="M 16 0 L 32 8 V 20 C 32 29 25 36 16 40 C 7 36 0 29 0 20 V 8 Z"/>
      <path d="M 8 20 L 14 26 L 26 12"/>
    </g>
    <text class="title" x="1012" y="222">Kernel</text>
    <text class="title" x="1012" y="243">SELinux</text>
    <text class="subtitle" x="1012" y="263">trusted</text>
    <text class="subtitle" x="1012" y="279">enforcement</text>
  </g>

  <g class="node">
    <rect class="card" x="934" y="314" width="208" height="108" rx="8"/>
    <g class="icon" transform="translate(956 343)">
      <circle cx="17" cy="17" r="16"/>
      <path d="M 7 7 L 27 27"/>
    </g>
    <text class="title" x="1012" y="350">Denied</text>
    <text class="title" x="1012" y="371">surfaces</text>
    <text class="subtitle" x="1012" y="391">probes and AVC</text>
    <text class="subtitle" x="1012" y="407">records</text>
  </g>

  <g class="node">
    <rect class="card" x="1058" y="112" width="144" height="56" rx="8"/>
    <g class="icon" transform="translate(1074 122)">
      <rect x="0" y="0" width="28" height="28" rx="3"/>
      <path d="M 7 9 H 21"/>
      <path d="M 7 15 H 18"/>
      <path d="M 7 21 H 21"/>
    </g>
    <text class="title" x="1118" y="136">Audit</text>
    <text class="subtitle" x="1118" y="154">records</text>
  </g>

  <g class="chip">
    <rect x="499" y="246" width="118" height="28" rx="5"/>
    <text x="558" y="265.5">trusted state</text>
  </g>
</svg>
