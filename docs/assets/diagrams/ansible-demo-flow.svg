<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ansible demo flow Red Hat styled diagram" width="1280" height="490" viewBox="0 0 1280 490">
  <defs>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.14"/></filter>
    <filter id="paper"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 0.025"/></feComponentTransfer></filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 13 7 L 1 13 z" fill="#ee0000"/></marker>
    <style>.canvas{fill:#f7f7f7}.grain{filter:url(#paper);opacity:.65}.lane rect{fill:#fafafa;stroke:#c7c7c7;stroke-width:1.4;filter:url(#shadow)}.lane-title{fill:#151515;font:700 22px "Red Hat Display","Red Hat Text",Arial,sans-serif;text-anchor:middle}.card{fill:#fff;stroke:#c7c7c7;stroke-width:1.35;filter:url(#shadow)}.title{fill:#151515;font:700 17px "Red Hat Display","Red Hat Text",Arial,sans-serif}.subtitle{fill:#151515;font:400 13px "Red Hat Text",Arial,sans-serif}.connector{fill:none;stroke:#ee0000;stroke-width:2.45;stroke-linecap:round;stroke-linejoin:round}.chip rect{fill:#f7f7f7;stroke:#ee0000;stroke-width:1.1}.chip text{fill:#be0000;font:600 12.4px "Red Hat Text",Arial,sans-serif;text-anchor:middle}.icon{fill:none;stroke:#ee0000;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}</style>
  </defs>
  <rect class="canvas" width="1280" height="490"/><rect class="grain" width="1280" height="490"/>
  <g class="lane"><rect x="42" y="54" width="1196" height="370" rx="14"/><text class="lane-title" x="640" y="92">Ansible demo proof flow</text></g>
  <g class="edges"><path class="connector" d="M 268 180 H 340" marker-end="url(#arrow)"/><path class="connector" d="M 536 180 H 608" marker-end="url(#arrow)"/><path class="connector" d="M 804 180 H 876" marker-end="url(#arrow)"/><path class="connector" d="M 1072 180 H 1120 V 306" marker-end="url(#arrow)"/></g>
  <g class="node"><rect class="card" x="72" y="130" width="196" height="100" rx="8"/><g class="icon" transform="translate(94 158)"><rect x="0" y="0" width="34" height="34" rx="4"/><path d="M 8 12 H 26"/><path d="M 8 22 H 20"/></g><text class="title" x="150" y="165">Bastion PoC</text><text class="title" x="150" y="186">tree</text><text class="subtitle" x="150" y="207">local playbooks</text></g>
  <g class="node"><rect class="card" x="340" y="130" width="196" height="100" rx="8"/><g class="icon" transform="translate(362 159)"><ellipse cx="17" cy="8" rx="17" ry="7"/><path d="M 0 8 V 28 C 0 32 8 36 17 36 C 26 36 34 32 34 28 V 8"/></g><text class="title" x="418" y="165">Read IdM</text><text class="title" x="418" y="186">state</text><text class="subtitle" x="418" y="207">eigenstate.ipa</text><text class="subtitle" x="418" y="223">gate</text></g>
  <g class="node"><rect class="card" x="608" y="130" width="196" height="100" rx="8"/><g class="icon" transform="translate(630 158)"><path d="M 16 0 L 32 8 V 20 C 32 29 25 36 16 40 C 7 36 0 29 0 20 V 8 Z"/></g><text class="title" x="686" y="165">Deploy</text><text class="title" x="686" y="186">policy</text><text class="subtitle" x="686" y="207">RPM + modules</text></g>
  <g class="node"><rect class="card" x="876" y="130" width="196" height="100" rx="8"/><g class="icon" transform="translate(898 158)"><circle cx="17" cy="17" r="16"/><path d="M 7 7 L 27 27"/></g><text class="title" x="954" y="165">Run probes</text><text class="subtitle" x="954" y="187">AF_ALG, BPF</text><text class="subtitle" x="954" y="205">userns + xfrm</text><text class="subtitle" x="954" y="221">RxRPC</text></g>
  <g class="node"><rect class="card" x="1026" y="306" width="188" height="82" rx="8"/><g class="icon" transform="translate(1046 330)"><rect x="0" y="0" width="34" height="34" rx="4"/><path d="M 8 10 H 26"/><path d="M 8 18 H 22"/><path d="M 8 26 H 26"/></g><text class="title" x="1100" y="341">Audit proof</text><text class="subtitle" x="1100" y="359">AVC + self</text><text class="subtitle" x="1100" y="375">protect</text></g>
  <g class="chip"><rect x="112" y="258" width="116" height="28" rx="5"/><text x="170" y="277.5">boundary</text></g><g class="chip"><rect x="370" y="258" width="136" height="28" rx="5"/><text x="438" y="277.5">IdM eligibility</text></g><g class="chip"><rect x="648" y="258" width="116" height="28" rx="5"/><text x="706" y="277.5">host state</text></g><g class="chip"><rect x="916" y="258" width="116" height="28" rx="5"/><text x="974" y="277.5">denials</text></g>
</svg>
