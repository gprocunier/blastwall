<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Blastwall evidence loop Red Hat styled diagram" width="1280" height="560" viewBox="0 0 1280 560">
  <defs>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.14"/>
    </filter>
    <filter id="paper">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.025"/></feComponentTransfer>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 13 7 L 1 13 z" fill="#ee0000"/>
    </marker>
    <style>
      .canvas { fill: #f7f7f7; }
      .grain { filter: url(#paper); opacity: 0.65; }
      .lane rect { fill: #fafafa; stroke: #c7c7c7; stroke-width: 1.4; filter: url(#shadow); }
      .lane-title { fill: #151515; font: 700 21px "Red Hat Display", "Red Hat Text", Arial, sans-serif; text-anchor: middle; letter-spacing: 0; }
      .card { fill: #ffffff; stroke: #c7c7c7; stroke-width: 1.35; filter: url(#shadow); }
      .title { fill: #151515; font: 700 17px "Red Hat Display", "Red Hat Text", Arial, sans-serif; letter-spacing: 0; }
      .subtitle { fill: #151515; font: 400 13.4px "Red Hat Text", Arial, sans-serif; letter-spacing: 0; }
      .small { font-size: 12.8px; }
      .connector { fill: none; stroke: #ee0000; stroke-width: 2.45; stroke-linecap: round; stroke-linejoin: round; }
      .connector.dashed { stroke-dasharray: 8 8; }
      .chip rect { fill: #f7f7f7; stroke: #ee0000; stroke-width: 1.1; }
      .chip text { fill: #be0000; font: 600 12.5px "Red Hat Text", Arial, sans-serif; text-anchor: middle; letter-spacing: 0; }
    </style>
  </defs>

  <rect class="canvas" width="1280" height="560"/>
  <rect class="grain" width="1280" height="560"/>

  <g class="lane">
    <rect x="32" y="34" width="1216" height="204" rx="14"/>
    <text class="lane-title" x="640" y="70">Bootstrap and managed-host proof</text>
  </g>
  <g class="lane">
    <rect x="32" y="300" width="1216" height="220" rx="14"/>
    <text class="lane-title" x="640" y="336">AAP gate and operator evidence</text>
  </g>

  <g class="edges">
    <path class="connector" d="M 306 164 H 368" marker-end="url(#arrow)"/>
    <path class="connector" d="M 586 164 H 648" marker-end="url(#arrow)"/>
    <path class="connector" d="M 866 164 H 928" marker-end="url(#arrow)"/>
    <path class="connector" d="M 1037 220 V 376" marker-end="url(#arrow)"/>
    <path class="connector" d="M 927 432 H 866" marker-end="url(#arrow)"/>
    <path class="connector" d="M 648 432 H 586" marker-end="url(#arrow)"/>
    <path class="connector" d="M 368 432 H 306" marker-end="url(#arrow)"/>
    <path class="connector dashed" d="M 197 376 V 258 H 197 V 220" marker-end="url(#arrow)"/>
    <g class="chip">
      <rect x="975" y="260" width="124" height="28" rx="5"/>
      <text x="1037" y="279.5">verified only</text>
    </g>
    <g class="chip">
      <rect x="131" y="260" width="132" height="28" rx="5"/>
      <text x="197" y="279.5">next run input</text>
    </g>
  </g>

  <g class="node">
    <rect class="card" x="88" y="108" width="218" height="112" rx="8"/>
    <svg x="108" y="131" width="38" height="38" viewBox="0 0 36 36" fill="#ee0000" aria-hidden="true"><path d="m29.13 6.73-11-2.34a.57.57 0 0 0-.26 0l-11 2.34a.61.61 0 0 0-.49.61V20a11.62 11.62 0 0 0 23.24 0V7.34a.61.61 0 0 0-.49-.61ZM18 5.64l10.38 2.2v5.61L7.62 17.86v-10Zm0 24.74A10.4 10.4 0 0 1 7.62 20v-.86l20.76-4.41V20A10.4 10.4 0 0 1 18 30.38Z"/></svg>
    <text class="title" x="162" y="145">IdM object</text>
    <text class="title" x="162" y="166">state</text>
    <text class="subtitle small" x="162" y="184">identity + access</text>
    <text class="subtitle small" x="162" y="199">records</text>
  </g>

  <g class="node">
    <rect class="card" x="368" y="108" width="218" height="112" rx="8"/>
    <svg x="388" y="131" width="38" height="38" viewBox="0 0 32 32" fill="#ee0000" aria-hidden="true"><path d="M26 16c0 1.654 1.346 3 3 3a1 1 0 1 1 0 2c-2.757 0-5-2.243-5-5s2.243-5 5-5a1 1 0 1 1 0 2c-1.654 0-3 1.346-3 3Zm3 13c-1.02 0-2.025-.116-3-.348v-3.49a1 1 0 0 0-.6-.916 9.022 9.022 0 0 1-1.737-1.008 1.063 1.063 0 0 0-.316-.156 1 1 0 0 0-.788.093l-3.014 1.744a12.96 12.96 0 0 1-3.001-5.188l3.01-1.742a1 1 0 0 0 .509-.985C20.024 16.674 20 16.34 20 16s.023-.675.06-1.005a1.01 1.01 0 0 0-.5-.98l-3.016-1.746a12.96 12.96 0 0 1 3-5.188l3.015 1.744a1.027 1.027 0 0 0 1.109-.061 9.043 9.043 0 0 1 1.735-1.004c.363-.16.597-.524.597-.92V3.348C26.975 3.116 27.98 3 29 3a1 1 0 1 0 0-2c-1.465 0-2.907.209-4.287.622A1 1 0 0 0 24 2.58v3.634a10.92 10.92 0 0 0-.981.567L19.88 4.965a.998.998 0 0 0-1.19.14 14.986 14.986 0 0 0-4.284 7.414 1 1 0 0 0 .472 1.096l3.138 1.817a9.57 9.57 0 0 0 .001 1.137l-3.14 1.816a1 1 0 0 0-.47 1.096 14.986 14.986 0 0 0 4.283 7.414 1 1 0 0 0 1.19.14l3.134-1.813c.32.208.65.4.985.571v3.627a1 1 0 0 0 .713.958c1.38.413 2.822.622 4.287.622a1 1 0 1 0 0-2Z"/></svg>
    <text class="title" x="442" y="145">Policy rollout</text>
    <text class="subtitle small" x="442" y="166">RPM + SELinux</text>
    <text class="subtitle small" x="442" y="181">modules</text>
  </g>

  <g class="node">
    <rect class="card" x="648" y="108" width="218" height="112" rx="8"/>
    <svg x="668" y="131" width="38" height="38" viewBox="0 0 32 32" fill="#ee0000" aria-hidden="true"><path d="M16 1C7.729 1 1 7.729 1 16s6.729 15 15 15 15-6.729 15-15S24.271 1 16 1Zm0 28C8.832 29 3 23.168 3 16S8.832 3 16 3s13 5.832 13 13-5.832 13-13 13Zm7.659-13c0 .379-.214.725-.553.895l-10.659 5.329a1.005 1.005 0 0 1-.973-.044 1 1 0 0 1-.474-.851V10.672a1 1 0 0 1 1.447-.895l10.659 5.329a1 1 0 0 1 .553.895Z"/></svg>
    <text class="title" x="722" y="145">Host</text>
    <text class="title" x="722" y="166">verification</text>
    <text class="subtitle" x="722" y="185">context + safe probes</text>
  </g>

  <g class="node">
    <rect class="card" x="928" y="108" width="218" height="112" rx="8"/>
    <svg x="948" y="131" width="38" height="38" viewBox="0 0 32 32" fill="#ee0000" aria-hidden="true"><path d="M25.5 6H23v-.5c0-.827-.673-1.5-1.5-1.5h-1.626C19.429 2.276 17.861 1 16 1s-3.428 1.276-3.874 3H10.5C9.673 4 9 4.673 9 5.5V6H6.5C5.673 6 5 6.673 5 7.5v22c0 .827.673 1.5 1.5 1.5h19c.827 0 1.5-.673 1.5-1.5v-22c0-.827-.673-1.5-1.5-1.5ZM11 6h2a1 1 0 0 0 1-1c0-1.103.897-2 2-2s2 .897 2 2a1 1 0 0 0 1 1h2v2H11V6Zm14 23H7V8h2v.5c0 .827.673 1.5 1.5 1.5h11c.827 0 1.5-.673 1.5-1.5V8h2v21Z"/></svg>
    <text class="title" x="1002" y="145">Audit and</text>
    <text class="title" x="1002" y="166">probe evidence</text>
    <text class="subtitle" x="1002" y="185">target-host proof</text>
  </g>

  <g class="node">
    <rect class="card" x="928" y="376" width="218" height="112" rx="8"/>
    <svg x="948" y="399" width="38" height="38" viewBox="0 0 32 32" fill="#ee0000" aria-hidden="true"><path d="M16 1C8.149 1 2 4.514 2 9v14c0 4.486 6.149 8 14 8s14-3.514 14-8V9c0-4.486-6.149-8-14-8Zm0 2c6.505 0 12 2.748 12 6s-5.495 6-12 6S4 12.252 4 9s5.495-6 12-6ZM4 13.161C6.427 15.476 10.839 17 16 17s9.573-1.524 12-3.839V16c0 3.252-5.495 6-12 6S4 19.252 4 16v-2.839ZM16 29c-6.505 0-12-2.748-12-6v-2.839C6.427 22.476 10.839 24 16 24s9.573-1.524 12-3.839V23c0 3.252-5.495 6-12 6Z"/></svg>
    <text class="title" x="1002" y="413">Write verified</text>
    <text class="title" x="1002" y="434">host marker</text>
    <text class="subtitle small" x="1002" y="452">version + scope state</text>
  </g>

  <g class="node">
    <rect class="card" x="648" y="376" width="218" height="112" rx="8"/>
    <svg x="668" y="399" width="38" height="38" viewBox="0 0 32 32" fill="#ee0000" aria-hidden="true"><path d="M28.5 1h-25C2.673 1 2 1.673 2 2.5v27c0 .827.673 1.5 1.5 1.5h25c.827 0 1.5-.673 1.5-1.5v-27c0-.827-.673-1.5-1.5-1.5ZM28 29H4V3h24v26ZM7 8a1 1 0 0 1 1-1h5a1 1 0 0 1 0 2H8a1 1 0 0 1-1-1Zm0 16a1 1 0 0 1 1-1h5a1 1 0 0 1 0 2H8a1 1 0 0 1-1-1Zm0-8a1 1 0 0 1 1-1h5a1 1 0 0 1 0 2H8a1 1 0 0 1-1-1Z"/></svg>
    <text class="title" x="722" y="413">Sync IdM</text>
    <text class="title" x="722" y="434">inventory</text>
    <text class="subtitle small" x="722" y="452">eigenstate.ipa facts</text>
  </g>

  <g class="node">
    <rect class="card" x="368" y="376" width="218" height="112" rx="8"/>
    <svg x="388" y="399" width="38" height="38" viewBox="0 0 32 32" fill="#ee0000" aria-hidden="true"><path d="M24.5 12H23V8c0-3.86-3.14-7-7-7S9 4.14 9 8v4H7.5c-.827 0-1.5.673-1.5 1.5v15c0 .827.673 1.5 1.5 1.5h17c.827 0 1.5-.673 1.5-1.5v-15c0-.827-.673-1.5-1.5-1.5ZM11 8c0-2.757 2.243-5 5-5s5 2.243 5 5v4H11V8Zm13 20H8V14h16v14Z"/></svg>
    <text class="title" x="442" y="413">AAP preflight</text>
    <text class="title" x="442" y="434">gate</text>
    <text class="subtitle small" x="442" y="452">current hosts only</text>
  </g>

  <g class="node">
    <rect class="card" x="88" y="376" width="218" height="112" rx="8"/>
    <svg x="108" y="399" width="38" height="38" viewBox="0 0 36 36" fill="#ee0000" aria-hidden="true"><path d="M21.32 17.8C27.8 14.41 25.42 4.39 18 4.38s-9.8 10-3.32 13.42A13.63 13.63 0 0 0 4.38 31a.61.61 0 0 0 .62.62h26a.61.61 0 0 0 .62-.62 13.63 13.63 0 0 0-10.3-13.2Zm-9.2-6.3c.25-7.76 11.51-7.76 11.76 0-.25 7.76-11.51 7.76-11.76 0ZM5.64 30.38c1.36-15.59 23.41-15.58 24.72 0Z"/></svg>
    <text class="title" x="162" y="413">Workflow</text>
    <text class="title" x="162" y="434">evidence</text>
    <text class="subtitle small" x="162" y="452">nodes + stdout history</text>
  </g>
</svg>
