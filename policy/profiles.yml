schema: blastwall.profile/v1
version: 1

targets:
  rhel-login:
    description: RHEL login path using blastwall_u:blastwall_r:blastwall_t:s0.
    mechanism: selinux-cil-deny
    subject_type: blastwall_t
    min_rhel: "9.4"
  ocp-spo-standard:
    description: OpenShift standard workload path using Security Profiles Operator.
    mechanism: spo-raw-selinux-profile
    usage_source: status.usage
  ocp-spo-nested:
    description: OpenShift nested workload path using Security Profiles Operator.
    mechanism: spo-raw-selinux-profile
    usage_source: status.usage

permission_sets:
  socket_all:
    - accept
    - append
    - bind
    - connect
    - create
    - getattr
    - getopt
    - ioctl
    - listen
    - lock
    - map
    - name_bind
    - read
    - recv_msg
    - recvfrom
    - relabelfrom
    - relabelto
    - send_msg
    - sendto
    - setattr
    - setopt
    - shutdown
    - write
  netlink_xfrm_socket_all:
    - accept
    - append
    - bind
    - connect
    - create
    - getattr
    - getopt
    - ioctl
    - listen
    - lock
    - map
    - name_bind
    - nlmsg_read
    - nlmsg_write
    - read
    - recv_msg
    - recvfrom
    - relabelfrom
    - relabelto
    - send_msg
    - sendto
    - setattr
    - setopt
    - shutdown
    - write
  bpf_basic:
    - map_create
    - map_read
    - map_write
    - prog_load
    - prog_run
  capability2_bpf:
    - bpf
  user_namespace_create:
    - create
  io_uring_basic:
    - cmd
    - override_creds
    - sqpoll
  selfprotect_policy:
    - security_load_policy
    - semanage_execute
    - setsebool_execute
    - load_policy_execute
    - selinux_config_write

scopes:
  alg_socket:
    description: Deny AF_ALG sockets for Blastwall automation subjects.
    status: active
    object_class: alg_socket
    class_presence: required
    permission_set: socket_all
    evidence:
      present: BLOCKED
      absent: FAIL_MISSING_CLASS_REQUIRED
    target_support:
      rhel-login:
        artifact: policy/blastwall-alg-socket-deny.cil
        validation:
          type: safe_probe
          probe: tests/trigger-copyfail-afalg.py
          required_for_release: true
          expected: BLOCKED
      ocp-spo-standard:
        artifact: openshift/spo/10-rawselinuxprofile-blastwall.yaml
        validation:
          type: safe_probe
          probe: tests/openshift/blastwall_spo_probe.py
          required_for_release: true
          expected: BLOCKED
      ocp-spo-nested:
        artifact: openshift/spo/11-rawselinuxprofile-blastwall-nested.yaml
        validation:
          type: safe_probe
          probe: tests/openshift/blastwall_spo_probe.py
          required_for_release: true
          expected: BLOCKED
  bpf:
