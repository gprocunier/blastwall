profiles:
  base:
    description: Current Blastwall deny posture.
    status: active
    scopes:
      - alg_socket
      - bpf
      - capability2_bpf
      - packet_socket
      - userns
      - io_uring
      - xfrm
      - rxrpc
      - selfprotect
  strange-socket-v1:
    description: Lab-only dry-run first-wave unusual socket-family extension.
    status: dry-run
    lifecycle: lab-only-dry-run
    extends:
      - base
    scopes:
      - xdp_socket
      - tipc_socket
      - can_socket
      - bluetooth_socket
      - nfc_socket
      - kcm_socket
      - rds_socket

variants:
  base-nested:
    description: OpenShift nested workload variant of base.
    status: active
    base_profile: base
    remove:
      - userns
    targets:
      - ocp-spo-nested
    reason: OpenShift nested workloads require pod-level user namespace behavior.
