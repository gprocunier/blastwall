    status: active
    object_class: capability2
    class_presence: required
    permission_set: capability2_bpf
    evidence:
      present: BLOCKED
      absent: FAIL_MISSING_CLASS_REQUIRED
    target_support:
      rhel-login:
        artifact: policy/blastwall-bpf-deny.cil
        validation:
          type: static_check
          evidence_source: tests/policy_static.py
          required_for_release: false
          expected: FAIL_UNKNOWN
          note: RHEL CIL is combined with bpf; no dedicated capability2_bpf runtime probe exists yet.
      ocp-spo-standard:
        artifact: openshift/spo/10-rawselinuxprofile-blastwall.yaml
        validation:
          type: static_check
          evidence_source: tests/openshift/validate_spo_manifests.py
          required_for_release: false
          expected: FAIL_UNKNOWN
          note: Static SPO validation confirms the capability2 bpf deny surface.
      ocp-spo-nested:
        artifact: openshift/spo/11-rawselinuxprofile-blastwall-nested.yaml
        validation:
          type: static_check
          evidence_source: tests/openshift/validate_spo_manifests.py
          required_for_release: false
          expected: FAIL_UNKNOWN
          note: Static SPO validation confirms the nested capability2 bpf deny surface.
